<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <p class="badge">{{ACCENT_NAME}} theme · {{OPPONENT}}</p>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{SUBTITLE}}</p>

  <div class="card">
    <p><strong id="turn" aria-live="polite">X to move</strong></p>
    <div id="board" class="grid" role="grid" aria-label="Tic-tac-toe board"></div>
  </div>

  <div class="toolbar">
    <button id="reset" type="button">New game</button>
    <p>{{ABOUT_LINK}}</p>
  </div>
  {{FOOTER}}
</main>
<script>window.GUEST_OPPONENT = '{{OPPONENT_KEY}}';</script>
<script src="app.js"></script>
</body>
</html>
