name: Substrate control plane (preflight / install)

# Installs the Agent Substrate control plane (the `ate-system` namespace:
# ateapi, ate-controller, atelet, atenet-router/egress, ate-idp-server,
# podcertificate-controller, the ate.dev CRDs and the gVisor SandboxConfig) onto
# the Substrate GKE cluster, and reports whether that is even possible yet.
#
# Why this is a workflow and not Terraform: those images are ko-built from the
# substrate checkout, so there are no static manifests to vendor faithfully —
# apply would either recreate them wrong or fight the installer over ownership.
# It CAN run on a runner, because `--image-repo` + `--image-tag` tell ate-setup
# to install the published release images instead of building anything: the job
# needs no ko, no Docker and no registry push. The manifests still come from the
# checkout, which is why the checkout and the image tag must name the same
# revision (docs/SUBSTRATE_INTEGRATION.md §5 step 3).
#
# Why its own workflow instead of another Deploy to GCP job: dispatching
# deploy.yml runs its path filters, and a branch that touches services/planner/**
# or public/** rebuilds and redeploys those Cloud Run services from that branch.
# A control-plane preflight must never be able to ship unmerged code, so nothing
# here can deploy the app.
#
# Two modes:
#   preflight  read-only. Every prerequisite reported as PASS/FAIL and the exact
#              install command printed. Safe to fire at any time; it is the
#              first thing to run after a gke_reconcile.
#   install    additionally provisions the GCS snapshot bucket + IAM that
#              ate-setup refuses to run without on GKE, then deploys ate-system.
#
# Install is not destructive of anything already running: `deploy ate-system` is
# re-runnable and rolls the control plane's pods forward. Tearing it down
# (`delete ate-system`) is deliberately not automated here — it takes actor
# state with it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - install
      version:
        description: "Substrate revision (tag). Empty = SUBSTRATE_VERSION var, else the latest upstream release"
        type: string
        default: ""

# Serialised with the cluster's other writers: gke_reconcile applies the same
# module's substrate.tf, and the power workflow parks the worker pool to zero
# overnight. Installing a control plane into a pool mid-drain races it.
concurrency:
  group: substrate-cluster-power
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation for the deployer SA

jobs:
  substrate_control_plane:
    name: ${{ inputs.mode == 'install' && 'install ate-system' || 'preflight only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLUSTER: ${{ vars.SUBSTRATE_CLUSTER_NAME || 'substrate-multitenant' }}
      ZONE: ${{ vars.SUBSTRATE_CLUSTER_ZONE || 'asia-south1-a' }}
      SUBSTRATE_REPO_URL: ${{ vars.SUBSTRATE_REPO_URL || 'https://github.com/agent-substrate/substrate' }}
      SUBSTRATE_GKE_REPO_URL: ${{ vars.SUBSTRATE_GKE_REPO_URL || 'https://github.com/ai-on-gke/substrate-gke' }}
      SUBSTRATE_IMAGE_REPO: ${{ vars.SUBSTRATE_IMAGE_REPO || 'ghcr.io/agent-substrate/substrate' }}
      SUBSTRATE_VERSION_INPUT: ${{ inputs.version }}
      SUBSTRATE_VERSION: ${{ vars.SUBSTRATE_VERSION }}
      SUBSTRATE_SNAPSHOT_BUCKET: ${{ vars.SUBSTRATE_SNAPSHOT_BUCKET }}
      SUBSTRATE_SANDBOX_CLASSES: ${{ vars.SUBSTRATE_SANDBOX_CLASSES }}
      SUBSTRATE_CREDENTIAL_PROVIDER: ${{ vars.SUBSTRATE_CREDENTIAL_PROVIDER }}
      SUBSTRATE_INGRESS_SPIFFE_IDS: ${{ vars.SUBSTRATE_INGRESS_SPIFFE_IDS }}
      SUBSTRATE_POSTGRES_STORAGE_CLASS: ${{ vars.SUBSTRATE_POSTGRES_STORAGE_CLASS }}
      SUBSTRATE_POSTGRES_STORAGE_SIZE: ${{ vars.SUBSTRATE_POSTGRES_STORAGE_SIZE }}
      SUBSTRATE_ROLLOUT_TIMEOUT: ${{ vars.SUBSTRATE_ROLLOUT_TIMEOUT }}
      SUBSTRATE_ENABLED: ${{ vars.SUBSTRATE_ENABLED }}
      SUBSTRATE_NODE_POOL: ${{ vars.SUBSTRATE_NODE_POOL }}
      SUBSTRATE_WORKER_NODE_POOL: ${{ vars.SUBSTRATE_WORKER_NODE_POOL || 'substrate-worker-pool' }}
      SUBSTRATE_WORKER_POOL: ${{ vars.SUBSTRATE_WORKER_POOL || 'planner-pool' }}
      SUBSTRATE_ATEAPI_SERVICE: ${{ vars.SUBSTRATE_ATEAPI_SERVICE }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up kubectl
        run: |
          set -euo pipefail
          # GKE 1.30+ kubeconfigs authenticate by shelling out to this plugin;
          # without it every kubectl call dies with "gke-gcloud-auth-plugin: not
          # found" and the whole job reads as a cluster outage.
          gcloud components install kubectl gke-gcloud-auth-plugin --quiet
          gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT_ID"
          kubectl get nodes >/dev/null

      - name: Resolve install settings
        id: cfg
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          version="${SUBSTRATE_VERSION_INPUT:-${SUBSTRATE_VERSION:-}}"
          if [ -z "$version" ]; then
            # No pin: take the latest upstream release, and say so loudly — a
            # control plane that quietly tracks main is not reproducible.
            version="$(curl -fsSL https://api.github.com/repos/agent-substrate/substrate/releases/latest \
              | jq -r .tag_name)" || fail "Could not resolve the latest Substrate release; set SUBSTRATE_VERSION."
            echo "::warning::No SUBSTRATE_VERSION set — installing the latest release ($version). Pin it if this cluster should not drift."
          fi
          case "$version" in
            v[0-9]*) ;;
            *) fail "Refusing a version that is not a release tag: '$version' (the checkout and the image tag must match)." ;;
          esac

          bucket="${SUBSTRATE_SNAPSHOT_BUCKET:-ate-snapshots-${PROJECT_ID//-}}"
          sandbox_classes="${SUBSTRATE_SANDBOX_CLASSES:-gvisor}"
          credential_provider="${SUBSTRATE_CREDENTIAL_PROVIDER:-{\"name\":\"k8s.io\"}}"
          spiffe_ids="${SUBSTRATE_INGRESS_SPIFFE_IDS:-spiffe://cluster.local/ns/ate-system/sa/atenet-client}"
          rollout_timeout="${SUBSTRATE_ROLLOUT_TIMEOUT:-10m}"

          # The bundled Postgres claim. Upstream ships 500Gi of headroom for WAL
          # churn; a fleet-sized control plane writes a few MB, and on
          # dynamic-rwo that 500Gi is the slowest and most expensive part of the
          # install — it is what timed out `rollout status statefulset/postgres`
          # at 10m. There is no ate-setup flag for it, so it is rewritten into the
          # checkout below.
          pg_size="${SUBSTRATE_POSTGRES_STORAGE_SIZE:-50Gi}"
          [[ "$pg_size" =~ ^[0-9]+(Mi|Gi|Ti)$ ]] \
            || fail "SUBSTRATE_POSTGRES_STORAGE_SIZE '$pg_size' is not a Kubernetes quantity like 50Gi."

          # setup-gcp's --region defaults to us-west1 and it *refuses* an existing
          # bucket whose location differs, so pass the cluster's own region: a zone
          # ends in a single letter (asia-south1-a), a region does not.
          if [[ "$ZONE" =~ ^(.+)-[a-z]$ ]]; then region="${BASH_REMATCH[1]}"; else region="$ZONE"; fi

          # GCS names cap at 63 and the microVM asset bucket is <name>-assets.
          if [ "${#bucket}" -gt 56 ]; then
            fail "SUBSTRATE_SNAPSHOT_BUCKET '$bucket' is ${#bucket} characters; the -assets suffix needs 7 of them."
          fi

          {
            echo "version=$version"
            echo "bucket=$bucket"
            echo "region=$region"
            echo "sandbox_classes=$sandbox_classes"
            echo "credential_provider=$credential_provider"
            echo "spiffe_ids=$spiffe_ids"
            echo "rollout_timeout=$rollout_timeout"
            echo "pg_size=$pg_size"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Substrate install settings"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| revision (checkout + image tag) | \`$version\` |"
            echo "| image repo | \`$SUBSTRATE_IMAGE_REPO\` |"
            echo "| snapshot bucket | \`$bucket\` |"
            echo "| bucket location | \`$region\` (= the cluster's) |"
            echo "| sandbox classes | \`$sandbox_classes\` |"
            echo "| credential provider | \`$credential_provider\` |"
            echo "| ingress SPIFFE allowlist | \`$spiffe_ids\` |"
            echo "| rollout timeout | \`$rollout_timeout\` |"
            echo "| postgres volume | \`$pg_size\` (upstream ships 500Gi) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight report
        env:
          BUCKET: ${{ steps.cfg.outputs.bucket }}
          BUCKET_REGION: ${{ steps.cfg.outputs.region }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SANDBOX_CLASSES: ${{ steps.cfg.outputs.sandbox_classes }}
          IMAGE_REPO: ${{ env.SUBSTRATE_IMAGE_REPO }}
          INGRESS_HOSTNAME: ${{ vars.SUBSTRATE_INGRESS_HOSTNAME }}
          PG_SIZE: ${{ steps.cfg.outputs.pg_size }}
          WORKER_POOL: ${{ env.SUBSTRATE_WORKER_POOL }}
          WORKER_NODE_POOL: ${{ env.SUBSTRATE_WORKER_NODE_POOL }}
        run: |
          set -uo pipefail
          # Advisory in both modes: this step never fails the job, because the
          # point of preflight is to see every gate at once instead of tripping
          # over them one run at a time. Install mode re-tests the blocking ones
          # in the next step and refuses to continue.
          {
            echo "### Prerequisites"
            echo ""
            echo "| Result | Check | Detail |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          check() { # check <label> <command...> — records a row, never fails the step
            local label="$1"; shift
            local out state detail
            # `if` is load-bearing: Actions runs a bare `run:` as
            # `bash -eo pipefail`, so a plain `out="$(false)"` assignment aborts
            # the whole step at the first FAIL — preflight would report itself
            # broken instead of reporting the prerequisite that is missing.
            if out="$("$@" 2>&1)"; then state="PASS"; else state="FAIL"; fi
            # First line only, pipes escaped. Parameter expansion rather than
            # `head -1 | tr`: a pipeline dying of SIGPIPE under pipefail trips
            # the same errexit this function exists to avoid.
            detail="${out%%$'\n'*}"
            detail="${detail:-—}"
            detail="${detail//|//}"
            echo "| $state | $label | $detail |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s  %s: %s\n' "$state" "$label" "$detail"
          }

          check "SUBSTRATE_ENABLED" bash -c 'if [ "${SUBSTRATE_ENABLED:-}" != "true" ]; then echo "repo variable is ${SUBSTRATE_ENABLED:-unset}; the substrate.tf infra is not in plan"; exit 1; fi'
          check "worker node pool" bash -c '
            [ -n "${SUBSTRATE_NODE_POOL:-}" ] \
              || { echo "SUBSTRATE_NODE_POOL is unset — substrate.tf has no pool to create"; exit 1; }
            gcloud container node-pools describe "$SUBSTRATE_NODE_POOL" \
              --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" --format "value(status)"
          '
          # Location matters: setup-gcp create bucket errors on an existing bucket
          # in another region, so a wrong-location bucket is an install failure.
          # Compare case-insensitively: gcloud reports location upper-cased
          # (ASIA-SOUTH1) while the region derived from the zone is lower-case,
          # and a raw != fails the row on a bucket that is in the right region.
          check "snapshot bucket" bash -c '
            loc="$(gcloud storage buckets describe "gs://$BUCKET" --project "$PROJECT_ID" --format "value(location)" 2>/dev/null)" \
              || { echo "gs://$BUCKET not created yet — install mode creates it in $BUCKET_REGION"; exit 1; }
            if [ "${loc^^}" != "${BUCKET_REGION^^}" ]; then
              echo "gs://$BUCKET exists in $loc, but install would need $BUCKET_REGION (the cluster region)"
              exit 1
            fi
            echo "gs://$BUCKET in $loc"
          '
          check "snapshot transfer GSA" gcloud iam service-accounts describe "ate-snapshot-transfer@${PROJECT_ID}.iam.gserviceaccount.com"
          check "ate-system namespace" kubectl get namespace ate-system
          # Informational either way: absent means a fresh install, present means
          # this deploy rolls a control plane that is already serving.
          check "existing control plane" bash -c \
            'if kubectl get crd -o name 2>/dev/null | grep -q ate.dev; then echo "ate.dev CRDs present — this deploy rolls the running control plane"; else echo "no ate.dev CRDs — fresh install"; fi'
          # The bundled Postgres claim is not a flag ate-setup takes, so install
          # rewrites the manifest — and a bound claim cannot shrink, so a size
          # mismatch means the install deletes the StatefulSet and the claim with
          # it. Say so before the run, not after the 10-minute rollout wait.
          check "postgres volume size" bash -c '
            have="$(kubectl -n ate-system get pvc data-postgres-0 \
              -o jsonpath="{.spec.resources.requests.storage}" 2>/dev/null || true)"
            if [ -z "$have" ]; then echo "no claim yet — install provisions ${PG_SIZE}"; exit 0; fi
            if [ "$have" = "$PG_SIZE" ]; then echo "data-postgres-0 is ${have} — left in place"; exit 0; fi
            echo "data-postgres-0 is ${have}, wants ${PG_SIZE} — install deletes the claim and its atespace/actor metadata"
            exit 1
          '
          # Substrate v1.0.0 needs the PodCertificate APIs (clustertrustbundles,
          # podcertificaterequests), which GKE only serves from 1.37. On 1.36 the
          # install gets as far as podcertcontroller, which CrashLoops with
          # "neither v1 nor v1beta1 PodCertificateRequest is served", and then
          # dies on the ClusterTrustBundle wait — tens of minutes in. The kubelet
          # serves pod certificates, so every node pool must be 1.37 too.
          check "GKE 1.37+ control plane and nodes" bash -c '
            minor="$(kubectl version -o json 2>/dev/null | jq -r ".serverVersion.minor" | tr -cd "0-9")"
            [ -n "$minor" ] || { echo "could not read the control plane version"; exit 1; }
            if [ "$minor" -lt 37 ]; then
              echo "control plane is 1.$minor — Substrate needs GKE 1.37+ for the PodCertificate API; upgrade the cluster before install"
              exit 1
            fi
            stale="$(kubectl get nodes -o "jsonpath={.items[*].status.nodeInfo.kubeletVersion}" | tr " " "\n" | grep -vcE "v1\.(3[7-9]|[4-9][0-9])" || true)"
            if [ "$stale" != "0" ]; then
              echo "$stale node pool node(s) below 1.37 — upgrade every pool; the kubelet is what serves pod certificates"
              exit 1
            fi
            echo "control plane 1.$minor and every node on 1.37+"
          '
          check "Envoy Gateway CRDs" kubectl get crd gateways.gateway.networking.k8s.io -o 'jsonpath={.metadata.name}'
          check "cert-manager CRDs" kubectl get crd certificates.cert-manager.io -o 'jsonpath={.metadata.name}'
          # Exists is not serving: with only the HTTPS listener, the unissued
          # certificate Secret leaves the Gateway unprogrammed and Envoy builds no
          # data plane at all, so nothing answers on port 80 and HTTP-01 can never
          # complete. See docs §5.1.
          check "substrate front serving" bash -c '
            line="$(kubectl -n ate-system get gateway substrate-ingress \
              -o jsonpath="{.status.conditions[?(@.type==\"Programmed\")].status} {.status.addresses[0].value}" 2>/dev/null)" \
              || { echo "no substrate-ingress Gateway yet — set SUBSTRATE_INGRESS_HOSTNAME and run gke_reconcile"; exit 1; }
            if [ "${line%% *}" = "True" ]; then
              echo "Programmed at ${line#True }"
              exit 0
            fi
            echo "not Programmed (${line:-no status yet}) — no Envoy data plane, so port 80 answers nothing and HTTP-01 cannot complete"
            exit 1
          '
          # Distinguishes "no hostname asked for" from "asked for and the apply
          # failed", which the Gateway row alone cannot tell apart.
          check "hostname front requested" bash -c '
            [ -n "${INGRESS_HOSTNAME:-}" ] \
              || { echo "SUBSTRATE_INGRESS_HOSTNAME unset — no static IP, Certificate or Gateway in plan"; exit 1; }
            echo "$INGRESS_HOSTNAME — IP, Certificate, EnvoyProxy and Gateway land with gke_reconcile"
          '

          # ate-setup resolves every image tag to a digest before it deploys
          # anything, so a repo or tag without the full set fails the install —
          # minutes in, after the checkout and the Go build. Names mirror
          # images.ReleaseComponents; the worker image follows the sandbox class.
          check "release images present" bash -c '
            host="${IMAGE_REPO%%/*}"
            path="${IMAGE_REPO#*/}"
            images="ateapi atelet atecontroller atenet ate-idp-server podcertcontroller envoy-dataplane objectstore-plugin kubernetes-secrets"
            case ",$SANDBOX_CLASSES," in
              *",microvm,"*) images="$images ateworker-microvm" ;;
              *) images="$images ateworker-gvisor" ;;
            esac
            if [ "$host" != "ghcr.io" ]; then
              echo "$IMAGE_REPO is not ghcr.io; confirm by hand it carries: $images"
              exit 0
            fi
            missing=""
            for img in $images; do
              token="$(curl -fsS "https://ghcr.io/token?scope=repository:$path/$img:pull" | jq -r .token)" || { missing="$missing $img(token)"; continue; }
              code="$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
                "https://ghcr.io/v2/$path/$img/manifests/$VERSION")"
              [ "$code" = "200" ] || missing="$missing $img($code)"
            done
            if [ -n "$missing" ]; then echo "absent from $IMAGE_REPO at $VERSION:$missing"; exit 1; fi
            echo "every image $VERSION needs is in $IMAGE_REPO"
          '

          # ── Sandbox capacity ──────────────────────────────────────────────
          # Everything above gates the *control plane*; these four gate whether a
          # sandbox can ever be created, which is the only thing the installer
          # cannot tell you about. ate-setup installs the WorkerPool CRD and stops
          # there — only --demo creates a pool — so a green install plus a missing
          # pool reads as "substrate is up, agents never start". Each row below was
          # a real, silent failure here once: no pool at all, a pool on a node that
          # tolerates nothing, a pool parked at zero nodes, and a disk quota spent
          # entirely on the Postgres claim.
          check "WorkerPool created" bash -c '
            kubectl get crd workerpools.ate.dev >/dev/null 2>&1 \
              || { echo "no workerpools.ate.dev CRD — install mode creates one, then this workflow creates the pool"; exit 1; }
            line="$(kubectl get workerpools.ate.dev -A --no-headers \
              -o custom-columns=REF:.metadata.namespace/.metadata.name,REPLICAS:.spec.replicas,READY:.status.readyReplicas 2>/dev/null)"
            if [ -z "$line" ]; then
              echo "no WorkerPool exists — ate-setup only installs the CRD, so nothing serves actors. Install creates one named $WORKER_POOL."
              exit 1
            fi
            row="$(grep "/$WORKER_POOL " <<<"$line" | head -1)"
            if [ -z "$row" ]; then
              echo "no pool named $WORKER_POOL, which is what the planner sends as workerSelector; present: $(tr "\n" " " <<<"$line")"
              exit 1
            fi
            # The last column is readyReplicas: a pool the controller has not
            # touched prints <none>, which blocks actors exactly as hard as 0, so
            # both fail the row rather than passing on format. Split on whitespace
            # with parameter expansion — an awk program in single quotes would end
            # this bash -c string. One line per outcome because `check` shows only
            # the first.
            ready="${row##* }"
            case "$ready" in
              ''|*[!0-9]*) echo "$row — no worker is Ready yet ($ready), so no actor can start"; exit 1 ;;
            esac
            [ "$ready" -ge 1 ] \
              || { echo "$row — 0 workers Ready, so no actor can start"; exit 1; }
            echo "$row"
          '
          # The node pool and the taint are checked together because a pool that
          # exists but repels everything looks identical from the outside: no
          # sandbox, no error, and a Pending pod whose only clue is
          # "had taint(s) that did not match the tolerations".
          check "worker node pool placement" bash -c '
            if ! gcloud container node-pools describe "$WORKER_NODE_POOL" \
              --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" >/dev/null 2>&1; then
              echo "node pool $WORKER_NODE_POOL is absent — gke_reconcile owns it (substrate.tf substrate_nodes)"
              exit 1
            fi
            # config.taints, not nodeConfig.taints: the v1 NodePool reports the
            # effective taints under config, and nodeConfig reads back null.
            taints="$(gcloud container node-pools describe "$WORKER_NODE_POOL" \
              --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" \
              --format "json(config.taints)" 2>/dev/null | jq -r "[.config.taints[]?.key] | join(\" \")")"
            if [ -z "$taints" ]; then
              echo "untainted — nothing is repelled, but actors will share the pool with generic workloads"
              exit 0
            fi
            tolerated="$(kubectl -n ate-system get ds atelet \
              -o jsonpath="{.spec.template.spec.tolerations[*].key}" 2>/dev/null | tr " " "\n" | sort -u)"
            [ -n "$tolerated" ] || { echo "taints [$taints] but atelet is not installed yet — cannot compare"; exit 1; }
            for k in $taints; do
              grep -qxF "$k" <<<"$tolerated" \
                || { echo "taint $k is tolerated by nothing — atelet would never run on this pool, so no sandbox can be created on it (atelet tolerates: $(tr "\n" " " <<<"$tolerated"))"; exit 1; }
            done
            nodes="$(kubectl get nodes -l "cloud.google.com/gke-nodepool=$WORKER_NODE_POOL" \
              -o json 2>/dev/null | jq -r "[.items[] | select(.status.conditions[]? | .type==\"Ready\" and .status==\"True\")] | length")"
            if [ "${nodes:-0}" -le 0 ]; then
              echo "taints [$(tr " " ", " <<<"$taints")] are tolerated, but the pool has 0 Ready nodes — it sits below its autoscaling minimum until a WorkerPool demands one"
              exit 1
            fi
            echo "taints [$(tr " " ", " <<<"$taints")] tolerated by atelet, $nodes Ready node(s)"
          '
          # Snapshots stage on the node boot disk, so a worker disk is a billed PD
          # in the region. pd-ssd and pd-balanced both count against SSD_TOTAL_GB —
          # the same quota the bundled Postgres claim eats — and an exhausted quota
          # does not fail fast: the node just never appears, and the install waits
          # out its rollout timeout.
          check "disk quota headroom" bash -c '
            pool="$(gcloud container node-pools describe "$WORKER_NODE_POOL" \
              --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" \
              --format "value(autoscaling.maxNodeCount,config.diskSizeGb,config.diskType)" 2>/dev/null)" \
              || { echo "node pool $WORKER_NODE_POOL absent — nothing to size"; exit 1; }
            read -r max size dtype <<<"$pool"
            case "$dtype" in
              pd-ssd|pd-balanced|hyperdisk-*) metric=SSD_TOTAL_GB ;;
              *)                               metric=DISKS_TOTAL_GB ;;
            esac
            q="$(gcloud compute regions describe "$BUCKET_REGION" --project "$PROJECT_ID" \
              --format "json(quotas)" | jq -r ".quotas[] | select(.metric==\"$metric\") | \"\\(.usage) \\(.limit)\"")"
            [ -n "$q" ] || { echo "$metric is not reported for $BUCKET_REGION — cannot check headroom"; exit 0; }
            read -r usage limit <<<"$q"
            need="$(awk -v n="$max" -v g="$size" "BEGIN{printf \"%.0f\", n*g}")"
            left="$(awk -v l="$limit" -v u="$usage" "BEGIN{printf \"%.0f\", l-u}")"
            if [ "$need" -gt "$left" ]; then
              echo "$dtype ${size}GB × $max node(s) = ${need}GB, but $metric has ${usage%.*}/${limit%.*} used and only ${left}GB left — raise the quota or lower substrate_max_nodes"
              exit 1
            fi
            echo "$dtype ${size}GB × $max node(s) = ${need}GB, within $metric at ${usage%.*}/${limit%.*} (${left}GB left)"
          '

          # The apply 403s when the CI identity was provisioned before the
          # substrateStaticIpAdmin grant existed (compute.viewer reads the static
          # IPs but cannot make one). testIamPermissions asks about the caller, and
          # in this job the caller IS the deployer SA — so this tests the real
          # thing instead of guessing from the role list. setLabels is asked about
          # alongside create because google_compute_address labels the address in a
          # second call once it exists: create alone builds substrate-ip halfway and
          # then 403s, which is the harder failure to read.
          check "static IP permission" bash -c '
            token="$(gcloud auth print-access-token 2>/dev/null)" \
              || { echo "no access token for the CI identity"; exit 1; }
            perms="compute.addresses.create compute.addresses.setLabels"
            got="$(curl -fsS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"permissions\":[\"compute.addresses.create\",\"compute.addresses.setLabels\"]}" \
              "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions")" \
              || { echo "testIamPermissions call failed"; exit 1; }
            missing=""
            for p in $perms; do
              case "$got" in
                *"$p"*) ;;
                *) missing="${missing} ${p##*.}" ;;
              esac
            done
            if [ -n "$missing" ]; then
              echo "the CI identity is missing:${missing} — gke_reconcile will 403 on substrate-ip (deploy/gcp/bootstrap.sh grants the substrateStaticIpAdmin custom role)"
              exit 1
            fi
            echo "the CI identity may create and label substrate-ip"
          '

          {
            echo ""
            echo "_Advisory run: FAIL rows are recorded, not fatal. \`install\` mode re-tests the blocking ones and refuses on them._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Refuse to install over unmet prerequisites
        if: inputs.mode == 'install'
        run: |
          set -uo pipefail
          BLOCK=()
          [ "${SUBSTRATE_ENABLED:-}" = "true" ] || BLOCK+=("SUBSTRATE_ENABLED is not true — the worker pool, namespaces, snapshot class and ingress all come from substrate.tf; run Deploy to GCP with gke_reconcile first")
          [ -n "$SUBSTRATE_NODE_POOL" ] || BLOCK+=("SUBSTRATE_NODE_POOL is unset — the installer needs to know which pool runs actors")
          gcloud container node-pools describe "$SUBSTRATE_NODE_POOL" --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" >/dev/null 2>&1 \
            || BLOCK+=("node pool '$SUBSTRATE_NODE_POOL' does not exist in $CLUSTER")
          kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1 \
            || BLOCK+=("Envoy Gateway CRDs are missing — the substrate ingress front cannot serve anything")
          if [ "${#BLOCK[@]}" -gt 0 ]; then
            for b in "${BLOCK[@]}"; do echo "::error::$b"; done
            echo "::error::Refusing to install ate-system over ${#BLOCK[@]} unmet prerequisite(s); see the Prerequisites table in the job summary."
            exit 1
          fi

      - name: Resolve the install arguments
        id: args
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
          BUCKET: ${{ steps.cfg.outputs.bucket }}
          SANDBOX_CLASSES: ${{ steps.cfg.outputs.sandbox_classes }}
          CREDENTIAL_PROVIDER: ${{ steps.cfg.outputs.credential_provider }}
          SPIFFE_IDS: ${{ steps.cfg.outputs.spiffe_ids }}
          ROLLOUT_TIMEOUT: ${{ steps.cfg.outputs.rollout_timeout }}
          PG_SC: ${{ env.SUBSTRATE_POSTGRES_STORAGE_CLASS }}
        run: |
          set -euo pipefail
          args=(--no-dev-env deploy ate-system
            --image-repo="$SUBSTRATE_IMAGE_REPO" --image-tag="$VERSION"
            --credential-provider="$CREDENTIAL_PROVIDER"
            --ingress-allowed-spiffe-ids="$SPIFFE_IDS"
            --gcp-project-id="$PROJECT_ID" --gcp-cluster-name="$CLUSTER" --gcp-cluster-location="$ZONE"
            --storage-bucket-name="$BUCKET" --snapshot-location="gs://$BUCKET/"
            --snapshot-transfer-gsa-name=ate-snapshot-transfer
            --sandbox-classes="$SANDBOX_CLASSES"
            --rollout-timeout="$ROLLOUT_TIMEOUT")
          # The cluster default StorageClass will not necessarily attach for the
          # bundled postgres StatefulSet (C4/N4 pools need dynamic-rwo); unset
          # keeps the cluster default.
          [ -n "$PG_SC" ] && args+=(--ateapi-postgres-storage-class="$PG_SC")
          # NUL-delimited: a flag value may contain spaces, and a space-delimited
          # round trip through a file would silently split it into two arguments.
          printf '%s\0' "${args[@]}" > /tmp/substrate-install-args
          {
            echo "### Install command"
            echo ""
            echo '```'
            echo "go run ./cmd/ate-setup ${args[*]}"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop here in preflight mode
        if: inputs.mode != 'install'
        run: |
          echo "Preflight only — nothing was provisioned or installed. Re-run with mode=install to apply the command in the job summary."

      - name: Fetch the installer checkouts
        if: inputs.mode == 'install'
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
          SUBSTRATE_URL: ${{ env.SUBSTRATE_REPO_URL }}
          SUBSTRATE_GKE_URL: ${{ env.SUBSTRATE_GKE_REPO_URL }}
        run: |
          set -euo pipefail
          # Both before setup-go, which reads substrate/go.mod for the toolchain.
          git clone --depth 1 --branch "$VERSION" "$SUBSTRATE_URL" substrate
          git clone --depth 1 "$SUBSTRATE_GKE_URL" substrate-gke

      - name: Set the bundled Postgres volume size
        id: pgsize
        if: inputs.mode == 'install'
        env:
          PG_SIZE: ${{ steps.cfg.outputs.pg_size }}
        run: |
          set -euo pipefail
          # ate-setup has no flag for the Postgres claim, but it reads its
          # manifests out of this checkout (installDir = manifests/ate-install),
          # so rewriting the file is the knob. The claim is the only `storage:`
          # entry in the manifest; the guard below fails the job otherwise.
          manifest=substrate/manifests/ate-install/postgres/postgres.yaml
          before="$(sed -nE 's/^[[:space:]]*storage:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "$manifest")"
          [ -n "$before" ] || { echo "::error::No storage request found in $manifest — upstream changed the manifest shape."; exit 1; }
          sed -i -E "s|^([[:space:]]*storage:[[:space:]]*).*$|\1${PG_SIZE}|" "$manifest"
          echo "Postgres claim: ${before} -> ${PG_SIZE}"

          # A claim is immutable below its own size and Kubernetes cannot shrink a
          # bound PVC, so an existing install needs the StatefulSet and its claim
          # deleted before the apply — otherwise the installer waits on a rollout
          # that keeps serving the old volume. The StorageClass is
          # reclaimPolicy=Delete, so the disk goes with the claim. This drops
          # atespace and actor metadata (snapshots live in GCS and survive); the
          # app re-provisions the atespace on its next run.
          have="$(kubectl -n ate-system get pvc data-postgres-0 \
            -o jsonpath='{.spec.resources.requests.storage}' 2>/dev/null || true)"
          if [ -n "$have" ] && [ "$have" != "$PG_SIZE" ]; then
            echo "::warning::data-postgres-0 is bound at ${have}; deleting it with the StatefulSet so ${PG_SIZE} can be provisioned."
            kubectl -n ate-system delete statefulset postgres --wait=true >/dev/null
            kubectl -n ate-system delete pvc data-postgres-0 --wait=true >/dev/null
            echo "recreated=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$have" ]; then
            echo "Existing claim is already at ${have}; left in place."
          fi
          {
            echo "### Postgres volume"
            echo ""
            echo "- manifest claim: \`$before\` -> \`$PG_SIZE\`"
            echo "- existing claim: ${have:-none}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v7
        if: inputs.mode == 'install'
        with:
          go-version-file: substrate/go.mod
          cache: false

      - name: Provision the snapshot bucket and IAM
        if: inputs.mode == 'install'
        env:
          BUCKET: ${{ steps.cfg.outputs.bucket }}
          REGION: ${{ steps.cfg.outputs.region }}
        run: |
          set -euo pipefail
          # setup-gcp is a separate Go module and is idempotent by design; it is
          # the only thing that creates the bucket and grants ate-setup demands on
          # GKE. --region because the tool defaults to us-west1 and refuses an
          # existing bucket elsewhere. --gke-nodes=false because substrate.tf owns
          # the node pool and its service account, so minting a second node SA here
          # would configure a pool nothing runs on. --atelet-snapshot-access=false
          # because from Substrate v0.6.0 every snapshot transfer runs on a
          # per-actor token, so atelet no longer needs objectAdmin on the bucket.
          # PROJECT_ID comes from the job env, which is what --project-id reads.
          go -C substrate-gke/tools/setup-gcp run . create bucket --name="$BUCKET" --region="$REGION"
          go -C substrate-gke/tools/setup-gcp run . create iam \
            --bucket="$BUCKET" --region="$REGION" --gke-nodes=false --atelet-snapshot-access=false

      - name: Install ate-system
        if: inputs.mode == 'install'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' a; do args+=("$a"); done < /tmp/substrate-install-args
          # Run from the checkout: the installer reads its manifests from there,
          # which is why the checkout and --image-tag must name the same revision.
          ( cd substrate && go run ./cmd/ate-setup "${args[@]}" )

      - name: Re-migrate the recreated database
        if: inputs.mode == 'install' && steps.pgsize.outputs.recreated == 'true'
        timeout-minutes: 15
        env:
          ROLLOUT_TIMEOUT: ${{ steps.cfg.outputs.rollout_timeout }}
        run: |
          set -euo pipefail
          # ate-api-server applies its PostgreSQL migrations only at startup — its
          # first log lines say "PostgreSQL migrations ready" and it never revisits
          # them. Deleting the claim above hands that running API server a database
          # with no tables: every pod stays Running, every query fails with
          # `relation "workers" does not exist`, workers never acquire an epoch, the
          # WorkerPool sits at 0 ready replicas and no actor is ever placed. The
          # restart is part of the rewrite, not a cleanup someone can skip.
          kubectl -n ate-system rollout restart deploy ate-api-server
          kubectl -n ate-system rollout status deploy ate-api-server --timeout="$ROLLOUT_TIMEOUT"
          if kubectl -n ate-system logs deploy/ate-api-server --tail=500 2>&1 |
               grep -q 'relation "workers" does not exist'; then
            echo "::error::ate-api-server still reads an unmigrated database after the restart — the schema was never applied."
            exit 1
          fi
          echo "- restarted \`ate-api-server\` so it migrated the fresh \`atepg\` schema" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the WorkerPool
        if: inputs.mode == 'install'
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
          IMAGE_REPO: ${{ env.SUBSTRATE_IMAGE_REPO }}
          WORKER_POOL: ${{ env.SUBSTRATE_WORKER_POOL }}
          WORKER_NODE_POOL: ${{ env.SUBSTRATE_WORKER_NODE_POOL }}
          REPLICAS: ${{ vars.SUBSTRATE_WORKER_POOL_REPLICAS || '2' }}
          ROLLOUT_TIMEOUT: ${{ steps.cfg.outputs.rollout_timeout }}
        run: |
          set -euo pipefail
          # ate-setup installs the WorkerPool CRD and stops there: a pool is a
          # user-managed object (the installer only makes one for --demo), so an
          # install that reports success has nothing to place actors on and every
          # run dies at "no worker available" with nothing wrong in the control
          # plane. This step is what closes that gap for the shared stack.
          #
          # The name is the whole contract. ate-controller stamps
          # ate.dev/worker-pool=<WorkerPool name> onto each worker pod, the ate API
          # matches a template's workerSelector against the Worker's labels, and the
          # planner sends workerSelector {ate.dev/worker-pool: <pool>} built from
          # SUBSTRATE_WORKER_POOL — so the pool must be named exactly what the
          # planner resolves, or nothing matches and every actor sits Pending.
          [[ "$WORKER_POOL" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] \
            || { echo "::error::SUBSTRATE_WORKER_POOL '$WORKER_POOL' is not a DNS label; it must equal substrate_worker_pool in deploy/gcp/terraform/variables.tf."; exit 1; }
          [[ "$REPLICAS" =~ ^[0-9]+$ ]] && [ "$REPLICAS" -ge 1 ] \
            || { echo "::error::SUBSTRATE_WORKER_POOL_REPLICAS '$REPLICAS' must be a positive integer."; exit 1; }

          WORKER_NS=substrate-workers
          kubectl create namespace "$WORKER_NS" --dry-run=client -o yaml | kubectl apply -f - >/dev/null

          # workerImage must be a concrete tag: the demo manifests carry a ko://
          # build reference, which only resolves inside upstream's own build. The
          # preflight already proved $IMAGE_REPO/ateworker-gvisor carries $VERSION,
          # and ate-setup resolves every other image the same way, so the checkout
          # and the worker stay on one revision.
          #
          # No configRef: the pool follows the class default SandboxConfig
          # (gvisor-default as installed) and moves with it. No tolerations either —
          # the controller adds the ate.dev/sandboxClass toleration for the pool's
          # own class, which is the taint substrate.tf puts on the node pool.
          #
          # resources limits are not "what the pod consumes": they advertise the
          # per-actor ceiling the ate scheduler books against. They must exceed the
          # ActorTemplate request (1000m / 1Gi default in substrate.js), or no actor
          # ever fits a worker. requests is what kube-scheduler packs the node by.
          kubectl apply -f - <<EOF
          apiVersion: ate.dev/v1
          kind: WorkerPool
          metadata:
            name: ${WORKER_POOL}
            namespace: ${WORKER_NS}
          spec:
            replicas: ${REPLICAS}
            workerImage: ${IMAGE_REPO}/ateworker-gvisor:${VERSION}
            sandboxClasses:
            - name: gvisor
            template:
              nodeSelector:
                cloud.google.com/gke-nodepool: ${WORKER_NODE_POOL}
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
          EOF

          # The pool's Deployment is created by ate-controller asynchronously, so
          # `rollout status` would fail with "no matching resources found" if it is
          # polled a moment too early.
          deadline=$((SECONDS + 180))
          until kubectl -n "$WORKER_NS" get deployment "$WORKER_POOL" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::ate-controller never created a Deployment for WorkerPool ${WORKER_NS}/${WORKER_POOL}."
              kubectl -n "$WORKER_NS" describe workerpool "$WORKER_POOL" | tail -25 || true
              exit 1
            fi
            sleep 5
          done
          kubectl -n "$WORKER_NS" rollout status deployment "$WORKER_POOL" --timeout="$ROLLOUT_TIMEOUT"

          {
            echo "### WorkerPool"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| name / namespace | \`${WORKER_POOL}\` / \`${WORKER_NS}\` |"
            echo "| replicas | \`${REPLICAS}\` |"
            echo "| workerImage | \`${IMAGE_REPO}/ateworker-gvisor:${VERSION}\` |"
            echo "| nodeSelector | \`cloud.google.com/gke-nodepool=${WORKER_NODE_POOL}\` |"
            echo "| per-actor ceiling (limits) | \`2 CPU / 4Gi\` per worker |"
            echo ""
            echo "The planner must send \`workerSelector {ate.dev/worker-pool: ${WORKER_POOL}}\` —"
            echo "set \`substrate_worker_pool\` to the same string in the Terraform workspace."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report what landed
        if: inputs.mode == 'install'
        env:
          ATEAPI_SERVICE: ${{ env.SUBSTRATE_ATEAPI_SERVICE }}
        run: |
          set -uo pipefail
          {
            echo "### Installed control plane"
            echo ""
            echo '```'
            # || true so a half-installed control plane still produces the report
            # — that is the case an operator most needs to read.
            kubectl -n ate-system get deploy,sts,svc 2>&1 || true
            echo
            kubectl get crd 2>&1 | grep ate.dev || echo "(no ate.dev CRDs — the install did not land)"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # substrate.tf routes the public control-plane path to
          # var.substrate_ateapi_service (default `ateapi`). That name is an
          # assumption about what the installer creates, so read it off the
          # cluster: a wrong guess fails as a silent 503 through the ingress
          # rather than as a plan error.
          SERVICES="$(kubectl -n ate-system get svc -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.ports[0].port}{"\n"}{end}' 2>/dev/null || true)"
          ATEAPI_LINE="$(printf '%s\n' "$SERVICES" | grep -E '^(ateapi|ate-api-server|ateapi-server)( |$)' | head -1 || true)"
          if [ -z "$ATEAPI_LINE" ]; then
            echo "::warning::No ateapi-looking Service in ate-system. Services seen: $(tr '\n' ' ' <<<"$SERVICES")"
            echo "⚠️ Could not confirm the ateapi Service name — set \`SUBSTRATE_ATEAPI_SERVICE\` to whichever of the above serves the Control gRPC API."
          else
            echo "✅ ateapi Service: \`$ATEAPI_LINE\` — must match \`var.substrate_ateapi_service\` (currently \`${ATEAPI_SERVICE:-ateapi}\`) and the Settings \`substrateUrl\`."
          fi
          echo "Next: fill Settings → Models & runtime → Execution substrate (docs/SUBSTRATE_INTEGRATION.md §5.1), then \`curl -s \$GW/api/agent/substrate/status | jq .substrate\` and expect \`connected: true\`." >> "$GITHUB_STEP_SUMMARY"
