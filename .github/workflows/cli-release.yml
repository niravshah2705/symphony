name: Release adlc CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to release, for example 1.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: adlc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: npm run cli:release -- --version "$VERSION"
