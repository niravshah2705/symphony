name: Checks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        required: true
        default: all
        options:
          - all
          - node
          - e2e
          - org
          - settings

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks
        env:
          CHECKS_SUITE: ${{ inputs.suite }}
        run: npm run checks -- --suite "$CHECKS_SUITE"
