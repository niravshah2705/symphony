name: Checks

# Runs the test suites as required checks on every PR and on pushes to main.
# (Deploy/release live in their own workflows; this one only verifies.)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Terraform and Alloy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deploy/gcp/terraform
      - name: Initialize Terraform without remote state
        run: terraform init -backend=false
        working-directory: deploy/gcp/terraform
      - name: Validate Terraform
        run: terraform validate
        working-directory: deploy/gcp/terraform
      - name: Build the Alloy collector image
        run: docker build -f deploy/gcp/Dockerfile.alloy -t ai-fleet-alloy:check .
      - name: Validate the Alloy configuration
        run: |
          docker run --rm \
            -e GCP_PROJECT_ID=example-project \
            -e GCP_REGION=asia-south1 \
            -e DEPLOYMENT_ENVIRONMENT=test \
            -e GRAFANA_METRICS_URL=https://example.invalid/api/prom/push \
            -e GRAFANA_METRICS_USERNAME=123456 \
            -e GRAFANA_LOKI_URL=https://example.invalid/loki/api/v1/push \
            -e GRAFANA_LOKI_USERNAME=123456 \
            -e GRAFANA_CLOUD_TOKEN=validation-only \
            -e GRAFANA_CLOUD_RUN_SERVICE_REGEX='.*' \
            -e GRAFANA_CLOUD_RUN_JOB_REGEX='.*' \
            -e GRAFANA_PUBSUB_RESOURCE_REGEX='.*' \
            -e GRAFANA_GCS_BUCKET_REGEX='.*' \
            -e GRAFANA_ARTIFACT_REPOSITORY_REGEX='.*' \
            -e GRAFANA_LOG_SUBSCRIPTION=projects/example-project/subscriptions/example-logs \
            ai-fleet-alloy:check validate /etc/alloy/config.alloy

  node-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Pass explicit *.test.* globs, not bare source dirs: on Node 22 `node
      # --test <dir>` runs the directory as an entry module (globbing was the
      # Node 20 behavior), which would execute services/gateway/src/index.js and
      # boot the server → hang. Node expands the quoted globs (needs Node 21+).
      - run: >-
          node --test
          "packages/shared-core/src/**/*.test.js"
          "packages/shared/src/**/*.test.js"
          "packages/cli/src/**/*.test.js"
          "public/js/*.test.mjs"
          "services/gateway/src/**/*.test.js"
          "services/planner/src/**/*.test.js"
          "services/coder/src/**/*.test.js"
          "services/orchestrator/src/**/*.test.js"
          "services/tester/src/**/*.test.js"
          "services/deployer/src/**/*.test.js"
          "services/email/src/**/*.test.js"
          "services/proxy/src/**/*.test.js"
          "deploy/gcp/**/*.test.js"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The e2e project uses the "chrome" channel (see playwright.config.js).
      - run: npx playwright install --with-deps chrome
      # CI=true makes Playwright start its own webServer (npm start) fresh.
      - run: npm run test:e2e
        env:
          CI: 'true'

  org-tests:
    name: Org service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      # Emulator-free: the suite runs on the in-memory Firestore fake.
      - run: pytest -q

  settings-tests:
    name: Settings service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      # Emulator-free: the suite runs on the in-memory Firestore fake.
      - run: pytest -q
