name: Substrate cluster power (start/stop)

# Turns every node pool in the cluster off (zero nodes) and on again: the tenant
# pool, the optional Substrate worker pool, and the system pool the platform
# add-ons live on. The control plane and the static IPs survive either way. The
# Envoy gateway pods have no node to run on while the system pool is parked, so
# the hosted site and cert-manager's renewals are down for the stop window —
# that spend is in scope now that the add-ons carry load.
#
# Why this workflow drains instead of only setting min-nodes=0:
#
#   1. It used to assert autoscaling.minNodeCount — the value it had just
#      written — so a pool still holding nodes went green. The stop run is now
#      judged on observed Ready nodes in the pool, not on config.
#   2. Setting min 0 deletes nothing when the pool has work on it. A Pod no
#      controller owns cannot be evicted at all (the autoscaler reports
#      no.scale.down.node.pod.not.backed.by.controller), and the singleton
#      platform add-ons sharing that node are reported as unmovable
#      (no.scale.down.node.pod.kube.system.unmovable). Draining removes both
#      blockers, and --force is what lets the pods with no controller go.
#   3. The add-ons are still moved off the tenant pool first, into their own
#      system pool (deploy/gcp/terraform-substrate-gke pins them to node pool
#      substrate-system-node-pool): evict Envoy Gateway, cert-manager or the
#      agentgateway controller while it sits on a tenant node and the autoscaler
#      buys that node straight back, so the stop churns forever. The placement
#      preflight below refuses to drain while any of them still sits on a tenant
#      node. The system pool is therefore drained last, and every pool's ceiling
#      goes to 0 *before* its nodes are drained: the add-ons are
#      Deployment-backed, so an eviction that lands while max is still >0 just
#      re-buys the node it freed.
#
# Zero is forced with --max-nodes=0 rather than by resizing the managed instance
# group directly: GKE's node-pool controller owns MIG size and reconciles a
# hand-written size back to its own target, which can hand the pool brand-new
# nodes. max 0 is the supported way to say "target size 0", and it takes effect
# immediately instead of waiting out the ~10 minute idle threshold an empty pool
# would otherwise scale down on.
#
# Autoscaling is never disabled, and the resting parked bounds stay min 0 /
# max 8 (tenant) and min 0 / max 3 (system): deploy.yml's gke_reconcile job
# reads the live pools' bounds and feeds them back to Terraform, and a pool with
# autoscaling off reports no bounds at all (this pool's initialNodeCount is
# null), so it would silently plan the pool down to max_nodes=1 — or, for the
# system pool, back up to the module's system_min_nodes=1.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Cluster power action
        type: choice
        required: true
        options: [start, stop]
  schedule:
    # 00:00 IST = 18:30 UTC (previous day)
    - cron: "30 18 * * *"
      id: nightly-stop
    # 08:30 IST Mon–Fri = 03:00 UTC Mon–Fri
    - cron: "0 3 * * 1-5"
      id: morning-start

concurrency:
  group: substrate-cluster-power
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  power:
    # Scheduled runs are opt-in via the SUBSTRATE_CLUSTER_AUTOSTOP repo variable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.SUBSTRATE_CLUSTER_AUTOSTOP == 'true')
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLUSTER: ${{ vars.SUBSTRATE_CLUSTER_NAME || 'substrate-multitenant' }}
      ZONE: ${{ vars.SUBSTRATE_CLUSTER_ZONE || 'asia-south1-a' }}
      NODE_POOL: ${{ vars.SUBSTRATE_TENANT_NODE_POOL || 'substrate-node-pool' }}
      SYSTEM_NODE_POOL: ${{ vars.SUBSTRATE_SYSTEM_NODE_POOL || 'substrate-system-node-pool' }}
      MAX_NODES: ${{ vars.SUBSTRATE_TENANT_MAX_NODES || '8' }}
      START_MIN_NODES: ${{ vars.SUBSTRATE_TENANT_MIN_NODES || '2' }}
      SYSTEM_MAX_NODES: ${{ vars.SUBSTRATE_SYSTEM_MAX_NODES || '3' }}
      SYSTEM_START_MIN_NODES: ${{ vars.SUBSTRATE_SYSTEM_MIN_NODES || '1' }}
      # SUBSTRATE_NODE_POOL is the Substrate *worker* pool (the actor nodes), not
      # the tenant pool above: the module names them substrate-node-pool and
      # substrate-worker-pool respectively, and only the worker pool is optional.
      # Empty leaves these steps skipped.
      SUBSTRATE_NODE_POOL: ${{ vars.SUBSTRATE_NODE_POOL }}
      SUBSTRATE_MAX_NODES: ${{ vars.SUBSTRATE_MAX_NODES || '4' }}
      SUBSTRATE_START_MIN_NODES: ${{ vars.SUBSTRATE_MIN_NODES || '1' }}
      DRAIN_TIMEOUT: 300s
      SETTLE_TIMEOUT: 900
    steps:
      - name: Resolve action
        id: action
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ inputs.action }}
          SCHEDULE_ID: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) ACTION="$DISPATCH_ACTION" ;;
            schedule)
              [ "$SCHEDULE_ID" = "nightly-stop" ] && ACTION="stop" || ACTION="start"
              ;;
            *) echo "::error::Unsupported event: $EVENT_NAME"; exit 1 ;;
          esac
          # Allow-list: never pass an unvalidated value on.
          case "$ACTION" in
            start|stop) echo "action=$ACTION" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid action: $ACTION"; exit 1 ;;
          esac

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # gh-deployer carries roles/container.admin; no GCP_CONTAINER_SA override exists.
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up kubectl
        run: |
          set -euo pipefail
          # From GKE 1.30 the kubeconfig `get-credentials` writes authenticates by
          # shelling out to this plugin; without it every kubectl call dies with
          # "exec: gke-gcloud-auth-plugin: not found".
          gcloud components install kubectl gke-gcloud-auth-plugin --quiet
          gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT_ID"
          kubectl get nodes >/dev/null

      - name: Preflight drain permissions
        env:
          IDENTITY: ${{ secrets.GCP_DEPLOYER_SA }}
        run: |
          set -uo pipefail
          # container.admin maps this identity to cluster-admin, so these normally
          # pass. A pool-scoped role instead needs the ClusterRole in deploy/gcp/
          # terraform-substrate-gke/ci_rbac.tf, whose binding only exists when
          # power_ci_sa_email is set in terraform.tfvars.
          MISSING=()
          require() {
            kubectl auth can-i "$@" >/dev/null 2>&1 || MISSING+=("kubectl auth can-i $*")
          }
          require get nodes
          require patch nodes
          require list pods --all-namespaces
          require delete pods --all-namespaces
          require create pods/eviction --all-namespaces
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::$IDENTITY cannot drain nodes; refusing to start a partial stop."
            printf '  %s\n' "${MISSING[@]}"
            echo "Fix: grant the role in deploy/gcp/bootstrap.sh, or set"
            echo "power_ci_sa_email = \"$IDENTITY\" in terraform.tfvars and apply"
            echo "deploy/gcp/terraform-substrate-gke/ci_rbac.tf."
            kubectl auth whoami || true
            exit 1
          fi
          echo "Drain permissions OK for $IDENTITY"

      - name: Preflight platform placement
        if: steps.action.outputs.action == 'stop'
        run: |
          set -euo pipefail
          SYS_NODES="$(kubectl get nodes -l "cloud.google.com/gke-nodepool=$SYSTEM_NODE_POOL" \
            -o json | jq -c '[.items[].metadata.name]')"
          if [ "$(jq 'length' <<<"$SYS_NODES")" -lt 1 ]; then
            # Normal for a second stop: this pool is parked by the stop path too,
            # so the add-ons are already down and come back with `start`.
            echo "::notice::Node pool $SYSTEM_NODE_POOL has no nodes; its add-ons are already stopped."
          fi
          # The namespaces holding the pods pinned to the system pool. Any of them
          # Running somewhere other than a system node means the pinning has not
          # taken effect, and evicting them would have the autoscaler re-buy that
          # node before the stop can finish.
          # The namespaces whose only pods must sit on the system pool. ate-system
          # is deliberately absent: it also hosts the substrate control plane,
          # which belongs on the worker pool, so listing it would make this refuse
          # a legitimate stop.
          STRAY="$(kubectl get pods -A -o json | jq -r --argjson sys "$SYS_NODES" '
            [.items[]
             | select(.metadata.namespace
                      | IN("cert-manager", "envoy-gateway-system", "agentgateway-system"))
             | select((.status.phase // "") == "Running")
             | select(.spec.nodeName != null)
             | select(.spec.nodeName as $n | ($sys | index($n)) | not)
             | "  \(.metadata.namespace)/\(.metadata.name) on \(.spec.nodeName)"] | .[]')"
          if [ -n "$STRAY" ]; then
            echo "::error::Platform pods are still on non-system nodes; refusing to drain them."
            echo "$STRAY"
            echo "Fix: terraform apply so the Helm releases and the EnvoyProxy carry"
            echo "nodeSelector cloud.google.com/gke-nodepool, wait for those pods to land on the"
            echo "$SYSTEM_NODE_POOL nodes, then re-run stop."
            exit 1
          fi
          echo "Platform pods all run on: $(jq -r 'join(", ")' <<<"$SYS_NODES")"

      - name: Select pools in scope
        id: pools
        run: |
          set -euo pipefail
          # One row per pool, in stop order: capacity first, the pool holding the
          # platform add-ons last (see the header). role|pool|min|max.
          pool_spec="tenant|$NODE_POOL|$START_MIN_NODES|$MAX_NODES"
          if [ -n "$SUBSTRATE_NODE_POOL" ]; then
            pool_spec+=$'\n'"substrate|$SUBSTRATE_NODE_POOL|$SUBSTRATE_START_MIN_NODES|$SUBSTRATE_MAX_NODES"
          fi
          pool_spec+=$'\n'"system|$SYSTEM_NODE_POOL|$SYSTEM_START_MIN_NODES|$SYSTEM_MAX_NODES"
          { echo 'pool_spec<<EOF'; printf '%s\n' "$pool_spec"; echo 'EOF'; } >> "$GITHUB_ENV"

          # Shared by the stop/start steps below; RUNNER_TEMP lives for the job.
          cat >"$RUNNER_TEMP/pools.sh" <<'LIB'
          pool_rows() {
            # Echoes the pool_spec rows; the callers loop over them in an array so
            # that gcloud/kubectl inside the loop cannot swallow its stdin.
            printf '%s\n' "$pool_spec"
          }

          ready_nodes() { # $1=pool -> prints the Ready node count, or fails
            local json
            # A failed kubectl call is not a node count of zero. Only a list the API
            # server actually served may end a wait loop, or the whole stop would go
            # green on an expired token — the failure mode this step replaces.
            if ! json="$(kubectl get nodes -l "cloud.google.com/gke-nodepool=$1" -o json 2>&1)"; then
              echo "node list not served yet: $json" >&2
              return 1
            fi
            # Only Ready nodes count: a node being deleted lingers as NotReady, and
            # one being created stays NotReady until kubelet registers.
            jq -r '[.items[]
                   | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))]
                   | length' <<<"$json"
          }

          wait_for_nodes() { # $1=pool $2=goal $3=le|ge $4=timeout-seconds
            local deadline=$((SECONDS + $4)) count status
            while :; do
              if count="$(ready_nodes "$1")"; then
                status="$(gcloud container node-pools describe "$1" \
                  --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" \
                  --format 'value(status)' 2>/dev/null || echo UNKNOWN)"
                echo "pool=$1 ($status) ready_nodes=$count (want $3 $2)"
                if [ "$3" = le ] && [ "$count" -le "$2" ]; then return 0; fi
                if [ "$3" = ge ] && [ "$count" -ge "$2" ]; then return 0; fi
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Pool $1 did not reach $3 $2 Ready node(s) in $4s."
                kubectl get nodes -o wide --no-headers || true
                return 1
              fi
              sleep 15
            done
          }

          set_bounds() { # $1=pool $2=min $3=max
            gcloud container node-pools update "$1" \
              --cluster "$CLUSTER" \
              --location "$ZONE" \
              --project "$PROJECT_ID" \
              --enable-autoscaling \
              --min-nodes="$2" \
              --max-nodes="$3" \
              --quiet
          }

          drain_pool() { # $1=pool
            local nodes=() n
            mapfile -t nodes < <(kubectl get nodes -l "cloud.google.com/gke-nodepool=$1" \
              -o json | jq -r '.items[].metadata.name')
            echo "Draining ${#nodes[@]} node(s) from $1: ${nodes[*]:-none}"
            # ${nodes[@]+...}: an empty array is a legal ${#nodes[@]}=0 but trips
            # set -u on bash < 4.4, and a pool that is already parked is the
            # common case for a scheduled stop.
            for n in ${nodes[@]+"${nodes[@]}"}; do
              echo "::group::drain $n"
              # --force: pods with no backing controller are refused by a plain
              # drain, and an actor or a finished bare Job is exactly what is left
              # on a tenant node. --ignore-daemonsets: the per-node GKE agents
              # (anetd, fluent-bit, node-local-dns, ...) are recreated wherever a
              # node exists and do not block scale-down.
              if ! kubectl drain "$n" --ignore-daemonsets --delete-emptydir-data --force \
                --grace-period=30 --timeout="$DRAIN_TIMEOUT"; then
                # The add-ons carry PodDisruptionBudgets and, with every pool already
                # at max 0, nothing they evict to can be placed — so the eviction API
                # refuses by design here. --disable-eviction deletes them outright,
                # which is only correct because the whole pool is going away.
                echo "Drain of $n refused; retrying with --disable-eviction"
                kubectl drain "$n" --ignore-daemonsets --delete-emptydir-data --force \
                  --disable-eviction --grace-period=30 --timeout="$DRAIN_TIMEOUT" || return 1
              fi
              echo "::endgroup::"
            done
          }
          LIB
          echo "Pools in scope:"
          printf '%s\n' "$pool_spec" | sed 's/^/  /'

      - name: Stop — drain and park every pool at zero
        id: stopped
        if: steps.action.outputs.action == 'stop'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pools.sh"
          rows=()
          mapfile -t rows < <(pool_rows)
          : >"$RUNNER_TEMP/pools_touched"
          for row in "${rows[@]}"; do
            IFS='|' read -r role pool _ _ <<<"$row"
            [ -n "$pool" ] || continue
            echo "$pool" >>"$RUNNER_TEMP/pools_touched"
            echo "::group::stop $role ($pool)"
            # 0/0 is the explicit "target size 0", and the ceiling has to be down
            # before the eviction: a controller-backed add-on pod rescheduled while
            # max is still >0 makes the autoscaler re-buy the node just freed.
            set_bounds "$pool" 0 0
            drain_pool "$pool"
            wait_for_nodes "$pool" 0 le "$SETTLE_TIMEOUT"
            echo "::endgroup::"
          done

      - name: Recover on failure
        if: >-
          failure() &&
          steps.action.outputs.action == 'stop' &&
          steps.pools.outcome == 'success'
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/pools.sh"
          # A half-finished stop is otherwise left worse than before it ran: the
          # drain cordons its node, and the 0/0 ceiling written before the drain
          # means the autoscaler can neither reuse it nor replace it. Uncordon and
          # restore the running bounds so the cluster self-heals to started; the
          # operator can re-run stop once the blocker is fixed. Only pools this run
          # actually wrote bounds on are touched — a stop that fails at a preflight
          # must leave an already-parked cluster parked.
          rows=()
          mapfile -t rows < <(pool_rows)
          for row in "${rows[@]}"; do
            IFS='|' read -r role pool min max <<<"$row"
            [ -n "$pool" ] || continue
            if ! [ -f "$RUNNER_TEMP/pools_touched" ] ||
              ! grep -qxF "$pool" "$RUNNER_TEMP/pools_touched"; then
              continue
            fi
            kubectl get nodes -l "cloud.google.com/gke-nodepool=$pool" \
              -o json | jq -r '.items[].metadata.name' | while read -r n; do
                [ -n "$n" ] && kubectl uncordon "$n" || true
              done
            echo "Restoring $role pool $pool to min $min / max $max"
            set_bounds "$pool" "$min" "$max" || true
          done

      - name: Park pool bounds
        # Restore the resting bounds after the forced 0/0: a pool left at max 0 can
        # never wake for an incoming sandbox or add-on, and deploy.yml's
        # gke_reconcile job reads these bounds back into Terraform.
        if: >-
          always() &&
          steps.action.outputs.action == 'stop' &&
          steps.stopped.outcome == 'success'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pools.sh"
          rows=()
          mapfile -t rows < <(pool_rows)
          for row in "${rows[@]}"; do
            IFS='|' read -r role pool min max <<<"$row"
            [ -n "$pool" ] || continue
            echo "Parking $role pool $pool at min 0 / max $max"
            set_bounds "$pool" 0 "$max"
          done

      - name: Start — bring every pool back up
        id: started
        if: steps.action.outputs.action == 'start'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pools.sh"
          rows=()
          mapfile -t rows < <(pool_rows)
          # Reverse of stop order: the system pool first, so the add-ons have a node
          # to schedule onto before sandbox capacity appears (and before the next
          # stop's placement preflight expects them pinned there).
          for ((i = ${#rows[@]} - 1; i >= 0; i--)); do
            IFS='|' read -r role pool min max <<<"${rows[$i]}"
            [ -n "$pool" ] || continue
            echo "::group::start $role ($pool)"
            set_bounds "$pool" "$min" "$max"
            wait_for_nodes "$pool" "$min" ge "$SETTLE_TIMEOUT"
            echo "::endgroup::"
          done

      - name: Wait for platform add-ons
        # The add-ons were evicted with everything else, so a start is not done
        # until they are back: the public hostname serves nothing before Envoy does.
        if: steps.action.outputs.action == 'start'
        env:
          ADDON_TIMEOUT: 300
        run: |
          set -uo pipefail
          NAMESPACES=(envoy-gateway-system cert-manager agentgateway-system)
          if [ -n "$SUBSTRATE_NODE_POOL" ]; then NAMESPACES+=(ate-system); fi
          RC=0
          for ns in "${NAMESPACES[@]}"; do
            # Only deployments that ask for pods: a scaled-to-zero deployment never
            # reaches Available, and waiting on it would turn a good start red.
            deps="$(kubectl -n "$ns" get deploy -o json 2>/dev/null | jq -r '
              [.items[] | select((.spec.replicas // 0) > 0) | .metadata.name] | .[]')"
            if [ -z "$deps" ]; then
              echo "$ns: no deployment to wait for"
              continue
            fi
            # shellcheck disable=SC2086 # one name per line, no spaces expected
            if kubectl -n "$ns" wait --for=condition=Available deployment $deps \
              --timeout="${ADDON_TIMEOUT}s"; then
              echo "$ns: all deployments Available"
            else
              echo "::error::$ns did not come back within ${ADDON_TIMEOUT}s"
              kubectl -n "$ns" get pods -o wide || true
              RC=1
            fi
          done
          exit "$RC"

      - name: Report cluster state
        # Runs after a failure too: which pool is stuck at what size is the whole
        # diagnosis of a half-finished stop.
        if: always() && steps.action.outcome == 'success'
        env:
          ACTION: ${{ steps.action.outputs.action }}
        run: |
          set -uo pipefail
          : "${pool_spec:=}" # unset when the Select step never ran; the loop below no-ops
          gcloud container node-pools list --cluster "$CLUSTER" \
            --location "$ZONE" --project "$PROJECT_ID" \
            --format 'table(name, status, autoscaling.minNodeCount, autoscaling.maxNodeCount, autoscaling.totalNodes, config.machineType)'
          echo
          kubectl get nodes -L cloud.google.com/gke-nodepool || echo "(no nodes registered — expected after a stop)"
          echo
          {
            echo "### Substrate cluster ${ACTION}"
            echo
            while IFS='|' read -r role pool _ _; do
              [ -n "$pool" ] || continue
              echo "- $role pool \`$pool\`: $(kubectl get nodes -l "cloud.google.com/gke-nodepool=$pool" -o json 2>/dev/null | jq '.items | length') node(s)"
            done <<<"$pool_spec"
            if [ "$ACTION" = stop ]; then
              echo
              echo "All pools including \`$SYSTEM_NODE_POOL\` are at zero: the Envoy gateway has no"
              echo "backing pods, so the public hostname (and cert-manager renewals) stay down until start."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

