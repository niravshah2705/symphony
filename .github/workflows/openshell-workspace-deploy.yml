name: OpenShell workspace deploy

# Rolls the per-tenant openshell-workspace helm releases automatically when
# the vendored chart or tenant config changes on main. Change detection comes
# from tenant_config.tf: the chart dir is checksummed (archive_file) into
# global.chartHash, so any chart file edit plans a helm upgrade.
#
# Apply is -target-scoped to the tenant resources only — it never rolls the
# gateway, Envoy, cert-manager or the cluster itself. Safe while the cluster
# is "stopped" (power workflow scales nodes, the control plane stays up).

on:
  push:
    branches: [main]
    paths:
      - "deploy/gcp/terraform-openshell-gke/charts/openshell-workspace/**"
      - "deploy/gcp/terraform-openshell-gke/tenant_config.tf"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (do not apply)
        type: boolean
        default: false

concurrency:
  group: openshell-gke-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: deploy/gcp/terraform-openshell-gke
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLUSTER: ${{ vars.OPENSHELL_CLUSTER_NAME || 'openshell-multitenant' }}
  ZONE: ${{ vars.OPENSHELL_CLUSTER_ZONE || 'asia-south1-a' }}
  TENANTS: ${{ vars.OPENSHELL_TENANTS || 'tenant-a tenant-b' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      # Resource-level targets covering everything the paths: filter can
      # change. for_each resources are addressed without an index.
      TF_TARGETS: >-
        -target=kubernetes_namespace_v1.tenants
        -target=kubernetes_network_policy_v1.tenant_default_deny
        -target=kubernetes_network_policy_v1.tenant_allow_dns
        -target=kubernetes_resource_quota_v1.tenant_quota
        -target=kubernetes_limit_range_v1.tenant_limit_range
        -target=kubernetes_role_v1.tenant_admin
        -target=kubernetes_role_binding_v1.tenant_admins
        -target=helm_release.tenant_workspace
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CONTAINER_SA != '' && secrets.GCP_CONTAINER_SA || secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Lint vendored chart
        working-directory: ${{ env.TF_DIR }}
        run: helm lint charts/openshell-workspace

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'adlc-9e72f-tfstate' }}" \
            -backend-config="prefix=openshell/gke"

      - name: Terraform plan (tenant workspace scope)
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -no-color $TF_TARGETS -out=ws.tfplan

      - name: Terraform apply
        if: ${{ !(inputs.dry_run == true) }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -no-color ws.tfplan

      - name: Verify releases
        if: ${{ !(inputs.dry_run == true) }}
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID"
          for ns in $TENANTS; do
            helm -n "$ns" list --filter "openshell-workspace-"
          done
