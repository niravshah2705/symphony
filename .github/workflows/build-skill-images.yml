name: Build standalone agent skill artifacts

# Publishes the kagent standalone-skill OCI artifacts to ghcr.io, driven by
# deploy/kagent/skills.csv — the sibling of build-plugin-images.yml for packs that
# are ONE skill directory rather than an Agent Plugins 1.0.0 bundle.
#
# They share the shape of the pipeline (plan from CSV, validate on PR, publish on
# merge, stamp the digest back) and differ in three ways that matter:
#   - the preflight is scripts/verify-skill-artifacts.sh, which checks that
#     <skill_path>/SKILL.md exists at the pin and names itself after the row,
#     because an unversioned upstream has no version string to compare against;
#   - the artifact is composed by deploy/kagent/compose-skill-bundle.sh, which
#     authors no plugin.json and takes no skills allowlist;
#   - no :latest tag. A skill's version IS its pin, so a moving alias would be a
#     second name for bytes no manifest names.
#
# A push to main publishes only the rows whose bytes moved — same rule and same
# selector as build-plugin-images.yml: the artifact build is not byte-reproducible,
# so republishing an unchanged skill would rewrite its committed manifest with a
# digest nothing produced. A change to compose-skill-bundle.sh, skill-inputs.sh or
# this workflow selects every row, because it changes the recipe for all of them;
# a plugin-track change selects none.
#
# A standalone skill is mounted through AgentTemplate `spec.skills[].source.oci`
# with a `path:`, not `spec.plugins[]`.

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/kagent/skills.csv"
      - "deploy/kagent/skills/**"
      - "deploy/kagent/compose-skill-bundle.sh"
      - "deploy/kagent/skill-inputs.sh"
      - "deploy/kagent/build-skill-image.sh"
      - "deploy/kagent/select-published-rows.py"
      - "packages/shared-core/src/agent/registry/**"
      - "scripts/verify-skill-artifacts.sh"
      - "scripts/stamp-plugin-digest.js"
      - "scripts/gen-kagent-manifests.js"
      - "scripts/seed-plugin-catalog.js"
      - ".github/workflows/build-skill-images.yml"
  pull_request:
    paths:
      - "deploy/kagent/skills.csv"
      - "deploy/kagent/skills/**"
      - "deploy/kagent/compose-skill-bundle.sh"
      - "deploy/kagent/skill-inputs.sh"
      - "deploy/kagent/build-skill-image.sh"
      - "deploy/kagent/select-published-rows.py"
      - "packages/shared-core/src/agent/registry/**"
      - "scripts/verify-skill-artifacts.sh"
      - "scripts/gen-kagent-manifests.js"
      - "scripts/seed-plugin-catalog.js"
      - ".github/workflows/build-skill-images.yml"
  workflow_dispatch:
    inputs:
      skill:
        description: "Only build this skill (e.g. security-audit). Leave empty for all."
        required: false
        default: ""
      rebuild:
        description: "all = every manifest row (use after a composer change); changed = only rows whose bytes moved since the previous commit."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - changed

permissions:
  contents: read
  packages: write

concurrency:
  group: skill-artifacts-${{ github.ref }}
  # Mid-push cancellation can leave a manifest list pointing at a partially
  # uploaded set, and the digest is what the manifests pin.
  cancel-in-progress: false

env:
  MANIFEST: deploy/kagent/skills.csv

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select-rows.outputs.matrix }}
      reason: ${{ steps.select-rows.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The selection diff needs the commit this run started from.
          fetch-depth: 0

      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD: ${{ github.event.inputs.rebuild }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT_NAME" in
            # A PR publishes nothing, so it resolves every row and validates it:
            # the diff would only weaken the one run that has to catch a bad row.
            pull_request)
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "reason=PR run validates every row" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              # A force-push or a branch's first push reports an unusable `before`.
              if [[ "$BEFORE_SHA" =~ ^[0-9a-f]+$ ]] && [ "${#BEFORE_SHA}" -eq 40 ] \
                 && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
                base="$BEFORE_SHA"
              else
                base="$(git rev-parse "${HEAD_SHA}~1" 2>/dev/null || true)"
              fi ;;
            workflow_dispatch)
              if [ "${REBUILD:-all}" != "changed" ]; then
                echo "mode=all" >> "$GITHUB_OUTPUT"
                echo "reason=dispatch rebuild=all" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              base="$(git rev-parse "${HEAD_SHA}~1" 2>/dev/null || true)" ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base:$MANIFEST" 2>/dev/null; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "reason=no usable baseline commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          git show "$base:$MANIFEST" > "$RUNNER_TEMP/base.csv"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "reason=changed since ${base:0:12}" >> "$GITHUB_OUTPUT"

      - name: Select rows from the manifest
        id: select-rows
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          ONLY_SKILL: ${{ github.event.inputs.skill }}
          BASE_CSV: ${{ runner.temp }}/base.csv
          CHANGED: ${{ runner.temp }}/changed-paths.txt
          SELECTED: ${{ runner.temp }}/selected.txt
        run: |
          set -euo pipefail
          python3 deploy/kagent/select-published-rows.py \
            --track skill \
            --mode "$MODE" \
            --manifest "$MANIFEST" \
            --base-csv "$BASE_CSV" \
            --paths "$CHANGED" \
            --only "$ONLY_SKILL" \
            --selected "$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Preflight the manifest
        env:
          SELECTED: ${{ runner.temp }}/selected.txt
          COUNT: ${{ steps.select-rows.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$COUNT" = "0" ]; then
            echo "No skill rows selected; skipping preflight."
            exit 0
          fi
          scripts/verify-skill-artifacts.sh --selected "$SELECTED"

      - name: Check the catalog, matrix and manifests are in date
        # Both workflows gate on the same two checks: the matrix and the
        # manifests are generated from BOTH catalogs, so a skill-only PR has to
        # prove it regenerated them too, not just the plugin workflow.
        run: |
          set -euo pipefail
          node scripts/seed-plugin-catalog.js --check
          node scripts/gen-kagent-manifests.js --check

      - name: Report the selection
        env:
          REASON: ${{ steps.select-rows.outputs.reason }}
          COUNT: ${{ steps.select-rows.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "### Standalone skill artifacts: ${REASON:-full manifest}"
            echo
            if [ "${COUNT:-0}" = "0" ]; then
              echo "No manifest row moved, so nothing will be published."
            else
              echo "Publishing ${COUNT} skill artifact(s):"
              echo
              while read -r skill version; do
                echo "- \`$skill@$version\`"
              done < "$RUNNER_TEMP/selected.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.skill }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same resolver the local kind build sources, so the published artifact is
      # the tested one.
      - name: Compose the skill artifact
        env:
          REPO_ROOT: ${{ github.workspace }}
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          . deploy/kagent/skill-inputs.sh
          bundle="$(bash deploy/kagent/compose-skill-bundle.sh "$RUNNER_TEMP/$SKILL")"
          mkdir -p "$RUNNER_TEMP/ctx-$SKILL"
          cp -R "$bundle" "$RUNNER_TEMP/ctx-$SKILL/bundle"

      - name: Build and push ${{ matrix.skill }}:${{ matrix.version }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ctx-${{ matrix.skill }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.tags }}

      - name: Write the immutable OCI ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          SKILL: ${{ matrix.skill }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "build-push-action returned no digest" >&2; exit 1; }
          ref="${IMAGE}@${DIGEST}"
          printf '%s\n' "$ref" > "$RUNNER_TEMP/skill-oci-ref-${SKILL}.txt"
          {
            echo "### \`${SKILL}@${VERSION}\` published"
            echo
            echo '```'
            echo "$ref"
            echo '```'
            echo
            echo "Use as the AgentTemplate \`spec.skills[].source.oci\` value, with"
            echo "\`spec.skills[].source.path\` set to \`${{ matrix.skill_path }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: skill-oci-ref-${{ matrix.skill }}
          path: ${{ runner.temp }}/skill-oci-ref-${{ matrix.skill }}.txt

  stamp:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: skill-oci-ref-*
          path: oci-refs
          merge-multiple: true

      - name: Record the digests and regenerate the manifests
        run: |
          set -euo pipefail
          ls oci-refs >/dev/null 2>&1 || { echo "no oci-ref artifacts; nothing to stamp" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node scripts/stamp-plugin-digest.js --refs-dir oci-refs
          node scripts/gen-kagent-manifests.js

      - name: Commit the stamped digests
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/shared-core/src/agent/registry deploy/kagent; then
            echo "no digest changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-core/src/agent/registry deploy/kagent
          git commit -m "chore(kagent): record published skill artifact digests [skip ci]"
          # Any other PR merged while this publish ran moves the branch under
          # this checkout, and a plain push from a stale base is a
          # non-fast-forward: the artifact is already in the registry, the tag
          # has already moved, and the digest that proves it is recorded
          # nowhere. Re-derive the commit onto the new tip and retry.
          BASE_SHA="$(git rev-parse HEAD^)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "Stamped the digests on attempt ${attempt}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch -q origin "${GITHUB_REF_NAME}"
            # A row that moved under this run means this digest describes bytes
            # the current manifest no longer names. Recording it would pin the
            # wrong row, so it asks for a re-run instead.
            if ! git diff --quiet "${BASE_SHA}" "origin/${GITHUB_REF_NAME}" -- "${MANIFEST}"; then
              echo "${MANIFEST} moved while this run published: re-run with \`rebuild: all\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            # The stamp commit is derived output, so it is re-derived rather
            # than replayed: two publishes of the same skill rebase-conflict on
            # the same generated lines, and whichever one resolves it by hand
            # decides which digest main names — while both runs' bytes are
            # sitting in the registry under the moving tag. Reset onto the new
            # tip and run the same two commands against the artifacts this run
            # built, so the newer publish wins and every other row keeps what
            # landed. Never --force: only this run's digest lines move.
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            node scripts/stamp-plugin-digest.js --refs-dir oci-refs
            node scripts/gen-kagent-manifests.js
            if git diff --quiet -- packages/shared-core/src/agent/registry deploy/kagent; then
              echo "Another run already recorded these digests." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add packages/shared-core/src/agent/registry deploy/kagent
            git commit -m "chore(kagent): record published skill artifact digests [skip ci]"
            sleep "${attempt}"
          done
          echo "Lost the push race 5 times: the artifacts are published and unstamped." >> "$GITHUB_STEP_SUMMARY"
          exit 1
