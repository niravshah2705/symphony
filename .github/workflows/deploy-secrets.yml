name: Deploy Secret Share site

# Continuous deployment for secrets.archagentix.com — the static, zero-knowledge
# secret-sharing app (source: secrets/, hosting target "secrets", site
# <project>-secrets) plus its Firestore security rules (firestore.rules), which
# are what actually enforce share expiry and the 1 KB size cap. Content is
# encrypted in the browser; the storage layer only ever sees ciphertext, so
# this workflow touches no secrets and no other service.
#
# Auth is keyless via Workload Identity Federation — same deployer service
# account as Deploy to GCP; see docs/GCP_CICD.md. The SA also needs
# Cloud Firestore Security Rules Creator/Editor to deploy firestore.rules.
on:
  push:
    branches: [main]
    paths:
      - 'secrets/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-secrets.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-secrets
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Terraform owns this Hosting site (google_firebase_hosting_site.secrets)
      # and it is applied by "Deploy to GCP" — which fires off the same push to
      # main that starts this workflow. A first deploy therefore races: publish
      # fails with `could not find site <project>-secrets` ~45s in while the
      # terraform job is still running. Wait for the site rather than fail, then
      # proceed; if it never appears, the infra apply is what actually broke.
      - name: Wait for the Terraform-managed Hosting site
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Take the token from Application Default Credentials — the same
          # Workload Identity credential file the terraform and firebase-tools
          # steps consume. The auth action only exports its `access_token`
          # output when `token_format: access_token` is set, so reading that
          # output here produced an empty bearer and a permanent HTTP 401.
          access_token="$(gcloud auth application-default print-access-token)"
          url="https://firebasehosting.googleapis.com/v1beta1/projects/${PROJECT_ID}/sites/${PROJECT_ID}-secrets"
          for attempt in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${access_token}" \
              -H "X-Goog-User-Project: ${PROJECT_ID}" "${url}")"
            if [ "${code}" = "200" ]; then
              echo "Hosting site ${PROJECT_ID}-secrets exists; publishing."
              exit 0
            fi
            # Only 404 means "terraform has not created it yet"; anything else
            # is a bug in this job, so stop instead of retrying it for 20m.
            if [ "${code}" != "404" ]; then
              echo "::error::unexpected HTTP ${code} checking for hosting site ${PROJECT_ID}-secrets — not a missing-site response. Check the token/permissions (401/403) or the API path."
              exit 1
            fi
            echo "Site not ready yet (HTTP ${code}); waiting for terraform apply. Attempt ${attempt}/60."
            sleep 20
          done
          echo "::error::Hosting site ${PROJECT_ID}-secrets is still missing after 20m. It is created by google_firebase_hosting_site.secrets (deploy/gcp/terraform/firebase.tf), applied by the Deploy to GCP workflow — check that run, or apply terraform by hand, then re-run this job."
          exit 1

      # The page bootstraps from ONE public value: the gateway origin, from
      # which it fetches the same public Firebase web config the platform SPA
      # uses (/api/auth/config). Derived exactly like deploy.yml's GATEWAY_URL.
      - name: Generate the runtime config
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="${{ vars.API_BASE_URL || '' }}"
          if [[ -z "$GATEWAY_URL" ]]; then
            GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"
          fi
          printf '%s\n' \
            "window.__SECRETS_CONFIG__ = { apiBase: '$GATEWAY_URL' };" \
            > secrets/config.js

      - name: Publish to Firebase Hosting + Firestore rules
        run: |
          npx --yes firebase-tools@15 deploy --only hosting:secrets,firestore:rules \
            --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
