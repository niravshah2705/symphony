name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Force rebuild and deploy of every component
        type: boolean
        required: true
        default: false
      changed_since:
        description: Last deployed ref (HEAD^ covers only the newest commit)
        type: string
        required: true
        default: HEAD^

# Never run two applies against the same Terraform state at once.
concurrency:
  group: gcp-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Deploy
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          CHANGED_SINCE: ${{ inputs.changed_since }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          AR_REPO: ${{ vars.AR_REPO || 'ai-fleet' }}
          DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          TF_DIR: deploy/gcp/terraform
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'ai-fleet/gcp' }}
          SPA_BUCKET: ${{ vars.SPA_BUCKET }}
          FIRESTORE_LOCATION: ${{ vars.FIRESTORE_LOCATION || 'nam5' }}
          SPA_ORIGIN: ${{ vars.SPA_ORIGIN }}
          GATEWAY_SERVICE_NAME: ${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}
          FIREBASE_ALLOWED_DOMAIN: ${{ vars.FIREBASE_ALLOWED_DOMAIN }}
          AUTH_ADMIN_EMAILS: ${{ vars.AUTH_ADMIN_EMAILS }}
          AUTH_DEFAULT_ROLE: ${{ vars.AUTH_DEFAULT_ROLE || 'viewer' }}
          GOOGLE_ONE_TAP_CLIENT_ID: ${{ vars.GOOGLE_ONE_TAP_CLIENT_ID }}
          SKILLS_BUCKET: ${{ vars.SKILLS_BUCKET }}
          SKILLS_VERSION: ${{ vars.SKILLS_VERSION || 'v1' }}
          REGISTRY_BUCKET: ${{ vars.REGISTRY_BUCKET || 'aifleet-registry' }}
          SPA_OBFUSCATION_STRENGTH: ${{ vars.SPA_OBFUSCATION_STRENGTH || 'light' }}
          EGRESS_PROXY_ENABLED: "true"
          PROVISIONING_ENABLED: ${{ vars.PROVISIONING_ENABLED || 'false' }}
          PIPELINE_ORCHESTRATOR_ENABLED: ${{ vars.PIPELINE_ORCHESTRATOR_ENABLED || 'false' }}
          PIPELINE_DEPLOYMENT_ENABLED: ${{ vars.PIPELINE_DEPLOYMENT_ENABLED || 'false' }}
          SETTINGS_OPERATOR_INVOKER: ${{ vars.SETTINGS_OPERATOR_INVOKER }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
          EMAIL_SMTP_SECURE: ${{ vars.EMAIL_SMTP_SECURE || 'false' }}
          EMAIL_SMTP_REQUIRE_TLS: ${{ vars.EMAIL_SMTP_REQUIRE_TLS || 'true' }}
          EMAIL_SMTP_AUTH_ENABLED: ${{ vars.EMAIL_SMTP_AUTH_ENABLED || 'false' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_PUBLIC_APP_URL: ${{ vars.EMAIL_PUBLIC_APP_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: npm run gcp:deploy
