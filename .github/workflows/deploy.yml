name: Deploy to GCP

# Continuous deployment on every merge to main — but PATH-FILTERED so a merge
# only does the work it needs:
#   • a service's code changed  → rebuild ONLY that image, then a per-service
#                                  `terraform apply` rolls ONLY that service.
#   • packages/shared or root deps changed → rebuild all three images.
#   • deploy/gcp/terraform/** changed → `terraform apply` only (no image rebuild).
#   • public/** or firebase.json changed → Firebase Hosting deploy only.
#   • docs / anything else → nothing runs.
#
# Auth is keyless via Workload Identity Federation — see docs/GCP_CICD.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Force rebuild + apply everything (ignore path filters)"
        type: boolean
        default: false

# Never run two applies against the same Terraform state at once.
concurrency:
  group: gcp-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  AR_REPO: ai-fleet
  TF_DIR: deploy/gcp/terraform
  TF_STATE_PREFIX: ai-fleet/gcp

jobs:
  # --------------------------------------------------------------------------
  # 1. Decide what changed and build the work plan (a JSON list of services to
  #    rebuild + whether the SPA / Terraform steps need to run at all).
  # --------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }} # JSON array of {id,image,dockerfile}
      spa: ${{ steps.plan.outputs.spa }}
      run_terraform: ${{ steps.plan.outputs.run_terraform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:  ['packages/shared/**']
            gateway: ['services/gateway/**', 'deploy/gcp/Dockerfile.gateway']
            planner: ['services/planner/**', 'deploy/gcp/Dockerfile.planner']
            coder:   ['services/coder/**',   'deploy/gcp/Dockerfile.coder']
            provisioner: ['services/provisioner/**', 'deploy/gcp/Dockerfile.provisioner']
            spa:     ['public/**', 'firebase.json']
            infra:    ['deploy/gcp/terraform/**']
            root:     ['package.json', 'package-lock.json']
            org:      ['services/org/**']
            settings: ['services/settings/**']

      - id: plan
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all }}
          SHARED: ${{ steps.filter.outputs.shared }}
          ROOT: ${{ steps.filter.outputs.root }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          PLANNER: ${{ steps.filter.outputs.planner }}
          CODER: ${{ steps.filter.outputs.coder }}
          PROVISIONER: ${{ steps.filter.outputs.provisioner }}
          SPA: ${{ steps.filter.outputs.spa }}
          INFRA: ${{ steps.filter.outputs.infra }}
          ORG: ${{ steps.filter.outputs.org }}
          SETTINGS: ${{ steps.filter.outputs.settings }}
        run: |
          set -euo pipefail
          # A shared-code / root-deps change (or a forced run) rebuilds the Node
          # services. The org service is an independent Python app.
          all=false
          if [ "$FORCE_ALL" = "true" ] || [ "$SHARED" = "true" ] || [ "$ROOT" = "true" ]; then all=true; fi

          services='[]'
          push() { services=$(printf '%s' "$services" | jq -c \
            --arg id "$1" --arg image "$2" --arg df "$3" --arg ctx "$4" \
            '. + [{id:$id, image:$image, dockerfile:$df, context:$ctx}]'); }

          if [ "$all" = "true" ] || [ "$GATEWAY" = "true" ]; then push gateway gateway       deploy/gcp/Dockerfile.gateway . ; fi
          if [ "$all" = "true" ] || [ "$PLANNER" = "true" ]; then push planner planner       deploy/gcp/Dockerfile.planner . ; fi
          if [ "$all" = "true" ] || [ "$CODER"   = "true" ]; then push coder   coder-control deploy/gcp/Dockerfile.coder   . ; fi
          # The provisioner is a Node service (rebuilds on shared/root/force too).
          # Its image is built even while provisioning is disabled so enabling is a
          # one-var flip; terraform only creates the service when provisioning_enabled.
          if [ "$all" = "true" ] || [ "$PROVISIONER" = "true" ]; then push provisioner provisioner deploy/gcp/Dockerfile.provisioner . ; fi
          # The org service builds from its own directory (its Dockerfile expects
          # services/org as the build context).
          if [ "$FORCE_ALL" = "true" ] || [ "$ORG" = "true" ]; then push org org-service services/org/Dockerfile services/org ; fi
          # The settings service is an independent Python app that builds from its
          # own directory (its Dockerfile expects services/settings as the context).
          if [ "$FORCE_ALL" = "true" ] || [ "$SETTINGS" = "true" ]; then push settings settings-service services/settings/Dockerfile services/settings ; fi

          spa=false
          if [ "$FORCE_ALL" = "true" ] || [ "$SPA" = "true" ]; then spa=true; fi

          # Terraform runs when infra changed OR any image was rebuilt (rolling a
          # new image is a `terraform apply`). A SPA-only or docs-only change skips it.
          run_tf=false
          if [ "$FORCE_ALL" = "true" ] || [ "$INFRA" = "true" ] || [ "$services" != "[]" ]; then run_tf=true; fi

          {
            echo "services=$services"
            echo "spa=$spa"
            echo "run_terraform=$run_tf"
          } >> "$GITHUB_OUTPUT"

          echo "Plan → services=$services  spa=$spa  run_terraform=$run_tf"

  # --------------------------------------------------------------------------
  # 2a. Build + push ONLY the changed service images (one matrix leg each).
  #     Push-only; the terraform job below actually rolls them.
  # --------------------------------------------------------------------------
  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    name: build ${{ matrix.svc.id }}
    strategy:
      fail-fast: true
      matrix:
        svc: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project "${{ vars.GCP_PROJECT_ID }}" --location "$REGION" >/dev/null 2>&1 \
          || gcloud artifacts repositories create "$AR_REPO" \
            --project "${{ vars.GCP_PROJECT_ID }}" --location "$REGION" --repository-format=docker

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" -q

      - name: Build & push ${{ matrix.svc.id }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${{ matrix.svc.image }}:${GITHUB_SHA}"
          docker build -f "${{ matrix.svc.dockerfile }}" -t "$IMAGE" "${{ matrix.svc.context }}"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  # --------------------------------------------------------------------------
  # 2b. Deploy the SPA to Firebase Hosting — only when public/** changed.
  # --------------------------------------------------------------------------
  deploy-spa:
    needs: changes
    if: needs.changes.outputs.spa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Obfuscate the SPA's client JS before it ships. Rewrites public/js/** in
      # this ephemeral checkout only (source in git stays readable); config.js is
      # regenerated below and vendor/ is left untouched. Strength preset is set by
      # the SPA_OBFUSCATION_STRENGTH repo variable (light|balanced|maximum),
      # defaulting to balanced. See scripts/obfuscate-spa.js.
      - name: Obfuscate SPA client JS
        env:
          SPA_OBFUSCATION_STRENGTH: ${{ vars.SPA_OBFUSCATION_STRENGTH || 'balanced' }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          node scripts/obfuscate-spa.js --in-place

      - name: Deploy SPA to Firebase Hosting
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"
          printf "window.__API_BASE__='%s';\n" "$GATEWAY_URL" > public/config.js
          npx --yes firebase-tools@13 deploy --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

  # --------------------------------------------------------------------------
  # 3. Terraform apply. Rolls the rebuilt service(s) to the new SHA and applies
  #    any infra change. UNCHANGED services keep their currently-deployed tag,
  #    so apply is a no-op for them. Runs after (any) builds finish.
  # --------------------------------------------------------------------------
  terraform:
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.outputs.run_terraform == 'true' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolve per-service image tags
        id: tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"

          # A service that was rebuilt this run deploys at the new SHA; one that
          # was NOT rebuilt keeps whatever tag is live now (→ apply no-op for it).
          built() { printf '%s' "$SERVICES" | jq -e --arg id "$1" 'any(.[]; .id == $id)' >/dev/null; }
          live_tag() {
            gcloud run services describe "$1" --project "$PROJECT" --region "$REGION" \
              --format='value(spec.template.spec.containers[0].image)' 2>/dev/null | sed 's#.*:##'
          }
          resolve() { # <plan-id> <cloud-run-service-name>
            if built "$1"; then echo "$GITHUB_SHA"; else live_tag "$2"; fi
          }

          {
            echo "gateway=$(resolve gateway gateway)"
            echo "planner=$(resolve planner planner)"
            echo "coder=$(resolve coder coder-control)"
            echo "provisioner=$(resolve provisioner provisioner)"
            echo "org=$(resolve org org-service)"
            echo "settings=$(resolve settings settings-service)"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"

          # Per-service tags: empty ones fall back to var.image_tag (locals.tf).
          apply_args=(
            -var="project_id=${{ vars.GCP_PROJECT_ID }}"
            -var="region=${REGION}"
            -var="artifact_repo=${AR_REPO}"
            -var="spa_bucket_name=${{ vars.SPA_BUCKET }}"
            -var="firestore_location=${{ vars.FIRESTORE_LOCATION || 'nam5' }}"
            -var="spa_origin=${{ vars.SPA_ORIGIN || 'https://storage.googleapis.com' }}"
            -var="api_base_url=${GATEWAY_URL}"
            -var="firebase_allowed_domain=${{ vars.FIREBASE_ALLOWED_DOMAIN }}"
            -var="auth_admin_emails=${{ vars.AUTH_ADMIN_EMAILS }}"
            -var="auth_default_role=${{ vars.AUTH_DEFAULT_ROLE || 'viewer' }}"
            -var="google_one_tap_client_id=${{ vars.GOOGLE_ONE_TAP_CLIENT_ID }}"
            -var="skills_bucket_name=${{ vars.SKILLS_BUCKET }}"
            -var="skills_version=${{ vars.SKILLS_VERSION || 'v1' }}"
          )
          [ -n "${{ steps.tags.outputs.gateway }}" ] && apply_args+=(-var="gateway_image_tag=${{ steps.tags.outputs.gateway }}")
          [ -n "${{ steps.tags.outputs.planner }}" ] && apply_args+=(-var="planner_image_tag=${{ steps.tags.outputs.planner }}")
          [ -n "${{ steps.tags.outputs.coder }}" ]   && apply_args+=(-var="coder_image_tag=${{ steps.tags.outputs.coder }}") || true
          [ -n "${{ steps.tags.outputs.provisioner }}" ] && apply_args+=(-var="provisioner_image_tag=${{ steps.tags.outputs.provisioner }}") || true
          [ -n "${{ steps.tags.outputs.org }}" ]     && apply_args+=(-var="org_image_tag=${{ steps.tags.outputs.org }}") || true
          [ -n "${{ steps.tags.outputs.settings }}" ] && apply_args+=(-var="settings_image_tag=${{ steps.tags.outputs.settings }}") || true

          terraform apply -input=false -auto-approve "${apply_args[@]}"

      - name: Outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output
