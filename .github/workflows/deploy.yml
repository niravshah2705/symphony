name: Deploy to GCP

# Continuous deployment on every merge to main — but PATH-FILTERED so a merge
# only does the work it needs:
#   • a service's code changed  → rebuild ONLY that image, then a per-service
#                                  `terraform apply` rolls ONLY that service.
#   • shared packages changed → rebuild all service images.
#   • root deps changed → rebuild all service images + republish the SPA.
#   • deploy/gcp/terraform/** changed → `terraform apply` only (no image rebuild).
#   • deploy/gcp/terraform-substrate-gke/** changed → the gke-reconcile job plans
#                                  and applies the multi-tenant Substrate GKE
#                                  module (separate state prefix, no images).
#   • deploy/gcp/terraform-flexprice/**, deploy/flexprice/** or scripts/flexprice-*
#                                  changed → the flexprice-reconcile job builds
#                                  the pinned upstream image + stages the chart
#                                  and applies that module (separate state
#                                  prefix, separate concurrency group).
#   • SPA source, config, or release tooling changed → Firebase Hosting deploy.
#   • docs / anything else → nothing runs.
#
# Auth is keyless via Workload Identity Federation — see docs/GCP_CICD.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Force rebuild + apply everything (ignore path filters)"
        type: boolean
        default: false
      gke_reconcile:
        description: "Reconcile the Substrate GKE module (plan + apply)"
        type: boolean
        default: false
      gke_plan_only:
        description: "GKE only: plan without applying"
        type: boolean
        default: false
      gke_allow_destroy:
        description: "GKE only: permit a plan that deletes resources"
        type: boolean
        default: false
      flexprice_reconcile:
        description: "Reconcile the self-hosted FlexPrice stack (plan + apply)"
        type: boolean
        default: false
      flexprice_plan_only:
        description: "FlexPrice only: plan without applying"
        type: boolean
        default: false
      flexprice_allow_destroy:
        description: "FlexPrice only: permit a plan that deletes resources"
        type: boolean
        default: false

# Never run two applies against the same Terraform state at once.
concurrency:
  group: gcp-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  AR_REPO: ai-fleet
  TF_DIR: deploy/gcp/terraform
  TF_STATE_PREFIX: ai-fleet/gcp

jobs:
  # --------------------------------------------------------------------------
  # 1. Decide what changed and build the work plan (a JSON list of services to
  #    rebuild + whether the SPA / Terraform steps need to run at all).
  # --------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.plan.outputs.services }} # JSON array of {id,image,dockerfile}
      spa: ${{ steps.plan.outputs.spa }}
      run_terraform: ${{ steps.plan.outputs.run_terraform }}
      run_gke: ${{ steps.plan.outputs.run_gke }}
      run_flexprice: ${{ steps.plan.outputs.run_flexprice }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:  ['packages/shared/**', 'packages/shared-core/**']
            gateway: ['services/gateway/**', 'deploy/gcp/Dockerfile.gateway']
            # The actor image carries packages/shared + the orchestrator entry,
            # both of which also trigger it through shared/orchestrator ($all /
            # ORCHESTRATOR); this filter is for Dockerfile-only changes. Its
            # digest reaches terraform via var.substrate_planner_image (operator
            # input — never an image_tag var, because ActorTemplate requires a
            # digest, not a tag).
            substrate_actor: ['deploy/gcp/Dockerfile.substrate-actor', 'services/orchestrator/src/substrate-actor-entry.js']
            orchestrator: ['services/orchestrator/**', 'deploy/gcp/Dockerfile.orchestrator']
            provisioner: ['services/provisioner/**', 'deploy/gcp/Dockerfile.provisioner']
            proxy:   ['services/proxy/**',   'deploy/gcp/Dockerfile.proxy']
            # A release-tooling change must publish the newly transformed SPA;
            # otherwise an obfuscator/default change would wait for an unrelated
            # public/** edit before reaching production.
            spa:     ['public/**', 'firebase.json', '.firebaserc', 'scripts/obfuscate-spa.js', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
            infra:    ['deploy/gcp/terraform/**']
            # Separate stack, separate state prefix — deliberately NOT under
            # infra's terraform/** glob.
            gke:      ['deploy/gcp/terraform-substrate-gke/**']
            # The self-hosted FlexPrice stack: its module, its local (kind) shape
            # and the scripts that stage its chart. A VERSION bump belongs here
            # too, because the pinned commit is what the image and chart are built
            # from — not the module's own choice.
            flexprice: ['deploy/gcp/terraform-flexprice/**', 'deploy/flexprice/**', 'scripts/flexprice-*']
            root:     ['package.json', 'package-lock.json']
            org:      ['services/org/**']
            settings: ['services/settings/**']
            email:    ['services/email/**', 'deploy/gcp/Dockerfile.email']
            identity: ['services/identity-verification/**', 'deploy/gcp/Dockerfile.identity-verification']
            billing:  ['services/billing/**', 'deploy/gcp/Dockerfile.billing']
            laya:     ['deploy/gcp/Dockerfile.laya-inference', 'deploy/gcp/terraform/laya_inference.tf', 'deploy/gcp/terraform/laya_models.tf']
            clm:      ['services/clm-inference/**',  'deploy/gcp/Dockerfile.clm-inference']
            # LiteLLM gateway: the app image is a digest-pinned upstream overlay,
            # so a config or entrypoint change must republish it. deploy/litellm/**
            # covers config.yaml + entrypoint-db.sh; terraform/litellm.tf moves with
            # them because the container/volume shape and the secret mounts are the
            # other half of the same contract.
            litellm:  ['deploy/litellm/**', 'deploy/gcp/Dockerfile.litellm-app', 'deploy/gcp/Dockerfile.litellm-db', 'deploy/gcp/Dockerfile.litellm-redis', 'deploy/gcp/terraform/litellm.tf']

      - id: plan
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all }}
          SHARED: ${{ steps.filter.outputs.shared }}
          ROOT: ${{ steps.filter.outputs.root }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          SUBSTRATE_ACTOR: ${{ steps.filter.outputs.substrate_actor }}
          ORCHESTRATOR: ${{ steps.filter.outputs.orchestrator }}
          PROVISIONER: ${{ steps.filter.outputs.provisioner }}
          PROXY: ${{ steps.filter.outputs.proxy }}
          SPA: ${{ steps.filter.outputs.spa }}
          INFRA: ${{ steps.filter.outputs.infra }}
          ORG: ${{ steps.filter.outputs.org }}
          SETTINGS: ${{ steps.filter.outputs.settings }}
          EMAIL: ${{ steps.filter.outputs.email }}
          IDENTITY: ${{ steps.filter.outputs.identity }}
          BILLING: ${{ steps.filter.outputs.billing }}
          LAYA: ${{ steps.filter.outputs.laya }}
          CLM: ${{ steps.filter.outputs.clm }}
          LITELLM: ${{ steps.filter.outputs.litellm }}
          GKE: ${{ steps.filter.outputs.gke }}
          GKE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.gke_reconcile }}
          FLEXPRICE: ${{ steps.filter.outputs.flexprice }}
          FLEXPRICE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.flexprice_reconcile }}
        run: |
          set -euo pipefail
          # A shared-code / root-deps change (or a forced run) rebuilds the Node
          # services. The org service is an independent Python app.
          all=false
          if [ "$FORCE_ALL" = "true" ] || [ "$SHARED" = "true" ] || [ "$ROOT" = "true" ]; then all=true; fi

          services='[]'
          push() { services=$(printf '%s' "$services" | jq -c \
            --arg id "$1" --arg image "$2" --arg df "$3" --arg ctx "$4" \
            '. + [{id:$id, image:$image, dockerfile:$df, context:$ctx}]'); }

          if [ "$all" = "true" ] || [ "$GATEWAY" = "true" ]; then push gateway gateway       deploy/gcp/Dockerfile.gateway . ; fi
          if [ "$all" = "true" ] || [ "$SUBSTRATE_ACTOR" = "true" ]; then push substrate-actor substrate-actor deploy/gcp/Dockerfile.substrate-actor . ; fi
          if [ "$all" = "true" ] || [ "$ORCHESTRATOR" = "true" ] || [ "$INFRA" = "true" ]; then push orchestrator pipeline-orchestrator deploy/gcp/Dockerfile.orchestrator . ; fi
          if [ "$all" = "true" ] || [ "$EMAIL"   = "true" ]; then push email   email-service deploy/gcp/Dockerfile.email   . ; fi
          if [ "$all" = "true" ] || [ "$IDENTITY" = "true" ]; then push identity identity-verification deploy/gcp/Dockerfile.identity-verification . ; fi
          if [ "$all" = "true" ] || [ "$BILLING"  = "true" ]; then push billing billing deploy/gcp/Dockerfile.billing . ; fi
          # Dedicated inference microservices (Python apps).
          if [ "$FORCE_ALL" = "true" ] || [ "$all" = "true" ] || [ "$LAYA" = "true" ] || [ "$INFRA" = "true" ]; then push laya laya-inference deploy/gcp/Dockerfile.laya-inference . ; fi
          if [ "$FORCE_ALL" = "true" ] || [ "$all" = "true" ] || [ "$CLM"  = "true" ] || [ "$INFRA" = "true" ]; then push clm clm-inference deploy/gcp/Dockerfile.clm-inference . ; fi
          # LiteLLM gateway images. These three always move together: they share
          # one tag (the SHA that built them) and terraform rolls all three from
          # that single value, so the app/Postgres/Redis trio on one ephemeral
          # instance can never be reassembled from three different runs.
          # `$all` (a shared-code or root-dependency change) deliberately does NOT
          # rebuild them — none of these images contains fleet JS.
          if [ "$FORCE_ALL" = "true" ] || [ "$LITELLM" = "true" ] || [ "$INFRA" = "true" ]; then
            push litellm litellm deploy/gcp/Dockerfile.litellm-app .
            push litellm-db litellm-db deploy/gcp/Dockerfile.litellm-db .
            push litellm-redis litellm-redis deploy/gcp/Dockerfile.litellm-redis .
          fi
          # The provisioner is a Node service (rebuilds on shared/root/force too).
          # Its image is built even while provisioning is disabled so enabling is a
          # one-var flip; terraform only creates the service when provisioning_enabled.
          if [ "$all" = "true" ] || [ "$PROVISIONER" = "true" ]; then push provisioner provisioner deploy/gcp/Dockerfile.provisioner . ; fi
          # The org service builds from its own directory (its Dockerfile expects
          # services/org as the build context).
          if [ "$FORCE_ALL" = "true" ] || [ "$ORG" = "true" ]; then push org org-service services/org/Dockerfile services/org ; fi
          # Settings consumes the canonical shared-core harness catalog, so a
          # shared/root dependency change must rebuild it from the repo root too.
          if [ "$all" = "true" ] || [ "$SETTINGS" = "true" ]; then push settings settings-service services/settings/Dockerfile . ; fi

          spa=false
          if [ "$FORCE_ALL" = "true" ] || [ "$SPA" = "true" ]; then spa=true; fi

          # Terraform runs when infra changed OR any image was rebuilt (rolling a
          # new image is a `terraform apply`). A SPA-only or docs-only change skips it.
          run_tf=false
          if [ "$FORCE_ALL" = "true" ] || [ "$INFRA" = "true" ] || [ "$PROXY" = "true" ] || [ "$services" != "[]" ]; then run_tf=true; fi

          # Shared proxy artifact: built whenever terraform will run so both the
          # mandatory egress sidecars and stream-token broker have this SHA.
          if [ "$run_tf" = "true" ]; then push proxy proxy deploy/gcp/Dockerfile.proxy . ; fi

          # The Substrate GKE module is its own stack (own state prefix, no
          # images). It reconciles when its paths changed, when everything is
          # forced, or when a dispatch asks for it by name.
          run_gke=false
          if [ "$FORCE_ALL" = "true" ] || [ "$GKE" = "true" ] || [ "$GKE_REQUESTED" = "true" ]; then run_gke=true; fi

          # FlexPrice is its own stack on the same cluster: own state prefix, own
          # concurrency group, own artifacts. It is deliberately NOT pulled in by
          # `services != "[]"` the way terraform is — rebuilding a fleet image says
          # nothing about the billing chart, and a reconcile here builds an
          # upstream Go binary, so it is minutes of work nobody asked for.
          run_fp=false
          if [ "$FORCE_ALL" = "true" ] || [ "$FLEXPRICE" = "true" ] || [ "$FLEXPRICE_REQUESTED" = "true" ]; then run_fp=true; fi

          {
            echo "services=$services"
            echo "spa=$spa"
            echo "run_terraform=$run_tf"
            echo "run_gke=$run_gke"
            echo "run_flexprice=$run_fp"
          } >> "$GITHUB_OUTPUT"

          echo "Plan → services=$services  spa=$spa  run_terraform=$run_tf  run_gke=$run_gke  run_flexprice=$run_fp"

  # --------------------------------------------------------------------------
  # 2a. Build + push ONLY the changed service images (one matrix leg each).
  #     Push-only; the terraform job below actually rolls them.
  # --------------------------------------------------------------------------
  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    name: build ${{ matrix.svc.id }}
    strategy:
      fail-fast: true
      matrix:
        svc: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project "${{ vars.GCP_PROJECT_ID }}" --location "$REGION" >/dev/null 2>&1 \
          || gcloud artifacts repositories create "$AR_REPO" \
            --project "${{ vars.GCP_PROJECT_ID }}" --location "$REGION" --repository-format=docker

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" -q

      - name: Build & push ${{ matrix.svc.id }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${{ matrix.svc.image }}:${GITHUB_SHA}"
          docker build -f "${{ matrix.svc.dockerfile }}" -t "$IMAGE" "${{ matrix.svc.context }}"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  # --------------------------------------------------------------------------
  # 2b. Deploy the SPA to Firebase Hosting when source or release tooling changed.
  # --------------------------------------------------------------------------
  deploy-spa:
    needs: changes
    if: needs.changes.outputs.spa == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Obfuscate the SPA's client JS before it ships. Rewrites public/js/** in
      # this ephemeral checkout only (source in git stays readable); config.js is
      # regenerated below and vendor/ is left untouched. Strength preset is set by
      # the SPA_OBFUSCATION_STRENGTH repo variable (light|balanced|maximum),
      # defaulting to light. See scripts/obfuscate-spa.js.
      - name: Obfuscate SPA client JS
        env:
          SPA_OBFUSCATION_STRENGTH: ${{ vars.SPA_OBFUSCATION_STRENGTH || 'light' }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          node scripts/obfuscate-spa.js --in-place

      - name: Deploy SPA to Firebase Hosting
        env:
          # Public GA4 web-stream id. Empty keeps analytics disabled.
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          ADLC_TRY_NOW_URL: ${{ vars.ADLC_TRY_NOW_URL || 'https://platform.archagentix.com/' }}
          ADLC_CANONICAL_ORIGIN: ${{ vars.ADLC_CANONICAL_ORIGIN || 'https://www.archagentix.com' }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"
          if [[ -n "$GOOGLE_ANALYTICS_MEASUREMENT_ID" && ! "$GOOGLE_ANALYTICS_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "GOOGLE_ANALYTICS_MEASUREMENT_ID must be empty or a GA4 id such as G-XXXXXXXXXX." >&2
            exit 1
          fi
          # api.js imports this runtime module before reading the base URL. Start
          # the gateway connection here so DNS/TLS can overlap module evaluation.
          # The GA id is public and read by google-analytics.mjs; blank is off.
          printf '%s\n' \
            "window.__API_BASE__='$GATEWAY_URL';" \
            "window.__GA_MEASUREMENT_ID__='$GOOGLE_ANALYTICS_MEASUREMENT_ID';" \
            "(()=>{const link=document.createElement('link');link.rel='preconnect';link.href=window.__API_BASE__;link.crossOrigin='anonymous';document.head.appendChild(link);})();" \
            > public/config.js
          node -e "const fs=require('fs'); const cfg={tryNowUrl:process.env.ADLC_TRY_NOW_URL || 'https://platform.archagentix.com/', canonicalOrigin:process.env.ADLC_CANONICAL_ORIGIN || 'https://www.archagentix.com'}; fs.writeFileSync('public/adlc/config.js', 'window.__ADLC_CONFIG__ = ' + JSON.stringify(cfg, null, 2) + ';\\n');"
          npx --yes firebase-tools@15 deploy --only hosting:app \
            --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

  # --------------------------------------------------------------------------
  # 3. Terraform apply. Rolls the rebuilt service(s) to the new SHA and applies
  #    any infra change. UNCHANGED services keep their currently-deployed tag,
  #    so apply is a no-op for them. Runs after (any) builds finish.
  # --------------------------------------------------------------------------
  terraform:
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.outputs.run_terraform == 'true' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolve per-service image tags
        id: tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          PROVISIONING_ENABLED: ${{ vars.PROVISIONING_ENABLED || 'false' }}
          LITELLM_ENABLED: ${{ vars.LITELLM_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"

          # A service that was rebuilt this run deploys at the new SHA; one that
          # was NOT rebuilt keeps whatever tag is live now (→ apply no-op for it).
          built() { printf '%s' "$SERVICES" | jq -e --arg id "$1" 'any(.[]; .id == $id)' >/dev/null; }
          release_tag() { # <tag> <source-description>
            if [[ ! "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Refusing non-immutable image tag from $2" >&2
              return 1
            fi
            printf '%s\n' "$1"
          }
          live_tag() {
            local image tag
            image="$(gcloud run services describe "$1" --project "$PROJECT" --region "$REGION" \
              --format='value(spec.template.spec.containers[0].image)')"
            tag="${image##*:}"
            if [ -z "$image" ] || [ -z "$tag" ] || [ "$tag" = "$image" ]; then
              echo "Unable to resolve immutable live image tag for $1" >&2
              return 1
            fi
            release_tag "$tag" "live Cloud Run service $1"
          }
          resolve() { # <plan-id> <cloud-run-service-name>
            if built "$1"; then release_tag "$GITHUB_SHA" "current GitHub revision"; else live_tag "$2"; fi
          }
          resolve_optional() { # <plan-id> <cloud-run-service-name> <enabled>
            if built "$1"; then
              release_tag "$GITHUB_SHA" "current GitHub revision"
              return
            fi
            case "$3" in
              true) live_tag "$2" ;;
              false)
                # Terraform does not dereference this placeholder while the
                # optional resource has count=0. Keep it syntactically and
                # semantically equivalent to every other release tag anyway.
                release_tag "$GITHUB_SHA" "disabled optional service $2"
                ;;
              *)
                echo "Invalid enablement flag for optional service $2: $3" >&2
                return 1
                ;;
            esac
          }
          write_tag() { # <output-name> <resolver> [resolver-args...]
            local output_name="$1" tag
            shift
            if ! tag="$("$@")"; then
              echo "Unable to resolve image tag output $output_name" >&2
              return 1
            fi
            printf '%s=%s\n' "$output_name" "$tag"
          }

          {
            write_tag gateway resolve gateway gateway
            write_tag orchestrator resolve orchestrator pipeline-orchestrator
            write_tag provisioner resolve_optional provisioner provisioner "$PROVISIONING_ENABLED"
            # One proxy artifact backs both sidecars and the standalone broker.
            # It is built on every terraform-running deploy (see the plan step),
            # so it always resolves to the current SHA here.
            write_tag proxy resolve proxy proxy
            write_tag org resolve org org-service
            write_tag settings resolve settings settings-service
            write_tag email resolve email email-service
            write_tag identity resolve identity identity-verification
            write_tag billing resolve billing billing
            write_tag laya resolve laya laya-inference
            write_tag clm resolve clm clm-inference
            # ONE tag for all three LiteLLM images. The plan step always builds them
            # as a unit, and litellm.tf mounts them on a single ephemeral instance, so
            # app/Postgres/Redis must never come from three different runs. When the
            # service was not rebuilt this run, live_tag reads containers[0] (the
            # postgres sidecar) — correct precisely because all three tags are equal.
            write_tag litellm resolve_optional litellm ai-fleet-litellm "$LITELLM_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Terraform fmt and validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff -no-color
          terraform validate -no-color

      - name: Prepare internal S2S token
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          token=""
          version="$(gcloud secrets versions list internal-api-token \
            --project "$PROJECT_ID" --filter='state=ENABLED' --limit=1 \
            --format='value(name)' 2>/dev/null || true)"
          if [ -n "$version" ]; then
            token="$(gcloud secrets versions access "$version" \
              --secret=internal-api-token --project "$PROJECT_ID")"
          else
            token="$(openssl rand -base64 48 | tr -d '\n')"
          fi
          [ -n "$token" ] || { echo "Unable to prepare internal S2S token" >&2; exit 1; }
          echo "::add-mask::$token"
          printf 'TF_VAR_internal_api_token=%s\n' "$token" >> "$GITHUB_ENV"

      # Secret VALUES are out-of-band (never in Terraform state/source — see
      # deploy/gcp/terraform/secrets.tf). Only deploy.sh/bootstrap.sh seeded
      # them until now, so a newly-added mandatory secret (e.g.
      # identity-hash-pepper) had no version the first time this workflow's
      # plain `terraform apply` touched it. Ensure each container secret exists,
      # then CONVERGE its ENABLED value onto the environment's.
      #
      # Converging, not first-write-wins: a secret already holding a wrong value
      # (a truncated Cashfree key caused a production 401) must be repairable by
      # re-running the pipeline. A corrected value is added as a NEW version and
      # `version = "latest"` (billing_service.tf) picks it up on the next
      # revision. Random generation is allowed only for OUR OWN secrets —
      # generating a third-party credential yields a permanently invalid one.
      - name: Stage mandatory secret versions
        working-directory: ${{ env.TF_DIR }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          FLEXPRICE_API_KEY_INGEST: ${{ secrets.FLEXPRICE_API_KEY_INGEST }}
          FLEXPRICE_API_KEY_MONEY: ${{ secrets.FLEXPRICE_API_KEY_MONEY }}
        run: |
          set -euo pipefail
          tf_vars=(
            -var="project_id=${PROJECT_ID}"
            -var="region=${REGION}"
            -var="spa_bucket_name=${{ vars.SPA_BUCKET }}"
            -var="flexprice_base_url=${{ vars.FLEXPRICE_BASE_URL }}"
            -var="flexprice_environment_id=${{ vars.FLEXPRICE_ENVIRONMENT_ID }}"
            -var="flexprice_supplier_state_code=${{ vars.FLEXPRICE_SUPPLIER_STATE_CODE }}"
          )
          # Read-only, and targeted. Read-only because a merge must never mutate
          # production: applying here is how one bad commit reaches Firestore.
          # Targeted because the var set above is a six-variable subset of the ~45
          # the apply step passes, so an UN-targeted plan here evaluates the whole
          # stack against defaults — firestore_location=nam5 (replaces the real
          # database), google_one_tap_client_id="" (deletes the OAuth client-id
          # secret), custom_domain=[] (unmaps the live hosting domain) — and dies on
          # the email service's email_public_app_url precondition. That plan is not
          # the deployment plan; the one in the apply step below is.
          secret_targets=(
            -target='google_secret_manager_secret.flexprice["flexprice-api-key-ingest"]'
            -target='google_secret_manager_secret.flexprice["flexprice-api-key-money"]'
            -target=google_secret_manager_secret.stream_token_secret
            -target=google_secret_manager_secret.identity_hash_pepper
            -target=google_secret_manager_secret.cashfree_app_id
            -target=google_secret_manager_secret.cashfree_secret_key
          )
          # A brand-new secret therefore has no container yet: the plan says "1 to
          # add" and the gcloud seeding below cannot write a version into it. Add the
          # container with `gcloud secrets create <id> --replication-policy=automatic`
          # (and let the apply step import or create it). The two FlexPrice planes are
          # seeded here as well and re-checked in the next step, because their
          # containers are created by the same apply that binds them to the billing
          # revision — a missing version is a rejected revision, not a warning.
          #
          # A pending `moved` block is the one case this step cannot plan past: while
          # a move's SOURCE address is still in state, terraform refuses ANY targeted
          # plan — "Moved resource instances excluded by targeting" — even one
          # targeting unrelated resources. Recording a move needs an apply, and
          # `apply -refresh-only` is the only apply that cannot touch infrastructure:
          # it rewrites state (relabels the moved addresses, refreshes them from the
          # API) and creates, changes or deletes no remote object. So the addresses
          # terraform itself names get recorded here and the read-only plan is
          # retried; anything that still fails stays the operator's call.
          #
          # What can still fail: a refresh-only plan cannot CREATE anything, so
          # every expression it evaluates has to resolve from state. A local that
          # indexes a resource collection outside the target set reads whatever is
          # stored there — and for a container the apply step has not created yet
          # that is an empty object, so the record dies on "Invalid index". Config
          # under this step therefore references not-yet-applied resources by
          # constant, never by `resource.thing[key].attribute`.
          plan_log=/tmp/secret-stage-plan.log
          stage_plan() {
            terraform plan -no-color -input=false "${tf_vars[@]}" "${secret_targets[@]}" 2>&1 | tee "$plan_log"
          }
          if ! stage_plan; then
            grep -q 'Moved resource instances excluded by targeting' "$plan_log" || exit 1
            # Take the addresses from the message rather than a list here that goes
            # stale the moment the next `moved` block lands.
            move_targets=()
            while IFS= read -r moved; do
              move_targets+=("$moved")
            done < <(grep -oE '\-target="[^"]+"' "$plan_log" | sed -e 's/^-target="//' -e 's/"$//')
            if [ "${#move_targets[@]}" -eq 0 ]; then
              echo "::error::Pending state moves were reported without any -target suggestion. Record them with 'terraform apply -refresh-only' in $TF_DIR, then re-run this workflow."
              exit 1
            fi
            target_args=( "${move_targets[@]/#/-target=}" )
            echo "Recording pending state moves (state addresses only, no infrastructure changes):"
            printf '  %s\n' "${move_targets[@]}"
            if ! terraform apply -refresh-only -auto-approve -input=false -no-color \
                 "${tf_vars[@]}" "${target_args[@]}"; then
              echo "::error::Could not record the pending state moves. Run 'terraform apply -refresh-only ${target_args[*]}' in $TF_DIR, then re-run this workflow."
              exit 1
            fi
            if ! stage_plan; then
              echo "::error::Still blocked after recording the moves; see the plan output above."
              exit 1
            fi
          fi

          enabled_value() {
            local v
            v=$(gcloud secrets versions list "$1" --project "$PROJECT_ID" \
              --filter='state=ENABLED' --format='value(name)' 2>/dev/null | head -n1)
            [ -n "$v" ] && gcloud secrets versions access "$v" --secret "$1" --project "$PROJECT_ID" 2>/dev/null || true
          }
          seed_secret() { # id [optional_value] [allow_random]
            local id="$1" val="${2:-}" rand="${3:-}" cur
            cur="$(enabled_value "$id")"
            if [ -n "$val" ] && [ "$val" != "$cur" ]; then
              printf '%s' "$val" | gcloud secrets versions add "$id" --project "$PROJECT_ID" --data-file=- >/dev/null
              echo "  $id: seeded from environment (new version)"
            elif [ -z "$cur" ] && [ -n "$rand" ]; then
              openssl rand -base64 48 | tr -d '\n' | gcloud secrets versions add "$id" --project "$PROJECT_ID" --data-file=- >/dev/null
              echo "  $id: seeded (random fallback)"
            elif [ -z "$cur" ]; then
              echo "  $id: MISSING and no value provided — refusing to generate one. Set the repository secret this step reads, or publish it: gcloud secrets versions add $id --project $PROJECT_ID --data-file=-" >&2
              exit 1
            else
              echo "  $id: up to date"
            fi
          }
          seed_secret stream-token-secret "" allow-random
          seed_secret identity-hash-pepper "" allow-random
          seed_secret cashfree-app-id "${CASHFREE_APP_ID:-}"
          seed_secret cashfree-secret-key "${CASHFREE_SECRET_KEY:-}"
          # The two FlexPrice planes: never generated (a minted-random third-party
          # key is permanently invalid, and the ingest plane is the write boundary
          # flexprice-config.js refuses to share with the money key), and never
          # optional — billing_service.tf binds both names into the billing
          # container unconditionally, so Cloud Run rejects the revision at apply
          # time if either has no active version. Seeding them here turns that into
          # a failure in the step that can name the fix.
          seed_secret flexprice-api-key-ingest "${FLEXPRICE_API_KEY_INGEST:-}"
          seed_secret flexprice-api-key-money "${FLEXPRICE_API_KEY_MONEY:-}"

      # Last gate before the apply, independent of the seeding above: an operator
      # may publish either plane by hand, and a version can be disabled after it
      # was added. Check only that an enabled version exists; never read a value.
      - name: Verify FlexPrice secret versions
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for id in flexprice-api-key-ingest flexprice-api-key-money; do
            v="$(gcloud secrets versions list "$id" --project "$PROJECT_ID" \
              --filter=state:enabled --limit=1 --format='value(name)')"
            if [ -z "$v" ]; then
              secret_name="FLEXPRICE_API_KEY_$(echo "${id#flexprice-api-key-}" | tr '[:lower:]' '[:upper:]')"
              echo "::error::$id has no enabled version and the billing container mounts it. Set '$secret_name' as a repository secret (the secret-staging step publishes it), or publish it by hand: gcloud secrets versions add $id --project $PROJECT_ID --data-file=-"
              exit 1
            fi
            echo "  $id: enabled version present"
          done

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"

          CUSTOM_DOMAIN_ARG="[]"
          if [ -n "${{ vars.FIREBASE_CUSTOM_DOMAIN }}" ]; then
            CUSTOM_DOMAIN_ARG="$(echo "${{ vars.FIREBASE_CUSTOM_DOMAIN }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "") | gsub("^https?://"; "") | gsub("/+$"; "")) | map(select(length > 0))')"
          fi

          # The substrate atespace bindings are one comma-separated string each in
          # the repo variable, because that is the shape substrate.tf renders into a
          # single env name and the JS side parses. Empty stays empty list/map: the
          # names are absent from the container env rather than set to "".
          SUBSTRATE_ALLOWED_ATESPACES_ARG="[]"
          if [ -n "${{ vars.SUBSTRATE_ALLOWED_ATESPACES }}" ]; then
            SUBSTRATE_ALLOWED_ATESPACES_ARG="$(echo "${{ vars.SUBSTRATE_ALLOWED_ATESPACES }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          fi
          SUBSTRATE_ATESPACE_BY_ORG_ARG="{}"
          if [ -n "${{ vars.SUBSTRATE_ATESPACE_BY_ORG }}" ]; then
            SUBSTRATE_ATESPACE_BY_ORG_ARG="$(echo "${{ vars.SUBSTRATE_ATESPACE_BY_ORG }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0) | split("=") | {(.[0] | gsub("^\\s+|\\s+$"; "")): (.[1] | gsub("^\\s+|\\s+$"; ""))}) | add // {}')"
          fi

          # Every service tag above is either this run's immutable SHA or a
          # successfully resolved live tag. An unresolved tag aborts deployment.
          apply_args=(
            -var="project_id=${{ vars.GCP_PROJECT_ID }}"
            -var="region=${REGION}"
            -var="artifact_repo=${AR_REPO}"
            -var="spa_bucket_name=${{ vars.SPA_BUCKET }}"
            -var="firestore_location=${{ vars.FIRESTORE_LOCATION || 'nam5' }}"
            -var="spa_origin=${{ vars.SPA_ORIGIN || 'https://storage.googleapis.com' }}"
            -var="api_base_url=${GATEWAY_URL}"
            -var="firebase_allowed_domain=${{ vars.FIREBASE_ALLOWED_DOMAIN }}"
            -var="custom_domain=${CUSTOM_DOMAIN_ARG}"
            -var="marketing_custom_domain=${{ vars.MARKETING_CUSTOM_DOMAIN || 'www.archagentix.com' }}"
            -var="auth_admin_emails=${{ vars.AUTH_ADMIN_EMAILS }}"
            -var="auth_default_role=${{ vars.AUTH_DEFAULT_ROLE || 'viewer' }}"
            -var="google_one_tap_client_id=${{ vars.GOOGLE_ONE_TAP_CLIENT_ID }}"
            -var="skills_bucket_name=${{ vars.SKILLS_BUCKET }}"
            -var="skills_version=${{ vars.SKILLS_VERSION || 'v1' }}"
            -var="laya_models_bucket_name=${{ vars.LAYA_MODELS_BUCKET }}"
            -var="laya_model_version=${{ vars.LAYA_MODEL_VERSION || 'v1' }}"
            -var="provisioning_enabled=${{ vars.PROVISIONING_ENABLED || 'false' }}"
            -var="pipeline_orchestrator_enabled=${{ vars.PIPELINE_ORCHESTRATOR_ENABLED || 'false' }}"
            # Off by default: the gateway (3 containers + 4 secrets) only exists when
            # the repo variable says so. This is the infra knob only — admitting the
            # browser's `litellm` flag is the separate out-of-band
            # LITELLM_GATEWAY_ENABLED on the agent services, as for LangSmith.
            -var="litellm_enabled=${{ vars.LITELLM_ENABLED || 'false' }}"
            -var="settings_operator_invoker=${{ vars.SETTINGS_OPERATOR_INVOKER }}"
            -var="omlx_proxy_upstream=${{ vars.OMLX_PROXY_UPSTREAM }}"
            -var="ollama_proxy_upstream=${{ vars.OLLAMA_PROXY_UPSTREAM }}"
            -var="lmstudio_proxy_upstream=${{ vars.LMSTUDIO_PROXY_UPSTREAM }}"
            -var="openswe_proxy_upstream=${{ vars.OPENSWE_PROXY_UPSTREAM }}"
            -var="email_smtp_host=${{ vars.EMAIL_SMTP_HOST }}"
            -var="email_smtp_port=${{ vars.EMAIL_SMTP_PORT || '587' }}"
            -var="email_smtp_secure=${{ vars.EMAIL_SMTP_SECURE || 'false' }}"
            -var="email_smtp_require_tls=${{ vars.EMAIL_SMTP_REQUIRE_TLS || 'true' }}"
            -var="email_smtp_auth_enabled=${{ vars.EMAIL_SMTP_AUTH_ENABLED || 'false' }}"
            -var="email_from=${{ vars.EMAIL_FROM }}"
            -var="email_public_app_url=${{ vars.EMAIL_PUBLIC_APP_URL }}"
            -var="cashfree_env=${{ vars.CASHFREE_ENV || 'sandbox' }}"
            -var="cashfree_base_url=${{ vars.CASHFREE_BASE_URL || 'https://sandbox.cashfree.com' }}"
            # All four below are optional: an unset repo variable arrives as "" (or
            # "false") and Terraform accepts it, because the three endpoint
            # variables now default empty and FLEXPRICE_ENABLED is the conjunction
            # of the feature switch and the cutover gate. Those three used to be
            # mandatory with unconditional https/UUID/state-code validations, which
            # aborted every apply whose repo variables had never been created; a
            # value is still format-checked when it IS supplied.
            -var="flexprice_base_url=${{ vars.FLEXPRICE_BASE_URL }}"
            -var="flexprice_environment_id=${{ vars.FLEXPRICE_ENVIRONMENT_ID }}"
            -var="flexprice_supplier_state_code=${{ vars.FLEXPRICE_SUPPLIER_STATE_CODE }}"
            -var="flexprice_billing_cutover_enabled=${{ vars.FLEXPRICE_BILLING_CUTOVER_ENABLED || 'false' }}"
            # Dark by default: GATEWAY_VPC_EGRESS_ENABLED unset => false => the
            # gateway's vpc_access block is not rendered at all, so this is a
            # no-op for every deployment that has not opted in. VPC_NETWORK and
            # VPC_SUBNET are passed by name instead of read through a data
            # source: the root stack does not otherwise know about the substrate
            # cluster's network, and an undeclared dependency on a second
            # module's state is harder to debug than two repo variables.
            -var="gateway_vpc_egress_enabled=${{ vars.GATEWAY_VPC_EGRESS_ENABLED || 'false' }}"
            -var="vpc_network=${{ vars.VPC_NETWORK }}"
            -var="vpc_subnet=${{ vars.VPC_SUBNET }}"
            -var="vpc_egress_mode=${{ vars.VPC_EGRESS_MODE || 'PRIVATE_RANGES_ONLY' }}"
            # Agent Substrate is the only execution pattern (#283 retired the Cloud
            # Run planner/coder harnesses), so these names are how a deployed agent
            # reaches a control plane at all. None of them had a CI path before:
            # every consumer falls back to an inert default when its variable is
            # absent, so an unset SUBSTRATE_URL is not a plan error — the deploy
            # goes green, the orchestrator refuses every run as "not configured",
            # and the first person to notice is a user clicking Plan. Keep every
            # default EMPTY: a `|| '<addr>'` fallback here would point production at
            # an address nobody reviewed. The names
            # whose Terraform default is NOT empty are appended below the array
            # instead, for two reasons: an empty `-var="substrate_timeout_ms="` is
            # not a valid HCL number, and an empty string beats the Terraform
            # default for every type.
            -var="substrate_url=${{ vars.SUBSTRATE_URL }}"
            -var="substrate_ingress_url=${{ vars.SUBSTRATE_INGRESS_URL }}"
            -var="substrate_atespace=${{ vars.SUBSTRATE_ATESPACE }}"
            -var="substrate_allowed_atespaces=${SUBSTRATE_ALLOWED_ATESPACES_ARG}"
            -var="substrate_atespace_by_org=${SUBSTRATE_ATESPACE_BY_ORG_ARG}"
            -var="substrate_planner_image=${{ vars.SUBSTRATE_PLANNER_IMAGE }}"
            -var="substrate_jwks_url=${{ vars.SUBSTRATE_JWKS_URL }}"
            # The actor-callback group opens only when all of these agree; iam.tf
            # gates the matching run.invoker binding on substrate_actor_member, so an
            # env without the binding is a refused call and a binding without the
            # env is an unauthenticated prompt endpoint.
            -var="substrate_actor_mode=${{ vars.SUBSTRATE_ACTOR_MODE || 'false' }}"
            -var="substrate_actor_member=${{ vars.SUBSTRATE_ACTOR_MEMBER }}"
          )
          # The five names whose Terraform default is a real value are appended only
          # when the repo variable is set: substrate.tf's own rule is that a key is
          # absent rather than empty, and an empty string here would beat both the
          # Terraform default and a value an operator put in the org's settings.
          [ -n "${{ vars.SUBSTRATE_WORKER_POOL }}" ] && apply_args+=(-var="substrate_worker_pool=${{ vars.SUBSTRATE_WORKER_POOL }}") || true
          [ -n "${{ vars.SUBSTRATE_ACTOR_JWT_AUDIENCE }}" ] && apply_args+=(-var="substrate_actor_jwt_audience=${{ vars.SUBSTRATE_ACTOR_JWT_AUDIENCE }}") || true
          [ -n "${{ vars.SUBSTRATE_TRUST_DOMAIN }}" ] && apply_args+=(-var="substrate_trust_domain=${{ vars.SUBSTRATE_TRUST_DOMAIN }}") || true
          [ -n "${{ vars.SUBSTRATE_TIMEOUT_MS }}" ] && apply_args+=(-var="substrate_timeout_ms=${{ vars.SUBSTRATE_TIMEOUT_MS }}") || true
          [ -n "${{ vars.SUBSTRATE_ACTOR_TTL_MS }}" ] && apply_args+=(-var="substrate_actor_ttl_ms=${{ vars.SUBSTRATE_ACTOR_TTL_MS }}") || true
          [ -n "${{ steps.tags.outputs.gateway }}" ] && apply_args+=(-var="gateway_image_tag=${{ steps.tags.outputs.gateway }}")
          [ -n "${{ steps.tags.outputs.orchestrator }}" ] && apply_args+=(-var="orchestrator_image_tag=${{ steps.tags.outputs.orchestrator }}") || true
          [ -n "${{ steps.tags.outputs.provisioner }}" ] && apply_args+=(-var="provisioner_image_tag=${{ steps.tags.outputs.provisioner }}") || true
          [ -n "${{ steps.tags.outputs.proxy }}" ] && apply_args+=(-var="proxy_image_tag=${{ steps.tags.outputs.proxy }}") || true
          [ -n "${{ steps.tags.outputs.org }}" ]     && apply_args+=(-var="org_image_tag=${{ steps.tags.outputs.org }}") || true
          [ -n "${{ steps.tags.outputs.settings }}" ] && apply_args+=(-var="settings_image_tag=${{ steps.tags.outputs.settings }}") || true
          [ -n "${{ steps.tags.outputs.email }}" ] && apply_args+=(-var="email_image_tag=${{ steps.tags.outputs.email }}") || true
          [ -n "${{ steps.tags.outputs.identity }}" ] && apply_args+=(-var="identity_image_tag=${{ steps.tags.outputs.identity }}") || true
          [ -n "${{ steps.tags.outputs.billing }}" ] && apply_args+=(-var="billing_image_tag=${{ steps.tags.outputs.billing }}") || true
          [ -n "${{ steps.tags.outputs.laya }}" ] && apply_args+=(-var="laya_image_tag=${{ steps.tags.outputs.laya }}") || true
          [ -n "${{ steps.tags.outputs.clm }}" ] && apply_args+=(-var="clm_image_tag=${{ steps.tags.outputs.clm }}") || true
          # One resolved tag drives all three LiteLLM containers (see the tags step).
          [ -n "${{ steps.tags.outputs.litellm }}" ] && apply_args+=(
            -var="litellm_image_tag=${{ steps.tags.outputs.litellm }}"
            -var="litellm_db_image_tag=${{ steps.tags.outputs.litellm }}"
            -var="litellm_redis_image_tag=${{ steps.tags.outputs.litellm }}"
          ) || true

          # Idempotently import pre-existing Firestore composite indexes if missing from state
          chunks_idx_addr="google_firestore_index.attachment_chunks_by_conversation_and_embedding"
          if ! terraform state list 2>/dev/null | grep -qxF "$chunks_idx_addr"; then
            existing_chunks_idx="$(gcloud firestore indexes composite list --project="${{ vars.GCP_PROJECT_ID }}" --format=json 2>/dev/null | jq -r '.[] | select((.queryScope=="COLLECTION_GROUP" or .queryScope==null) and ((.name | contains("/collectionGroups/chunks/indexes/")) or (.fields[0].fieldPath=="conversationId" and .fields[1].fieldPath=="embedding"))) | .name' 2>/dev/null | head -n 1 || true)"
            if [ -n "$existing_chunks_idx" ]; then
              echo "Importing existing Firestore attachment chunks vector index ($existing_chunks_idx) into Terraform state..."
              terraform import -input=false "${apply_args[@]}" "$chunks_idx_addr" "$existing_chunks_idx" || true
            fi
          fi

          users_idx_addr="google_firestore_index.org_users_by_created_at"
          if ! terraform state list 2>/dev/null | grep -qxF "$users_idx_addr"; then
            existing_users_idx="$(gcloud firestore indexes composite list --project="${{ vars.GCP_PROJECT_ID }}" --format=json 2>/dev/null | jq -r '.[] | select((.name | contains("/collectionGroups/users/indexes/")) or (.fields[0].fieldPath=="org_id" and .fields[1].fieldPath=="created_at")) | .name' 2>/dev/null | head -n 1 || true)"
            if [ -n "$existing_users_idx" ]; then
              echo "Importing existing Firestore org users index ($existing_users_idx) into Terraform state..."
              terraform import -input=false "${apply_args[@]}" "$users_idx_addr" "$existing_users_idx" || true
            fi
          fi

          terraform plan -input=false -no-color -out=primary.tfplan "${apply_args[@]}" | tee primary-plan.txt
          {
            echo '### Primary Terraform plan'
            grep -E '^Plan:|^No changes' primary-plan.txt || echo 'No summary line found.'
          } >> "$GITHUB_STEP_SUMMARY"

          # #283 retired the Cloud Run harness in code and this plan retires it in
          # production: once `planner` / `coder-control` / `coder-worker` are gone,
          # Agent Substrate is the ONLY pattern that can run an agent. Applying that
          # with substrate_url unset still goes green — the consumers fall back to
          # their inert defaults and the orchestrator refuses every run as "not
          # configured", so the failure surfaces as a user's dead button, not as a
          # red job. Stop in the step that can still stop the apply, and name the
          # switch.
          if grep -qE '^  # google_cloud_run_v2_(service|job)\.(planner|coder_control|coder_worker) will be destroyed' primary-plan.txt \
            && [ -z "${{ vars.SUBSTRATE_URL }}" ]; then
            echo "::error::This plan destroys the last Cloud Run agent harness while SUBSTRATE_URL is unset, leaving no runnable agent pattern. Set the address with 'gh variable set SUBSTRATE_URL --body \"<ateapi gRPC address>\"' (see docs/SUBSTRATE_STATUS.md causes 5 and 9), then re-run."
            exit 1
          fi
          terraform apply -input=false primary.tfplan

      - name: Outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output

  # --------------------------------------------------------------------------
  # 4. Substrate GKE reconcile. Separate stack, separate state prefix, no
  #    images — see deploy/gcp/terraform-substrate-gke/README.md.
  #
  #    Applies the plan it just published, EXCEPT for anything destructive: a
  #    plan containing a delete (a node-pool or gateway replacement counts) fails
  #    the run instead, so a merge can converge the cluster but cannot take it
  #    apart. gke_plan_only / gke_allow_destroy are the operator's levers.
  #
  #    The whole module is planned against live: gh-deployer holds
  #    roles/container.admin, which GKE maps to Kubernetes cluster-admin, so the
  #    helm releases and manifests in this state are readable as well as the
  #    Compute objects (roles/compute.viewer, granted by bootstrap.sh). Nothing
  #    is -targeted: an enumerated target list silently stops covering the stack
  #    the moment the module grows a resource, and a reconcile that quietly
  #    ignores half the module is worse than one that fails.
  # --------------------------------------------------------------------------
  gke_reconcile:
    needs: changes
    if: needs.changes.outputs.run_gke == 'true'
    runs-on: ubuntu-24.04
    name: reconcile substrate gke
    # Shared with substrate-cluster-power: that workflow owns the node pools'
    # min/max, and this job reads them to pass them back unchanged.
    concurrency:
      group: substrate-cluster-power
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLUSTER: ${{ vars.SUBSTRATE_CLUSTER_NAME || 'substrate-multitenant' }}
      ZONE: ${{ vars.SUBSTRATE_CLUSTER_ZONE || 'asia-south1-a' }}
      NODE_POOL: ${{ vars.SUBSTRATE_TENANT_NODE_POOL || 'substrate-node-pool' }}
      SYSTEM_NODE_POOL: ${{ vars.SUBSTRATE_SYSTEM_NODE_POOL || 'substrate-system-node-pool' }}
      GKE_TF_DIR: deploy/gcp/terraform-substrate-gke
      GKE_TF_STATE_PREFIX: substrate/gke
      GKE_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve mode and inputs
        id: gke
        env:
          PLAN_ONLY: ${{ inputs.gke_plan_only }}
          CERT_EMAIL: ${{ vars.SUBSTRATE_CERT_EMAIL }}
        run: |
          set -euo pipefail
          if [ "$PLAN_ONLY" = "true" ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Mode: plan only"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Mode: plan + apply"
          fi
          # cert_email is a required module variable with no default.
          if [ -z "$CERT_EMAIL" ]; then
            echo "::error::Set the ACME email once: gh variable set SUBSTRATE_CERT_EMAIL --body \"<email>\""
            exit 1
          fi
          echo "cert_email=$CERT_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Read live autoscaling bounds
        id: bounds
        env:
          SUBSTRATE_NODE_POOL: ${{ vars.SUBSTRATE_NODE_POOL }}
        run: |
          set -euo pipefail
          # The pool may not exist yet: this root is greenfield, and the first
          # reconcile of a fresh stack is what creates it. So read the live bounds
          # when they are there and leave the module defaults in plan when they
          # are not — same shape as the substrate and system pools below. An
          # unguarded describe here fails the job before Terraform ever runs.
          if POOL_JSON="$(gcloud container node-pools describe "$NODE_POOL" \
            --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" --format json 2>/dev/null)"; then
            # The power workflow parks min at 0 to stop the cluster and GKE omits
            # minNodeCount when it is 0. Passing the live bounds back in is what
            # keeps a reconcile from silently starting (or capping) the pool.
            MIN="$(jq -r '.autoscaling.minNodeCount // .initialNodeCount // 0' <<<"$POOL_JSON")"
            MAX="$(jq -r '.autoscaling.maxNodeCount // .initialNodeCount // 1' <<<"$POOL_JSON")"
            echo "min=$MIN" >> "$GITHUB_OUTPUT"
            echo "max=$MAX" >> "$GITHUB_OUTPUT"
            echo "Live node pool bounds: min=$MIN max=$MAX"
          else
            echo "Tenant pool $NODE_POOL not found yet; leaving module defaults in plan."
          fi
          # The substrate worker pool is parked the same way by the power
          # workflow; read its live bounds too so a reconcile cannot spin a
          # stopped substrate node back up by applying the module default.
          if [ -n "$SUBSTRATE_NODE_POOL" ]; then
            if SPOL_JSON="$(gcloud container node-pools describe "$SUBSTRATE_NODE_POOL" \
              --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" --format json 2>/dev/null)"; then
              SMIN="$(jq -r '.autoscaling.minNodeCount // .initialNodeCount // 0' <<<"$SPOL_JSON")"
              SMAX="$(jq -r '.autoscaling.maxNodeCount // .initialNodeCount // 1' <<<"$SPOL_JSON")"
              echo "smin=$SMIN" >> "$GITHUB_OUTPUT"
              echo "smax=$SMAX" >> "$GITHUB_OUTPUT"
              echo "Live substrate pool bounds: min=$SMIN max=$SMAX"
            else
              echo "Substrate pool $SUBSTRATE_NODE_POOL not found yet; leaving module defaults in plan."
            fi
          fi
          # The power workflow parks the system pool too, so read it back the same
          # way: applying the module's system_min_nodes = 1 would hand the add-ons
          # a node right after a stop and undo the whole point of parking it.
          if YPOL_JSON="$(gcloud container node-pools describe "$SYSTEM_NODE_POOL" \
            --cluster "$CLUSTER" --location "$ZONE" --project "$PROJECT_ID" --format json 2>/dev/null)"; then
            YMIN="$(jq -r '.autoscaling.minNodeCount // .initialNodeCount // 0' <<<"$YPOL_JSON")"
            YMAX="$(jq -r '.autoscaling.maxNodeCount // .initialNodeCount // 1' <<<"$YPOL_JSON")"
            echo "sysmin=$YMIN" >> "$GITHUB_OUTPUT"
            echo "sysmax=$YMAX" >> "$GITHUB_OUTPUT"
            echo "Live system pool bounds: min=$YMIN max=$YMAX"
          else
            echo "System pool $SYSTEM_NODE_POOL not found yet; leaving module defaults in plan."
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.GKE_TF_DIR }}
        run: |
          set -euo pipefail
          BUCKET="${GKE_TF_STATE_BUCKET:-${PROJECT_ID}-tfstate}"
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="prefix=$GKE_TF_STATE_PREFIX"
          # GREENFIELD: the cluster and every GKE resource this file describes were
          # destroyed before the root was re-pointed here, so an empty state is the
          # expected starting condition and the first plan is a create, not an
          # adoption. The guard that used to sit here failed an empty prefix ("run
          # the IMPORT.md adoption pass first") on the assumption that a live
          # cluster was waiting to be duplicated — that assumption is gone, and so
          # is the runbook. The opposite risk (a populated state whose resources
          # were deleted out from under it) is still caught: the delete count below
          # fails the run rather than applying it.
          STATE_COUNT="$(terraform state list | wc -l | tr -d ' ')"
          if [ "$STATE_COUNT" -lt 1 ]; then
            echo "::notice::Remote state at gs://$BUCKET/$GKE_TF_STATE_PREFIX is empty — greenfield first apply, everything in plan is a create."
          else
            echo "State already holds $STATE_COUNT resources"
          fi

      - name: Validate configuration
        working-directory: ${{ env.GKE_TF_DIR }}
        run: |
          set -euo pipefail
          terraform validate -no-color
          if [ -n "$(terraform fmt -check -diff -no-color)" ]; then
            echo "::error::terraform fmt drifted; run 'terraform fmt' in $GKE_TF_DIR."
            terraform fmt -check -diff -no-color || true
            exit 1
          fi

      - name: Plan
        working-directory: ${{ env.GKE_TF_DIR }}
        env:
          MIN_NODES: ${{ steps.bounds.outputs.min }}
          MAX_NODES: ${{ steps.bounds.outputs.max }}
          SYS_MIN_NODES: ${{ steps.bounds.outputs.sysmin }}
          SYS_MAX_NODES: ${{ steps.bounds.outputs.sysmax }}
          CERT_EMAIL: ${{ steps.gke.outputs.cert_email }}
          WILL_APPLY: ${{ steps.gke.outputs.apply }}
          # Agent Substrate is opt-in: unset SUBSTRATE_ENABLED leaves the module
          # default (false) and the whole substrate.tf block stays out of plan.
          SUBSTRATE_ENABLED: ${{ vars.SUBSTRATE_ENABLED }}
          SUBSTRATE_INGRESS_HOSTNAME: ${{ vars.SUBSTRATE_INGRESS_HOSTNAME }}
          SUBSTRATE_NODE_POOL: ${{ vars.SUBSTRATE_NODE_POOL }}
          SUBSTRATE_MACHINE_TYPE: ${{ vars.SUBSTRATE_MACHINE_TYPE }}
          SUBSTRATE_ATEAPI_SERVICE: ${{ vars.SUBSTRATE_ATEAPI_SERVICE }}
          SUBSTRATE_ATEAPI_PORT: ${{ vars.SUBSTRATE_ATEAPI_PORT }}
          SUBSTRATE_CONTROL_PLANE_PUBLIC: ${{ vars.SUBSTRATE_CONTROL_PLANE_PUBLIC }}
          SUBSTRATE_LIVE_MIN: ${{ steps.bounds.outputs.smin }}
          SUBSTRATE_LIVE_MAX: ${{ steps.bounds.outputs.smax }}
        run: |
          set -euo pipefail
          if [ "$WILL_APPLY" = "true" ]; then MODE_LABEL="plan + apply"; else MODE_LABEL="plan only"; fi
          substrate_args=()
          if [ -n "$SUBSTRATE_ENABLED" ]; then substrate_args+=(-var="substrate_enabled=$SUBSTRATE_ENABLED"); fi
          [ -n "$SUBSTRATE_INGRESS_HOSTNAME" ] && substrate_args+=(-var="substrate_ingress_hostname=$SUBSTRATE_INGRESS_HOSTNAME")
          [ -n "$SUBSTRATE_NODE_POOL" ]        && substrate_args+=(-var="substrate_node_pool_name=$SUBSTRATE_NODE_POOL")
          [ -n "$SUBSTRATE_MACHINE_TYPE" ]     && substrate_args+=(-var="substrate_machine_type=$SUBSTRATE_MACHINE_TYPE")
          [ -n "$SUBSTRATE_ATEAPI_SERVICE" ]   && substrate_args+=(-var="substrate_ateapi_service=$SUBSTRATE_ATEAPI_SERVICE")
          [ -n "$SUBSTRATE_ATEAPI_PORT" ]      && substrate_args+=(-var="substrate_ateapi_port=$SUBSTRATE_ATEAPI_PORT")
          [ -n "$SUBSTRATE_CONTROL_PLANE_PUBLIC" ] && substrate_args+=(-var="substrate_control_plane_public=$SUBSTRATE_CONTROL_PLANE_PUBLIC")
          [ -n "$SUBSTRATE_LIVE_MIN" ]         && substrate_args+=(-var="substrate_min_nodes=$SUBSTRATE_LIVE_MIN")
          [ -n "$SUBSTRATE_LIVE_MAX" ]         && substrate_args+=(-var="substrate_max_nodes=$SUBSTRATE_LIVE_MAX")
          # Empty when the pool does not exist yet (fresh stack): the module
          # defaults describe it, so keep the defaults in the plan rather than
          # passing -var="min_nodes=" and failing Terraform's type check.
          tenant_args=()
          [ -n "$MIN_NODES" ] && tenant_args+=(-var="min_nodes=$MIN_NODES")
          [ -n "$MAX_NODES" ] && tenant_args+=(-var="max_nodes=$MAX_NODES")
          system_args=()
          [ -n "$SYS_MIN_NODES" ] && system_args+=(-var="system_min_nodes=$SYS_MIN_NODES")
          [ -n "$SYS_MAX_NODES" ] && system_args+=(-var="system_max_nodes=$SYS_MAX_NODES")
          terraform plan -refresh=true -input=false \
            -var="project_id=$PROJECT_ID" \
            -var="zone=$ZONE" \
            -var="cluster_name=$CLUSTER" \
            -var="node_pool_name=$NODE_POOL" \
            -var="cert_email=$CERT_EMAIL" \
            "${tenant_args[@]}" \
            "${system_args[@]}" \
            "${substrate_args[@]}" \
            -out=gke.tfplan
          terraform show -json gke.tfplan > gke.json
          {
            echo "## Terraform plan — Substrate GKE"
            echo ""
            echo "Mode: **$MODE_LABEL** · scope: the whole module (GKE, network, in-cluster platform), refreshed against live."
            echo ""
            echo '```'
            terraform show -no-color gke.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assess the plan
        id: plan
        working-directory: ${{ env.GKE_TF_DIR }}
        run: |
          set -euo pipefail
          # A replacement shows up as a create plus a delete on two addresses, so
          # these counts overlap by design; the gate below only cares whether any
          # delete is in plan.
          ADD="$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' gke.json)"
          CHANGE="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' gke.json)"
          DESTROY="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' gke.json)"
          {
            echo "add=$ADD"
            echo "change=$CHANGE"
            echo "destroy=$DESTROY"
            echo "changed=$(( ADD + CHANGE + DESTROY ))"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: $ADD create, $CHANGE update, $DESTROY delete (diff in the job summary)"
          # A plan-only run leaves the module and the cluster apart, so say so
          # loudly — otherwise a merged .tf edit looks shipped when it is only
          # staged in this summary.
          if [ "$(( ADD + CHANGE + DESTROY ))" -gt 0 ] && [ "${{ steps.gke.outputs.apply }}" != "true" ]; then
            echo "::warning::$ADD create / $CHANGE update / $DESTROY delete pending. This was a plan-only run; the GKE stack is NOT converged."
          fi

      - name: Block a destroying apply
        if: steps.gke.outputs.apply == 'true'
        env:
          DESTROY_COUNT: ${{ steps.plan.outputs.destroy }}
          ALLOW_DESTROY: ${{ inputs.gke_allow_destroy }}
        run: |
          set -euo pipefail
          # Deleting anything here tears down cluster primitives. The cluster is
          # behind deletion_protection, but a node-pool or gateway replacement
          # shows up the same way and is just as disruptive.
          if [ "$DESTROY_COUNT" -gt 0 ] && [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::The plan destroys $DESTROY_COUNT resource(s). Refusing to apply; re-run Deploy to GCP with gke_reconcile + gke_allow_destroy only if that is what you expect."
            exit 1
          fi

      - name: Apply
        if: steps.gke.outputs.apply == 'true' && steps.plan.outputs.changed != '0'
        working-directory: ${{ env.GKE_TF_DIR }}
        # Applies the exact plan published above (no re-solve, no prompt), so
        # what lands is what the summary showed.
        run: terraform apply -input=false -auto-approve gke.tfplan

      - name: Report node pool
        run: |
          set -euo pipefail
          gcloud container node-pools list --cluster "$CLUSTER" \
            --location "$ZONE" --project "$PROJECT_ID" \
            --format 'table(name, status, config.machineType, autoscaling.minNodeCount, autoscaling.maxNodeCount)'

  # --------------------------------------------------------------------------
  # 4. Self-hosted FlexPrice: build the pinned upstream artifact, stage the
  #    patched chart, and reconcile deploy/gcp/terraform-flexprice.
  #
  #    Own state prefix and own concurrency group. It must NOT join
  #    `substrate-cluster-power`: that group exists so nothing flips a substrate
  #    pool's autoscaling bounds while the power workflow is parking it, and this
  #    job's node pool is deliberately outside the pools that workflow names
  #    (deploy/gcp/flexprice-infra.test.js pins that). Sharing the group would
  #    serialise two unrelated stacks for no safety.
  #
  #    Why the build steps are here rather than in a workstation runbook: the
  #    chart is not pullable (`oci://ghcr.io/flexprice/charts/flexprice` answers
  #    401 to an anonymous token request) and neither is the image, so BOTH
  #    artifacts exist only if something builds them from the commit recorded in
  #    deploy/flexprice/VERSION. Anything that must happen in that order, with
  #    registry credentials, is CI work.
  # --------------------------------------------------------------------------
  flexprice_reconcile:
    needs: changes
    if: needs.changes.outputs.run_flexprice == 'true'
    runs-on: ubuntu-24.04
    name: reconcile flexprice (gke)
    concurrency:
      group: flexprice-reconcile
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLUSTER: ${{ vars.SUBSTRATE_CLUSTER_NAME || 'substrate-multitenant' }}
      ZONE: ${{ vars.SUBSTRATE_CLUSTER_ZONE || 'asia-south1-a' }}
      FP_TF_DIR: deploy/gcp/terraform-flexprice
      FP_TF_STATE_PREFIX: substrate/flexprice
      FP_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      FP_NAMESPACE: flexprice
      AR_HOST: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev
      FP_IMAGE_REPO: flexprice-app
      FP_CHART_REPO: flexprice-chart
      # Pinned by a human, never derived: a chart whose templates were patched
      # must be re-versioned deliberately, because pushing different templates
      # under a version the module already installed is how an unreviewed chart
      # reaches a cluster.
      FP_CHART_VERSION: ${{ vars.FLEXPRICE_CHART_VERSION || '1.10.0+fleet.1' }}
      UPSTREAM: https://github.com/flexprice/flexprice
      CHART_SRC: internal/ee/infrastructure/helm/flexprice
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Cluster credentials + registry logins
        run: |
          set -euo pipefail
          # Before anything else: kubectl is needed to mirror the Secret, and the
          # Helm OCI login is needed to push the chart. `helm` has no ADC, so the
          # registry password is a short-lived access token — and Artifact Registry
          # pairs the credential kind with the username: a token must be presented
          # as oauth2accesstoken (_json_key only accepts the full service-account
          # key file and 401s on a token). The token goes through stdin so it never
          # lands in the job log or process arguments.
          #
          # GKE 1.30+ kubeconfigs authenticate by shelling out to this plugin;
          # without it every kubectl call dies with "gke-gcloud-auth-plugin: not
          # found" (same install as substrate-control-plane.yml).
          gcloud components install kubectl gke-gcloud-auth-plugin --quiet
          gcloud container clusters get-credentials "$CLUSTER" --zone "$ZONE" --project "$PROJECT_ID"
          gcloud auth configure-docker "$AR_HOST" --quiet
          gcloud auth print-access-token | helm registry login "oci://$AR_HOST" \
            --username=oauth2accesstoken --password-stdin

      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          COMMIT="$(sed -n 's/^commit=//p' deploy/flexprice/VERSION)"
          REF="$(sed -n 's/^ref=//p' deploy/flexprice/VERSION)"
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy/flexprice/VERSION has no 40-hex commit= line (got ${COMMIT:-<empty>}). Everything built here must come from one exact tree."
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building FlexPrice from $REF ($COMMIT)"

      - name: Check out the pinned upstream commit
        id: src
        run: |
          set -euo pipefail
          # Fetched by SHA rather than cloned at a branch: `main` moves, and a
          # deployment built from whatever `main` was is not the deployment the
          # findings and the chart patch were derived from.
          git clone --filter=blob:none --no-checkout "$UPSTREAM" /tmp/fp-upstream
          git -C /tmp/fp-upstream fetch --depth 1 origin '${{ steps.pin.outputs.commit }}'
          git -C /tmp/fp-upstream checkout --quiet FETCH_HEAD
          test -f "/tmp/fp-upstream/$CHART_SRC/Chart.yaml"
          echo "dir=/tmp/fp-upstream" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Terraform init
        working-directory: ${{ env.FP_TF_DIR }}
        run: |
          set -euo pipefail
          BUCKET="${FP_TF_STATE_BUCKET:-${PROJECT_ID}-tfstate}"
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="prefix=$FP_TF_STATE_PREFIX"
          STATE_COUNT="$(terraform state list | wc -l | tr -d ' ')"
          if [ "$STATE_COUNT" -lt 1 ]; then
            echo "::notice::Remote state at gs://$BUCKET/$FP_TF_STATE_PREFIX is empty — greenfield first apply; everything in plan is a create."
          else
            echo "State already holds $STATE_COUNT resources"
          fi

      - name: Ensure the artifacts have somewhere to land
        working-directory: ${{ env.FP_TF_DIR }}
        run: |
          set -euo pipefail
          # The chicken-and-egg APPLY.md describes: the chart is installed FROM
          # Artifact Registry, and Artifact Registry is created BY this root. Two
          # targeted applies break it — the repos/APIs, then the namespace the
          # Secret mirror below needs. Nothing that runs a Helm release is in
          # scope here, so this cannot half-install the stack.
          #
          # The namespace target drags `google_container_node_pool.flexprice` in
          # through its depends_on, so the pool is built here too — several
          # minutes, and unavoidable: it is the only place the StatefulSets can
          # schedule, so a reconcile that skipped it would just fail later.
          terraform apply -input=false -auto-approve \
            -var="project_id=$PROJECT_ID" -var="zone=$ZONE" -var="cluster_name=$CLUSTER" \
            -target=google_project_service.flexprice_apis \
            -target=google_artifact_registry_repository.flexprice_app \
            -target=google_artifact_registry_repository.flexprice_chart
          terraform apply -input=false -auto-approve \
            -var="project_id=$PROJECT_ID" -var="zone=$ZONE" -var="cluster_name=$CLUSTER" \
            -target=kubernetes_namespace_v1.flexprice

      - name: Build + push the app image
        id: image
        run: |
          set -euo pipefail
          IMG="$AR_HOST/$PROJECT_ID/$FP_IMAGE_REPO/flexprice-app"
          BUILD_TAG="$IMG:ci-$GITHUB_RUN_ID"
          # The Dockerfile is upstream's own (compose.yaml builds the same way
          # locally); nothing here re-implements how FlexPrice compiles.
          docker build -t "$BUILD_TAG" -f '${{ steps.src.outputs.dir }}/Dockerfile' '${{ steps.src.outputs.dir }}'
          docker push "$BUILD_TAG"
          DIGEST="$(gcloud artifacts docker images describe "$BUILD_TAG" \
            --format 'value(image_summary.digest)' --quiet)"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not read a sha256 digest back from $BUILD_TAG (got ${DIGEST:-<empty>}). Refusing to install an image whose identity is unknown."
            exit 1
          fi
          # Content-derived tag, not a run-numbered one. The migration Job's NAME
          # hashes `<repository>:<tag>`, so a stable tag plus a moved digest is
          # the silent-skip case: the new image's versioned migrations never run
          # and /health does not notice. This tag cannot describe anything other
          # than the bytes it was computed from.
          SHORT_TAG="${{ steps.pin.outputs.ref }}-ci${DIGEST:7:12}"
          docker tag "$BUILD_TAG" "$IMG:$SHORT_TAG"
          docker push "$IMG:$SHORT_TAG"
          {
            echo "digest=$DIGEST"
            echo "tag=$SHORT_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "image: $IMG:$SHORT_TAG @ $DIGEST"

      - name: Stage + push the chart
        id: chart
        run: |
          set -euo pipefail
          node scripts/flexprice-stage-chart.js \
            --source '${{ steps.src.outputs.dir }}/'"$CHART_SRC" \
            --out /tmp/fp-staged/flexprice \
            --version "$FP_CHART_VERSION" | tee /tmp/stage.log
          SHA="$(sed -n 's/^chart sha256: //p' /tmp/stage.log)"
          # Linted WITH the module's own values file, not bare: a shape error in
          # base.yaml (a key the chart no longer has, a `fail` on two migration
          # steps) must surface here rather than as a Helm timeout mid-apply.
          helm lint /tmp/fp-staged/flexprice --values "$FP_TF_DIR/values/base.yaml"
          helm package /tmp/fp-staged/flexprice -d /tmp/fp-pkg
          # Pushed unconditionally: Artifact Registry is content-addressed, so an
          # identical re-push is a no-op and a DIFFERENT chart under this version
          # is refused. That refusal is the wanted signal — it means the pinned
          # version already ships templates that are not these, and the fix is a
          # human bumping FLEXPRICE_CHART_VERSION and recording the new sha in
          # deploy/flexprice/VERSION, not a silent overwrite.
          helm push "/tmp/fp-pkg/flexprice-${FP_CHART_VERSION}.tgz" "oci://$AR_HOST/$PROJECT_ID/$FP_CHART_REPO"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$FP_CHART_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Staged FlexPrice chart"
            echo ""
            echo "* upstream commit: \`${{ steps.pin.outputs.commit }}\`"
            echo "* chart version: \`$FP_CHART_VERSION\`"
            echo "* patched-chart sha256: \`$SHA\` — record this in deploy/flexprice/VERSION"
            echo "* image: \`flexprice-app:${SHORT}\` @ \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHORT: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}

      - name: Mirror the Secret Manager values into the cluster
        env:
          SECRET_IDS: flexprice-postgres-password flexprice-clickhouse-password flexprice-auth-secret flexprice-encryption-key flexprice-api-key-keys
        run: |
          set -euo pipefail
          # The five containers are Terraform-owned with NO versions in state; the
          # material is the operator's. Read each enabled version into a file (not
          # argv, not stdout) and apply the Kubernetes Secret the chart is pointed
          # at. Same out-of-band posture as the root stack's secret staging.
          DIR="$(mktemp -d)"; chmod 700 "$DIR"; trap 'rm -rf "$DIR"' EXIT
          for id in $SECRET_IDS; do
            key="${id#flexprice-}"
            if ! gcloud secrets versions access latest --secret="$id" --project "$PROJECT_ID" \
                 > "$DIR/$key" 2>/dev/null; then
              echo "::error::Secret Manager has no enabled version for $id. Seed it before reconciling: gcloud secrets versions add $id --data-file=... (this job never creates secret material)."
              exit 1
            fi
            chmod 600 "$DIR/$key"
          done
          # api-key-keys is the tenant→key map the API authenticates against, and
          # only the seeded tenant exists. A map for any other id answers 401 on
          # every call with nothing wrong in the stack, so check it here.
          if ! grep -q '00000000-0000-0000-0000-000000000000' "$DIR/api-key-keys"; then
            echo "::error::flexprice-api-key-keys does not name the seeded tenant 00000000-0000-0000-0000-000000000000; the API would authenticate nothing."
            exit 1
          fi
          kubectl -n "$FP_NAMESPACE" create secret generic flexprice-secrets \
            --from-file="postgres-password=$DIR/postgres-password" \
            --from-file="clickhouse-password=$DIR/clickhouse-password" \
            --from-file="auth-secret=$DIR/auth-secret" \
            --from-file="encryption-key=$DIR/encryption-key" \
            --from-file="api-key-keys=$DIR/api-key-keys" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "flexprice-secrets applied ($(kubectl -n "$FP_NAMESPACE" get secret flexprice-secrets -o jsonpath='{.data}' | wc -c) byte of key names, values not printed)"

      - name: Validate configuration
        working-directory: ${{ env.FP_TF_DIR }}
        run: |
          set -euo pipefail
          terraform validate -no-color
          if [ -n "$(terraform fmt -check -diff -no-color)" ]; then
            echo "::error::terraform fmt drifted; run 'terraform fmt' in $FP_TF_DIR."
            terraform fmt -check -diff -no-color || true
            exit 1
          fi

      - name: Plan
        working-directory: ${{ env.FP_TF_DIR }}
        env:
          PLAN_ONLY: ${{ inputs.flexprice_plan_only }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          INGRESS_HOSTNAME: ${{ vars.FLEXPRICE_INGRESS_HOSTNAME }}
          CERT_EMAIL: ${{ vars.FLEXPRICE_CERT_EMAIL }}
          REGISTRY_PREFIX: ${{ vars.FLEXPRICE_IMAGE_REGISTRY_PREFIX }}
        run: |
          set -euo pipefail
          if [ "$PLAN_ONLY" = "true" ]; then echo "apply=false" >> "$GITHUB_OUTPUT"; MODE="plan only";
          else echo "apply=true" >> "$GITHUB_OUTPUT"; MODE="plan + apply"; fi
          echo "$MODE" > /tmp/fp-mode
          # The plan-only path is the reviewable-first-run path, so it must still
          # carry a REAL digest and tag: an empty digest makes the plan render
          # `:tag` references that no apply will ever match.
          terraform plan -refresh=true -input=false \
            -var="project_id=$PROJECT_ID" -var="zone=$ZONE" -var="cluster_name=$CLUSTER" \
            -var="chart_version=$CHART_VERSION" \
            -var="image_digest=$DIGEST" -var="image_tag=$TAG" \
            ${INGRESS_HOSTNAME:+-var="ingress_hostname=$INGRESS_HOSTNAME"} \
            ${CERT_EMAIL:+-var="cert_email=$CERT_EMAIL"} \
            ${REGISTRY_PREFIX:+-var="image_registry_prefix=$REGISTRY_PREFIX"} \
            -out=fp.tfplan
          terraform show -json fp.tfplan > fp.json
          {
            echo "## Terraform plan — FlexPrice (GKE)"
            echo ""
            echo "Mode: **$MODE** · chart \`$CHART_VERSION\` · image \`$TAG\` @ \`$DIGEST\`"
            echo ""
            echo '```'
            terraform show -no-color fp.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assess the plan
        id: plan
        working-directory: ${{ env.FP_TF_DIR }}
        run: |
          set -euo pipefail
          ADD="$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' fp.json)"
          CHANGE="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' fp.json)"
          DESTROY="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' fp.json)"
          {
            echo "add=$ADD"
            echo "change=$CHANGE"
            echo "destroy=$DESTROY"
            echo "changed=$(( ADD + CHANGE + DESTROY ))"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: $ADD create, $CHANGE update, $DESTROY delete"
          if [ "$(( ADD + CHANGE + DESTROY ))" -gt 0 ] && [ "$(cat /tmp/fp-mode)" != "plan + apply" ]; then
            echo "::warning::$ADD create / $CHANGE update / $DESTROY delete pending. This was a plan-only run; the FlexPrice stack is NOT converged."
          fi

      - name: Block a destroying apply
        if: inputs.flexprice_plan_only != 'true'
        env:
          DESTROY_COUNT: ${{ steps.plan.outputs.destroy }}
          ALLOW_DESTROY: ${{ inputs.flexprice_allow_destroy }}
        run: |
          set -euo pipefail
          # A delete here is a database, a PV reference or the node pool. The
          # volumes survive by design (Retain + resource-policy keep) but the
          # StatefulSets do not, and re-creating them against retained data is
          # exactly the operation that deserves an explicit human instruction.
          if [ "$DESTROY_COUNT" -gt 0 ] && [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::The plan destroys $DESTROY_COUNT resource(s). Refusing to apply; re-run with flexprice_reconcile + flexprice_allow_destroy only if that is what you expect."
            exit 1
          fi

      - name: Apply
        if: inputs.flexprice_plan_only != 'true' && steps.plan.outputs.changed != '0'
        working-directory: ${{ env.FP_TF_DIR }}
        run: terraform apply -input=false -auto-approve fp.tfplan

      - name: Dump why the cluster is unhappy
        if: failure()
        run: |
          set +e
          # atomic + cleanup_on_fail means a failed release leaves NOTHING behind
          # in-cluster to inspect, and helm's own report is "context deadline
          # exceeded" — true and useless. The reason is a scheduling event or a
          # container waiting state, both one kubectl away.
          kubectl -n "$FP_NAMESPACE" get pods -o wide
          kubectl -n "$FP_NAMESPACE" get events --sort-by=.lastTimestamp | tail -60
          helm -n "$FP_NAMESPACE" list
          for job in $(kubectl -n "$FP_NAMESPACE" get job -o name 2>/dev/null); do
            echo "--- $job ---"; kubectl -n "$FP_NAMESPACE" logs "$job" --all-containers --tail=40
          done

      - name: Verify the stack answers
        if: inputs.flexprice_plan_only != 'true' && steps.plan.outputs.changed != '0'
        run: |
          set -euo pipefail
          for d in flexprice-api flexprice-consumer flexprice-worker; do
            kubectl -n "$FP_NAMESPACE" rollout status "deploy/$d" --timeout=300s
          done
          for s in flexprice-postgres flexprice-clickhouse flexprice-kafka flexprice-redis; do
            kubectl -n "$FP_NAMESPACE" rollout status "statefulset/$s" --timeout=600s
          done
          kubectl -n "$FP_NAMESPACE" rollout status deploy/flexprice-temporal --timeout=300s

          # The namespace registration is the silent one: a worker crashloop
          # several minutes later is the only other way it surfaces.
          kubectl -n "$FP_NAMESPACE" logs job/flexprice-temporal-bootstrap --tail=20
          kubectl -n "$FP_NAMESPACE" exec deploy/flexprice-temporal -- \
            temporal operator namespace describe -n default --address 127.0.0.1:7233 >/dev/null

          # Read the health + auth behaviour over the in-cluster Service, not the
          # public front: the front may still be waiting on a DNS record, and an
          # unauthenticated 401 from /v1/meters is the proof that the API and its
          # key boundary are both live.
          kubectl -n "$FP_NAMESPACE" port-forward svc/flexprice-api 18080:80 >/tmp/pf.log 2>&1 &
          PF=$!; trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 2; done
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)"
          echo "/health -> $CODE"
          [ "$CODE" = "200" ]
          UNAUTH="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/meters)"
          echo "/v1/meters (no key) -> $UNAUTH"
          if [ "$UNAUTH" != "401" ]; then
            echo "::error::/v1/meters answered $UNAUTH without a key. The API is up but not enforcing the key boundary."
            exit 1
          fi

      - name: What is still the operator's job
        if: inputs.flexprice_plan_only != 'true' && steps.plan.outputs.changed != '0'
        run: |
          set -euo pipefail
          cd "$FP_TF_DIR"
          terraform output -raw flexprice_dns_hint 2>/dev/null || true
          {
            echo "### FlexPrice: not done by this job"
            echo ""
            echo "* **Plane API keys** are not minted here. \`scripts/flexprice-provision.js\`"
            echo "  reads and writes \`deploy/flexprice/.env\`, which is a workstation file; a CI"
            echo "  runner has no admin key and should not acquire one. Run it once the front"
            echo "  exists, per APPLY.md step 2."
            echo "* **The A record.** Create \`<hostname> → ingress IP\` (TTL 300) if a public"
            echo "  front is configured; nothing in this repo writes Cloud DNS."
            echo "* **The billing cutover stays closed.** This job never touches"
            echo "  \`FLEXPRICE_BILLING_CUTOVER_ENABLED\`; no organization can be billed by what"
            echo "  it installed while docs/FLEXPRICE_AGPL_MEMO.md is uncleared."
          } >> "$GITHUB_STEP_SUMMARY"
