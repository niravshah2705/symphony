name: Publish Skills Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected bundle version (must match the committed manifest)
        type: string
        required: true
        default: v1

# Never let two publishes race the same bucket prefix.
concurrency:
  group: skills-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish skills
        env:
          VERSION: ${{ inputs.version }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SKILLS_BUCKET: ${{ vars.SKILLS_BUCKET }}
        run: npm run skills:publish -- --version "$VERSION"
