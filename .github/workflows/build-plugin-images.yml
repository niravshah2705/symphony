name: Build agent plugin images

# Publishes the kagent Agent Plugins 1.0.0 bundle images to ghcr.io, driven by
# deploy/kagent/plugins.csv. Each row pins an upstream repo to a full 40-hex
# commit and names the version that commit ships upstream; a PR run only
# resolves and validates the rows, and the merge to main publishes. Flip
# `current` to move the :latest tag; add a row to stage a version.
#
# Today one row (ecc) is deployed; the matrix keeps "add the second plugin"
# a CSV edit rather than a workflow edit.
#
# kagent rejects a plugin source that is not immutable, so the product of a
# build is the manifest digest: every push writes plugin-oci-ref-<plugin>.txt
# holding <image>@<digest>, the exact value for an AgentTemplate's
# spec.plugins[].source.oci.

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/kagent/plugins.csv"
      - "deploy/kagent/ecc-plugin/Dockerfile.ecc-plugin"
      - "deploy/kagent/ecc-plugin/compose-bundle.sh"
      - "scripts/verify-plugin-images.sh"
      - ".github/workflows/build-plugin-images.yml"
  pull_request:
    paths:
      - "deploy/kagent/plugins.csv"
      - "deploy/kagent/ecc-plugin/Dockerfile.ecc-plugin"
      - "deploy/kagent/ecc-plugin/compose-bundle.sh"
      - "scripts/verify-plugin-images.sh"
      - ".github/workflows/build-plugin-images.yml"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Only build this plugin (ecc). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: plugin-images-${{ github.ref }}
  # A run publishes multi-arch tags; cancelling it mid-push can leave a
  # manifest list pointing at a partially uploaded set.
  cancel-in-progress: false

env:
  MANIFEST: deploy/kagent/plugins.csv

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select-rows.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select rows from the manifest
        id: select-rows
        env:
          ONLY_PLUGIN: ${{ github.event.inputs.plugin }}
          SELECTED: ${{ runner.temp }}/selected.txt
        run: |
          set -euo pipefail
          python3 - "$ONLY_PLUGIN" "$MANIFEST" "$SELECTED" <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, sys

          only, manifest, selected_path = sys.argv[1:4]

          with open(manifest, newline="") as fh:
              rows = [{k: (v or "").strip() for k, v in r.items()} for r in csv.DictReader(fh)]
          # An empty manifest is a mangled file, not a no-op: every row was
          # dropped. Fail rather than let it publish nothing and look green.
          if not rows:
              sys.exit(f"{manifest} has no rows")

          if only:
              if only not in {r["plugin"] for r in rows}:
                  sys.exit(f"no manifest rows for plugin {only!r}")
              rows = [r for r in rows if r["plugin"] == only]

          matrix = []
          for r in rows:
              if not r["dockerfile"]:
                  sys.exit(f"row {r['plugin']} {r['version']}: empty dockerfile")
              tags = [f"{r['image']}:{r['version']}"]
              if r["current"] == "true":
                  tags.append(f"{r['image']}:latest")
              matrix.append({
                  "plugin": r["plugin"],
                  "repo": r["repo"],
                  "commit": r["commit"],
                  "version": r["version"],
                  "image": r["image"],
                  "dockerfile": r["dockerfile"],
                  "tags": ",".join(tags),
              })

          with open(selected_path, "w") as selected:
              for row in matrix:
                  selected.write(f"{row['plugin']} {row['version']}\n")
          print("matrix=" + json.dumps(matrix))
          print("count=" + str(len(matrix)))
          PY

      - name: Preflight the manifest
        env:
          SELECTED: ${{ runner.temp }}/selected.txt
          COUNT: ${{ steps.select-rows.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$COUNT" = "0" ]; then
            echo "No plugin rows selected; skipping preflight."
            exit 0
          fi
          scripts/verify-plugin-images.sh --selected "$SELECTED"

      - name: Report the selection
        env:
          COUNT: ${{ steps.select-rows.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "### Agent plugin images"
            echo
            if [ "${COUNT:-0}" = "0" ]; then
              echo "No manifest row matched, so nothing will be published."
            else
              echo "Publishing ${COUNT} plugin image(s):"
              echo
              while read -r plugin version; do
                echo "- \`$plugin:$version\`"
              done < "$RUNNER_TEMP/selected.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.plugin }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same script the local kind build runs, so the published bytes are the
      # tested bytes. Only bundle/ enters the build context — the upstream git
      # checkout stays outside it.
      - name: Compose the plugin bundle
        env:
          ECC_REPO: ${{ matrix.repo }}
          ECC_COMMIT: ${{ matrix.commit }}
          ECC_VERSION: ${{ matrix.version }}
          PLUGIN_NAME: ${{ matrix.plugin }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          bundle="$(bash deploy/kagent/ecc-plugin/compose-bundle.sh "$RUNNER_TEMP/$PLUGIN")"
          mkdir -p "$RUNNER_TEMP/ctx-$PLUGIN"
          cp -R "$bundle" "$RUNNER_TEMP/ctx-$PLUGIN/bundle"

      - name: Build and push ${{ matrix.plugin }}:${{ matrix.version }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ctx-${{ matrix.plugin }}
          file: ${{ matrix.dockerfile }}
          # The bundle is FROM scratch data, but the worker matches the platform
          # it pulls against the node's, so publish both kinds support.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.tags }}

      # kagent wants the digest, not the tag: record the immutable ref the same
      # way build-ecc-plugin-image.sh stamps it locally into ecc-agent.yaml.
      - name: Write the immutable OCI ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "build-push-action returned no digest" >&2; exit 1; }
          ref="${IMAGE}@${DIGEST}"
          printf '%s\n' "$ref" > "$RUNNER_TEMP/plugin-oci-ref-${PLUGIN}.txt"
          {
            echo "### \`${PLUGIN}:${VERSION}\` published"
            echo
            echo '```'
            echo "$ref"
            echo '```'
            echo
            echo "Use as the AgentTemplate \`spec.plugins[].source.oci\` value."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: plugin-oci-ref-${{ matrix.plugin }}
          path: ${{ runner.temp }}/plugin-oci-ref-${{ matrix.plugin }}.txt
