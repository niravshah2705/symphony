name: Deploy www static site

# Continuous deployment for the marketing site on www.archagentix.com.
# The content lives in public/ alongside the app SPA (the www Firebase Hosting
# site serves the same tree — see docs/SEO_AEO.md), but it publishes to its OWN
# hosting site (adlc-9e72f-marketing, target "www") in the same GCP project, so
# marketing edits ship without touching the platform deploy and vice versa.
#
# Auth is keyless via Workload Identity Federation — same deployer service
# account as Deploy to GCP; see docs/GCP_CICD.md.
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/pricing/**'
      - 'public/about/**'
      - 'public/careers/**'
      - 'public/newsroom/**'
      - 'public/contact/**'
      - 'public/adlc/**'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - '.firebaserc'
      - 'firebase.json'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch: {}

# Publish one version at a time; a newer main merge supersedes a queued run.
concurrency:
  group: deploy-www
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # No SPA obfuscation here on purpose: this publishes the static
      # marketing tree; public/js/** ships as committed (the obfuscated
      # workspace copy is the one on the app site, deploy.yml).

      - name: Publish www to Firebase Hosting
        env:
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          # Public GA4 web-stream id. Empty keeps analytics disabled.
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          ADLC_TRY_NOW_URL: ${{ vars.ADLC_TRY_NOW_URL || 'https://platform.archagentix.com/' }}
          ADLC_CANONICAL_ORIGIN: ${{ vars.ADLC_CANONICAL_ORIGIN || 'https://www.archagentix.com' }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          GATEWAY_URL="https://${{ vars.GATEWAY_SERVICE_NAME || 'gateway' }}-${PROJECT_NUMBER}.${REGION}.run.app"
          if [[ -n "$GOOGLE_ANALYTICS_MEASUREMENT_ID" && ! "$GOOGLE_ANALYTICS_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "GOOGLE_ANALYTICS_MEASUREMENT_ID must be empty or a GA4 id such as G-XXXXXXXXXX." >&2
            exit 1
          fi
          # Runtime config the static pages read; identical to the app deploy so
          # both hosts serve byte-equivalent marketing content.
          printf '%s\n' \
            "window.__API_BASE__='$GATEWAY_URL';" \
            "window.__GA_MEASUREMENT_ID__='$GOOGLE_ANALYTICS_MEASUREMENT_ID';" \
            "(()=>{const link=document.createElement('link');link.rel='preconnect';link.href=window.__API_BASE__;link.crossOrigin='anonymous';document.head.appendChild(link);})();" \
            > public/config.js
          node -e "const fs=require('fs'); const cfg={tryNowUrl:process.env.ADLC_TRY_NOW_URL, canonicalOrigin:process.env.ADLC_CANONICAL_ORIGIN}; fs.writeFileSync('public/adlc/config.js', 'window.__ADLC_CONFIG__ = ' + JSON.stringify(cfg, null, 2) + ';\\n');"
          npx --yes firebase-tools@15 deploy --only hosting:www \
            --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
