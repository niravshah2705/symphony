name: Deploy www static site

# Continuous deployment for the marketing site on www.archagentix.com.
# www serves the ADLC content at the DOMAIN ROOT ("/" is the landing page, with
# "/blog/" and "/brief/" promoted out of "/adlc/"), so this job first builds the
# marketing/ tree from public/ (scripts/build-marketing-site.js) and publishes it
# to its OWN hosting site (adlc-9e72f-marketing, target "www") in the same GCP
# project. Marketing edits ship without touching the platform deploy and vice
# versa; the app site keeps serving the same pages under /adlc/ and each old
# /adlc/** url on www is rewritten (200, no redirect hop) onto its promoted file
# in firebase.json. See docs/SEO_AEO.md.
#
# Auth is keyless via Workload Identity Federation — same deployer service
# account as Deploy to GCP; see docs/GCP_CICD.md.
on:
  push:
    branches: [main]
    paths:
      - 'public/pricing/**'
      - 'public/about/**'
      - 'public/careers/**'
      - 'public/newsroom/**'
      - 'public/contact/**'
      - 'public/adlc/**'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'scripts/build-marketing-site.js'
      - '.firebaserc'
      - 'firebase.json'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch: {}

# Publish one version at a time; a newer main merge supersedes a queued run.
concurrency:
  group: deploy-www
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # No SPA obfuscation here on purpose: this publishes the static
      # marketing tree; public/js/** ships as committed (the obfuscated
      # workspace copy is the one on the app site, deploy.yml).

      # The ADLC pages read window.__ADLC_CONFIG__ from the root config.js of the
      # marketing tree; regenerated per release from repo variables, then promoted
      # by the build step below. The SPA runtime config (public/config.js with the
      # gateway origin) belongs to the app site, so this job no longer writes it.
      - name: Generate the ADLC runtime config
        env:
          ADLC_TRY_NOW_URL: ${{ vars.ADLC_TRY_NOW_URL || 'https://platform.archagentix.com/' }}
          ADLC_CANONICAL_ORIGIN: ${{ vars.ADLC_CANONICAL_ORIGIN || 'https://www.archagentix.com' }}
        run: |
          node -e "const fs=require('fs'); const cfg={tryNowUrl:process.env.ADLC_TRY_NOW_URL, canonicalOrigin:process.env.ADLC_CANONICAL_ORIGIN}; fs.writeFileSync('public/adlc/config.js', 'window.__ADLC_CONFIG__ = ' + JSON.stringify(cfg, null, 2) + ';\\n');"

      # marketing/ is a build artifact: it promotes public/adlc/** to the site root,
      # copies the company pages, and rewrites the sitemap for the new url scheme.
      - name: Build the marketing tree
        run: node scripts/build-marketing-site.js

      - name: Publish www to Firebase Hosting
        run: |
          npx --yes firebase-tools@15 deploy --only hosting:www \
            --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
