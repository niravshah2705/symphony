[project]
name = "ai-fleet"
version = "1.0.0"
description = "AI Fleet — Python backend. Microservice-decomposed tool to manage Linear projects and run isolated planner + coder deep-agent services (deepagent / Claude Agent SDK / Codex SDK runtimes) over a shared library. Browser SPA in public/ stays JS."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web framework (replaces Express in the three services)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # HTTP client (replaces global fetch for Linear, provider APIs, forge REST, proxy)
    "httpx>=0.27",
    # Validation / structured output (replaces zod)
    "pydantic>=2.7",
    # Deep-agent runtime + LangChain stack (replaces deepagents/langchain/langgraph JS)
    "deepagents>=0.7",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langsmith>=0.10",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    # Provider SDKs
    "anthropic>=0.40",
    "openai>=1.40",
    # Official agent SDK runtimes (replace @anthropic-ai/claude-agent-sdk and @openai/codex-sdk)
    "claude-agent-sdk>=0.2",
    "openai-codex>=0.140",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
ai-fleet-gateway = "ai_fleet.services.gateway.app:main"
ai-fleet-planner = "ai_fleet.services.planner.app:main"
ai-fleet-coder = "ai_fleet.services.coder.app:main"
ai-fleet = "ai_fleet.start_all:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_fleet*"]

[tool.setuptools.package-data]
ai_fleet = ["agent/*.json", "agent/skills/**/*.md", "agent/tools/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
