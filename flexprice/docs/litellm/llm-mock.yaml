apiVersion: v1
kind: Pod
metadata:
  name: llm-mock
  namespace: litellm
  labels: {app: llm-mock}
spec:
  containers:
    - name: mock
      image: python:3.12-slim
      command: ["python", "server.py"]
      workingDir: /srv
      volumeMounts: [{name: srv, mountPath: /srv}]
  volumes:
    - name: srv
      configMap:
        name: llm-mock-srv
---
apiVersion: v1
kind: ConfigMap
metadata: {name: llm-mock-srv, namespace: litellm}
data:
  server.py: |
    import json, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(n) or b"{}")
            resp = {
                "id": "chatcmpl-" + uuid.uuid4().hex,
                "object": "chat.completion",
                "model": body.get("model", "mock-gpt"),
                "choices": [{"index": 0, "message": {"role": "assistant", "content": "mock reply"}, "finish_reason": "stop"}],
                "usage": {"prompt_tokens": 120, "completion_tokens": 45, "total_tokens": 165},
            }
            data = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)
        def log_message(self, *a):
            pass
    HTTPServer(("0.0.0.0", 8000), H).serve_forever()
---
apiVersion: v1
kind: Service
metadata: {name: llm-mock, namespace: litellm}
spec:
  selector: {app: llm-mock}
  ports: [{port: 8000, targetPort: 8000}]
