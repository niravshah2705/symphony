# Local emulation of the agent Cloud Run multi-container (sidecar) model plus
# the standalone stream-token broker used by the gateway.
#
# Google Cloud Run multi-container instances share the loopback network
# namespace between containers. Docker Compose reproduces that exactly with
# `network_mode: "service:proxy"`: the agent containers reach the proxy at
# 127.0.0.1:4030, just like in the cloud. The agent containers hold NO raw
# provider credentials — only the proxy does — and route all egress through it.
#
# Usage:
#   cp .env.example .env         # fill in the proxy's real secrets locally
#   docker compose up --build
#
# Verify the isolation holds:
#   docker compose exec planner env | grep -iE 'TOKEN|KEY|SECRET'   # -> nothing
#
# Provider credentials live in the organization vault exposed by SETTINGS_URL.
# The stream secret is supplied only to the dedicated broker process.

services:
  # -------- egress proxy sidecar (holds the credentials) --------------------
  proxy:
    build:
      context: .
      dockerfile: deploy/gcp/Dockerfile.proxy
    environment:
      PROXY_PORT: "4030"
      PROXY_CAPABILITIES: "egress"
      AUTH_MODE: "disabled"
      PROXY_ORG_ID: "${PROXY_ORG_ID:?set an organization id}"
      SETTINGS_URL: "${SETTINGS_URL:?set the settings service URL}"
      ORG_INTERNAL_API_TOKEN: "${ORG_INTERNAL_API_TOKEN:?set the org-scoped settings token}"
      OMLX_PROXY_UPSTREAM: "${OMLX_PROXY_UPSTREAM:-}"
      OLLAMA_PROXY_UPSTREAM: "${OLLAMA_PROXY_UPSTREAM:-}"
      LMSTUDIO_PROXY_UPSTREAM: "${LMSTUDIO_PROXY_UPSTREAM:-}"
      OPENSWE_PROXY_UPSTREAM: "${OPENSWE_PROXY_UPSTREAM:-}"
    healthcheck:
      # node:alpine has no curl; use a tiny inline Node probe.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4030/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5

  # -------- standalone stream-token broker (only HMAC-secret holder) -------
  stream-token-broker:
    build:
      context: .
      dockerfile: deploy/gcp/Dockerfile.proxy
    command: ["node", "services/proxy/src/stream-token-server.js"]
    environment:
      PORT: "4031"
      STREAM_TOKEN_SECRET: "${STREAM_TOKEN_SECRET:?set the local stream-token secret}"
    # The gateway joins this service's local network namespace so its client
    # can keep the production rule that plaintext HTTP is loopback-only.
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4031/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5

  # -------- planner agent runtime (NO raw secrets) --------------------------
  planner:
    build:
      context: .
      dockerfile: deploy/gcp/Dockerfile.planner
    # Share the proxy's network namespace so 127.0.0.1:4030 reaches the sidecar
    # (the Compose analogue of Cloud Run's shared loopback).
    network_mode: "service:proxy"
    environment:
      PLANNER_PORT: "8080"
      EGRESS_PROXY_URL: "http://127.0.0.1:4030"
      # NOTE: deliberately NO provider secrets here — the proxy injects them.
    depends_on:
      proxy:
        condition: service_healthy

  # -------- coder agent runtime (NO raw secrets) ----------------------------
  coder:
    build:
      context: .
      dockerfile: deploy/gcp/Dockerfile.coder
    network_mode: "service:proxy"
    environment:
      CODER_SERVICE_PORT: "8081"
      CODER_ROLE: "control"
      EGRESS_PROXY_URL: "http://127.0.0.1:4030"
    depends_on:
      proxy:
        condition: service_healthy

  # -------- public gateway + standalone stream-token broker ----------------
  gateway:
    build:
      context: .
      dockerfile: deploy/gcp/Dockerfile.gateway
    network_mode: "service:stream-token-broker"
    environment:
      PORT: "4000"
      AUTH_MODE: "disabled"
      PLANNER_URL: "http://proxy:8080"
      CODER_URL: "http://proxy:8081"
      STREAM_TOKEN_SERVICE_URL: "http://127.0.0.1:4031"
    depends_on:
      stream-token-broker:
        condition: service_healthy
      planner:
        condition: service_started
      coder:
        condition: service_started
