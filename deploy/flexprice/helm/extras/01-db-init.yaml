# The `temporal` database, created before Temporal starts.
#
# Why this exists at all: Temporal's own database is created by
# migrations/postgres/init-temporal-db.sh in the compose stack, mounted into
# Postgres' docker-entrypoint-initdb.d — a mechanism that only the official image's
# ENTRYPOINT has. The chart's hand-rolled Postgres (templates/infra/postgres.yaml)
# mounts nothing, and its `postgres.internal.initScripts.enabled` value is read by
# no template: it is a stale key. So nothing in the chart creates this database, and
# temporalio/auto-setup — which creates SCHEMAS but not the DATABASE — fails with
# "database does not exist" and CrashLoops.
#
# Applied by scripts/flexprice-helm.js between the infra phase and Temporal, and
# deleted/re-applied on every run (a finished Job's pod template is immutable, so
# `kubectl apply` over a changed one is refused).
#
# Image tag mirrors postgres.internal.image in deploy/flexprice/helm/values-kind.yaml
# on purpose: same client as the server it talks to, and no extra image to pull.
apiVersion: batch/v1
kind: Job
metadata:
  name: flexprice-db-init
  namespace: flexprice
  labels:
    app.kubernetes.io/name: flexprice-db-init
    app.kubernetes.io/part-of: flexprice
    fleet.dev/component: billing
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexprice-db-init
        app.kubernetes.io/part-of: flexprice
    spec:
      restartPolicy: Never
      securityContext:
        # Only psql runs here, against a TCP host: no PGDATA, no writes. The chart's
        # pod defaults (uid 1000, read-only rootfs) are therefore honoured rather
        # than relaxed.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-init
          image: postgres:15.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for postgres at $PGHOST:$PGPORT"
                sleep 2
              done
              # CREATE DATABASE has no IF NOT EXISTS and cannot run inside a
              # transaction, so the existence probe is the guard and the whole Job
              # stays replayable.
              if [ "$(psql -Atc "SELECT 1 FROM pg_database WHERE datname='temporal'")" = "1" ]; then
                echo "database temporal already exists"
              else
                createdb --host="$PGHOST" --username="$PGUSER" temporal
                echo "created database temporal"
              fi
              # auto-setup connects as PGUSER and must own its schema; the cluster
              # role here is a superuser (initdb ran with POSTGRES_USER=flexprice),
              # so the grant the compose script gives is already implied — assert it
              # anyway, because a non-superuser Postgres elsewhere would need it.
              psql -Atc 'GRANT ALL PRIVILEGES ON DATABASE temporal TO flexprice' >/dev/null
              echo "db-init complete"
          env:
            - name: PGHOST
              value: flexprice-postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: flexprice
            - name: PGDATABASE
              value: flexprice
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: flexprice-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
