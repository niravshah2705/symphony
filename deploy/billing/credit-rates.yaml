# -----------------------------------------------------------------------------
# AI Fleet rate card — what a token costs, and what a credit package is.
# -----------------------------------------------------------------------------
# This file is the ONE author of a rupee-per-token price. Loaded at boot by
# packages/shared-core/src/billing/credit-rates.js and memoised once per process,
# so a rate change is a REDEPLOY, not an edit that takes effect mid-traffic. That
# is deliberate: a debit and its invoice must be computable from the same numbers
# after the fact, which a hot-reloaded card makes impossible.
#
# MONEY IS A STRING HERE. Every `*_inr_per_mtok` and `fx.usd_to_inr` is a quoted
# decimal, and the loader refuses a bare YAML number instead of coercing it — the
# same rule the money path follows everywhere (money-wire.js explains why
# `parseFloat` and `* 100` are not a conversion). Counts (`credits`,
# `bonus_valid_days`) are integers, never money, so they are unquoted.
#
# Units (D6): 1 credit = ₹1 = 100 token credits. A price is stated in RUPEES per
# 1,000,000 tokens; the ledger holds integer token credits.

schema_version: 1

# FX is NOT on the cost path. It stamps events (`fx_rate_to_inr`, `inr_cost`) and
# converts LiteLLM's USD spend for the reconciler, and that is all: a debit comes
# from the `models` rows below, so no run's charge can change because a currency
# rate moved overnight. Keep `as_of` honest — the reconciler widens its tolerance
# band by `drift_bps_per_day` for age and reports `fx_stale` past `stale_after_days`.
fx:
  usd_to_inr: "87.00"
  as_of: "2026-11-01"
  stale_after_days: 45
  drift_bps_per_day: 15

# How far the reconciler may drift before it is a finding. `base` is what a fresh
# window is held to; `max` caps the band however old the window is. The band applies
# ONLY to rows with no per-event rate (history) or no provider-reported cost: our
# number against FlexPrice's own number is held to zero.
reconcile:
  base_tolerance_bps: 100
  max_tolerance_bps: 1000

limits:
  max_package_price_inr: 1000000
  # A package may grant at most this much bonus. 1000% covers ₹4000 → 10,000 credits
  # (15000 bps) with room for a launch offer; the loader also asserts the bonus
  # arithmetic stays inside a safe integer at this cap.
  max_bonus_bps: 100000

# One row per `model_name` in deploy/litellm/config.yaml — LiteLLM matches an inbound
# `model` against `model_name` verbatim, and deploy/billing/credit-rates.test.js fails
# in BOTH directions so a new gateway model cannot ship unpriced and a retired model
# cannot linger here as a stale price. Rates are the provider list price in USD/1M
# multiplied by this card's FX (claude 3/15, gpt 2.5/10), i.e. the numbers the old
# provider-level table produced, so moving to the card changes no existing charge.
models:
  claude-opus-4-8:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"
  claude-sonnet-5:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"
  claude-haiku-4-5-20251001:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"
  claude-fable-5:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"
  gpt-5.6-sol:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  gpt-5.6-terra:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  gpt-5.6-luna:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  gpt-5.5:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  gpt-5.4:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  gpt-5.4-mini:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"

# Provider fallback, used only when the model itself has no row (`priceFor` reports
# `match: 'Provider'`). Local/self-hosted providers genuinely cost nothing per call
# and are still metered, so the token volume shows on the cost page at zero spend.
providers:
  claude:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"
  codex:
    input_inr_per_mtok: "217.5"
    output_inr_per_mtok: "870"
  antigravity:
    input_inr_per_mtok: "108.75"
    output_inr_per_mtok: "435"
  ollama:
    input_inr_per_mtok: "0"
    output_inr_per_mtok: "0"
  lmstudio:
    input_inr_per_mtok: "0"
    output_inr_per_mtok: "0"
  omlx:
    input_inr_per_mtok: "0"
    output_inr_per_mtok: "0"
  huggingface:
    input_inr_per_mtok: "0"
    output_inr_per_mtok: "0"

# Last resort, and LOUD when used: `priceFor` reports `match: 'Default'` and the
# caller warns, because this row is the money version of an unmodeled gateway key —
# a plausible, wrong, otherwise invisible number. The values mirror the most
# expensive priced family on purpose: an unmetered run is worse than an over-estimate
# the operator corrects within a day.
defaults:
  model:
    input_inr_per_mtok: "261"
    output_inr_per_mtok: "1305"

# What a customer can buy. The rupee amount is the taxable subtotal Cashfree
# collects GST on; `credits` is what lands in the wallet, prepaid plus bonus. The
# bonus is a separate expiring promotional wallet, never a discount, so the taxable
# value stays the full rupee amount (gst.quote). `bonus_valid_days` starts at order
# settlement, not at listing.
#
# Retiring a package is `enabled: false` — which refuses a NEW order and still settles
# one that was already paid. `settle()` never reads this file, so an edit here cannot
# strand money that has already left a customer's card.
packages:
  - id: credits-3500
    price_inr: "2000"
    credits: 3500
    bonus_valid_days: 30
    enabled: true
  - id: credits-10000
    price_inr: "4000"
    credits: 10000
    bonus_valid_days: 45
    enabled: true
