# =============================================================================
# Cloud Build — build + push the shared service images, publish the SPA to GCS,
# and apply the Terraform stack.
# =============================================================================
# Bootstrapping note: Terraform OWNS the Artifact Registry repo, but images must
# exist before the full apply (else Cloud Run revisions fail to pull). So we run
# a TARGETED apply first (APIs + Artifact Registry only), then build/push, then
# the full apply. Terraform stays the single source of truth — nothing is
# created out-of-band.
#
# REQUIRED substitutions (pass via the trigger or --substitutions):
#   _BUCKET            globally-unique GCS bucket name for the SPA
#   _TF_STATE_BUCKET   existing GCS bucket for Terraform remote state
# Recommended per-build:
#   _IMAGE_TAG=$SHORT_SHA   (immutable image tag; defaults to "latest")
#
# The Cloud Build service account needs: Cloud Run admin, Artifact Registry
# writer, Pub/Sub admin, Cloud Scheduler admin, Firestore/Datastore admin,
# Secret Manager admin, Service Account admin + user, Storage admin, and Service
# Usage admin (to enable APIs) — or run this pipeline as a dedicated deployer SA.

substitutions:
  _REGION: "asia-south1"
  _REPO: "ai-fleet"
  _BUCKET: "REPLACE_ME_spa_bucket" # REQUIRED — override
  _IMAGE_TAG: "latest"             # override with $SHORT_SHA per build
  _GATEWAY_SERVICE: "gateway"
  _TF_DIR: "deploy/gcp/terraform"
  _TF_STATE_BUCKET: "REPLACE_ME_tf_state_bucket" # REQUIRED — override
  _TF_STATE_PREFIX: "ai-fleet/gcp"
  _FIRESTORE_LOCATION: "nam5"
  _FIREBASE_ALLOWED_DOMAIN: "" # empty = any verified user
  _SPA_ORIGIN: "https://storage.googleapis.com"
  _SPA_OBFUSCATION_STRENGTH: "light" # light | balanced | maximum
  _EMAIL_SMTP_HOST: ""
  _EMAIL_SMTP_PORT: "587"
  _EMAIL_SMTP_SECURE: "false"
  _EMAIL_SMTP_REQUIRE_TLS: "true"
  _EMAIL_FROM: ""
  _PIPELINE_ORCHESTRATOR_ENABLED: "false"
  _PIPELINE_DEPLOYMENT_ENABLED: "false"
  _SETTINGS_OPERATOR_INVOKER: ""
  # Empty derives the URL of the GCS object published by this pipeline.
  # Set an explicit HTTPS URL when a custom domain/CDN fronts the SPA.
  _EMAIL_PUBLIC_APP_URL: ""

steps:
  # --- Build the three images (parallel) -------------------------------------
  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.gateway
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_IMAGE_TAG}
      - .

  - id: build-planner
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.planner
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/planner:${_IMAGE_TAG}
      - .

  - id: build-coder
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.coder
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/coder-control:${_IMAGE_TAG}
      - .

  - id: build-orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.orchestrator
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-orchestrator:${_IMAGE_TAG}
      - .

  - id: build-tester
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.tester
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-tester:${_IMAGE_TAG}
      - .

  - id: build-deployer
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.deployer
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-deployer:${_IMAGE_TAG}
      - .

  - id: build-proxy
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.proxy
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/proxy:${_IMAGE_TAG}
      - .

  - id: build-email
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.email
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/email-service:${_IMAGE_TAG}
      - .

  - id: build-org
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - services/org/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/org-service:${_IMAGE_TAG}
      - services/org

  - id: build-settings
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - services/settings/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/settings-service:${_IMAGE_TAG}
      - .

  # Built for parity so enabling per-tenant provisioning is a one-var flip; the
  # provisioner service itself is only created by terraform when provisioning_enabled.
  - id: build-provisioner
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.provisioner
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/provisioner:${_IMAGE_TAG}
      - .

  # --- Terraform: bootstrap (APIs, registry, SPA bucket, secret containers) --
  - id: tf-bootstrap
    name: hashicorp/terraform:1.9
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        cd "${_TF_DIR}"
        terraform init -input=false \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"
        terraform apply -input=false -auto-approve \
          -target=google_project_service.services \
          -target=google_artifact_registry_repository.docker \
          -target=google_secret_manager_secret.email_smtp_user \
          -target=google_secret_manager_secret.email_smtp_password \
          -target=google_storage_bucket.spa \
          -target=google_storage_bucket_iam_member.spa_public_read \
          -var="project_id=$PROJECT_ID" \
          -var="region=${_REGION}" \
          -var="artifact_repo=${_REPO}" \
          -var="spa_bucket_name=${_BUCKET}" \
          -var="email_public_app_url=https://storage.googleapis.com/${_BUCKET}/index.html"

  # Do not read SMTP values into Cloud Build or Terraform. Secret versions are
  # operational data, seeded after the first bootstrap (or by bootstrap.sh).
  # Only the non-secret, all-or-nothing mount decision crosses step boundaries.
  - id: email-secret-state
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [tf-bootstrap]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        enabled_version() {
          gcloud secrets versions list "$$1" \
            --project "$PROJECT_ID" \
            --filter='state=ENABLED' \
            --limit=1 \
            --format='value(name)'
        }

        USER_VERSION="$$(enabled_version email-smtp-user)"
        PASSWORD_VERSION="$$(enabled_version email-smtp-password)"
        USER_READY=false
        PASSWORD_READY=false
        [ -n "$$USER_VERSION" ] && USER_READY=true
        [ -n "$$PASSWORD_VERSION" ] && PASSWORD_READY=true

        if [ "$$USER_READY" != "$$PASSWORD_READY" ]; then
          echo "ERROR: email-smtp-user and email-smtp-password must both have an enabled version (or neither may)." >&2
          exit 1
        fi

        printf 'email_smtp_auth_enabled = %s\n' "$$USER_READY" > /workspace/email-auth.auto.tfvars
        echo "SMTP auth secret pair ready: $$USER_READY (values were not accessed)"

  # Keep the shared internal S2S token stable without putting it in a Cloud
  # Build substitution or log. On first pipeline enable, generate it in the
  # ephemeral workspace and let Terraform create the secret/version. On later
  # runs, reuse the enabled version so Terraform never rotates or destroys it.
  - id: pipeline-secret-state
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    # Do not create the ephemeral plaintext tfvars until every Docker build/push
    # has finished; otherwise it could enter the root Docker build context.
    waitFor: [push-gateway, push-planner, push-coder, push-orchestrator, push-tester, push-deployer, push-proxy, push-email, push-org, push-settings, push-provisioner, spa-publish, email-secret-state]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        umask 077
        TOKEN=""
        VERSION="$$(gcloud secrets versions list internal-api-token \
          --project "$PROJECT_ID" --filter='state=ENABLED' --limit=1 \
          --format='value(name)' 2>/dev/null || true)"
        if [ -n "$$VERSION" ]; then
          TOKEN="$$(gcloud secrets versions access "$$VERSION" \
            --secret=internal-api-token --project "$PROJECT_ID")"
        elif [ "${_PIPELINE_ORCHESTRATOR_ENABLED}" = "true" ]; then
          TOKEN="$$(dd if=/dev/urandom bs=48 count=1 2>/dev/null | base64 | tr -d '\n')"
        fi
        printf '{"internal_api_token":"%s"}\n' "$$TOKEN" > /workspace/pipeline-secret.auto.tfvars.json
        echo "Internal S2S token ready: $$([ -n "$$TOKEN" ] && echo true || echo false) (value was not printed)"

  # --- Push images (after their build AND after the AR repo exists) ----------
  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: [build-gateway, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_IMAGE_TAG}"]

  - id: push-planner
    name: gcr.io/cloud-builders/docker
    waitFor: [build-planner, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/planner:${_IMAGE_TAG}"]

  - id: push-coder
    name: gcr.io/cloud-builders/docker
    waitFor: [build-coder, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/coder-control:${_IMAGE_TAG}"]

  - id: push-orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: [build-orchestrator, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-orchestrator:${_IMAGE_TAG}"]

  - id: push-tester
    name: gcr.io/cloud-builders/docker
    waitFor: [build-tester, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-tester:${_IMAGE_TAG}"]

  - id: push-deployer
    name: gcr.io/cloud-builders/docker
    waitFor: [build-deployer, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/pipeline-deployer:${_IMAGE_TAG}"]

  - id: push-proxy
    name: gcr.io/cloud-builders/docker
    waitFor: [build-proxy, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/proxy:${_IMAGE_TAG}"]

  - id: push-email
    name: gcr.io/cloud-builders/docker
    waitFor: [build-email, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/email-service:${_IMAGE_TAG}"]

  - id: push-org
    name: gcr.io/cloud-builders/docker
    waitFor: [build-org, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/org-service:${_IMAGE_TAG}"]

  - id: push-settings
    name: gcr.io/cloud-builders/docker
    waitFor: [build-settings, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/settings-service:${_IMAGE_TAG}"]

  - id: push-provisioner
    name: gcr.io/cloud-builders/docker
    waitFor: [build-provisioner, tf-bootstrap]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/provisioner:${_IMAGE_TAG}"]

  # --- Obfuscate the SPA's client JS before it is published ------------------
  # Rewrites public/js/** in /workspace (shared across steps) so spa-publish
  # rsyncs the obfuscated site. config.js is regenerated in spa-publish and
  # vendor/ is left untouched. Keep the pinned version in sync with
  # package.json's devDependency. See scripts/obfuscate-spa.js.
  - id: spa-obfuscate
    name: node:22-slim
    waitFor: ["-"]
    entrypoint: bash
    env:
      - "SPA_OBFUSCATION_STRENGTH=${_SPA_OBFUSCATION_STRENGTH}"
    args:
      - -c
      - |
        set -euo pipefail
        npm install --no-save --no-audit --no-fund --prefix /workspace/.obf-deps javascript-obfuscator@4.2.2
        NODE_PATH=/workspace/.obf-deps/node_modules node scripts/obfuscate-spa.js --in-place

  # --- Publish the SPA to GCS ------------------------------------------------
  # Generate public/config.js with the gateway's deterministic URL (window.__API_BASE__
  # is read by the SPA at runtime), then rsync the static site to the bucket.
  - id: spa-publish
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [tf-bootstrap, spa-obfuscate]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT_NUMBER="$$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
        GATEWAY_URL="https://${_GATEWAY_SERVICE}-$${PROJECT_NUMBER}.${_REGION}.run.app"
        echo "Gateway URL: $${GATEWAY_URL}"
        # Match the Firebase deploy path: api.js imports this runtime module,
        # which exposes the API base and warms its origin before client calls.
        printf '%s\n' \
          "window.__API_BASE__='$${GATEWAY_URL}';" \
          "(()=>{const link=document.createElement('link');link.rel='preconnect';link.href=window.__API_BASE__;link.crossOrigin='anonymous';document.head.appendChild(link);})();" \
          > public/config.js
        # Persist for the Terraform step so API_BASE_URL matches config.js exactly.
        printf "%s" "$${GATEWAY_URL}" > /workspace/gateway_url.txt
        gsutil -m rsync -r -d public "gs://${_BUCKET}"
        # Mirror Firebase Hosting's cache policy on the legacy GCS endpoint.
        # The root website route serves index.html, so its object metadata covers
        # both `/` and `/index.html`.
        gsutil -m setmeta -h "Cache-Control:no-cache" \
          "gs://${_BUCKET}/js/**" \
          "gs://${_BUCKET}/vendor/**/*.js" \
          "gs://${_BUCKET}/styles.css" \
          "gs://${_BUCKET}/styles/**/*.css" \
          "gs://${_BUCKET}/**/*.txt" \
          "gs://${_BUCKET}/**/*.xml"
        gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
          "gs://${_BUCKET}/index.html"
        gsutil setmeta -h "Cache-Control:no-store" "gs://${_BUCKET}/config.js"
        # Ensure ES module content-type for .mjs assets.
        gsutil -m setmeta -h "Content-Type:text/javascript" "gs://${_BUCKET}/**/*.mjs" || true

  # --- Terraform: full apply (services, job, pubsub, scheduler, secrets, …) --
  - id: tf-apply
    name: hashicorp/terraform:1.9
    waitFor: [push-gateway, push-planner, push-coder, push-orchestrator, push-tester, push-deployer, push-proxy, push-email, push-org, push-settings, push-provisioner, spa-publish, email-secret-state, pipeline-secret-state]
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        trap 'rm -f /workspace/pipeline-secret.auto.tfvars.json' EXIT
        cd "${_TF_DIR}"
        terraform init -input=false \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"
        API_BASE_URL="$$(cat /workspace/gateway_url.txt)"
        EMAIL_PUBLIC_APP_URL="${_EMAIL_PUBLIC_APP_URL}"
        if [ -z "$${EMAIL_PUBLIC_APP_URL}" ]; then
          EMAIL_PUBLIC_APP_URL="https://storage.googleapis.com/${_BUCKET}/index.html"
        fi
        terraform apply -input=false -auto-approve \
          -var-file=/workspace/email-auth.auto.tfvars \
          -var-file=/workspace/pipeline-secret.auto.tfvars.json \
          -var="project_id=$PROJECT_ID" \
          -var="region=${_REGION}" \
          -var="artifact_repo=${_REPO}" \
          -var="image_tag=${_IMAGE_TAG}" \
          -var="orchestrator_image_tag=${_IMAGE_TAG}" \
          -var="tester_image_tag=${_IMAGE_TAG}" \
          -var="deployer_image_tag=${_IMAGE_TAG}" \
          -var="proxy_image_tag=${_IMAGE_TAG}" \
          -var="spa_bucket_name=${_BUCKET}" \
          -var="firestore_location=${_FIRESTORE_LOCATION}" \
          -var="spa_origin=${_SPA_ORIGIN}" \
          -var="api_base_url=$${API_BASE_URL}" \
          -var="firebase_allowed_domain=${_FIREBASE_ALLOWED_DOMAIN}" \
          -var="egress_proxy_enabled=${_PIPELINE_ORCHESTRATOR_ENABLED}" \
          -var="pipeline_orchestrator_enabled=${_PIPELINE_ORCHESTRATOR_ENABLED}" \
          -var="pipeline_deployment_enabled=${_PIPELINE_DEPLOYMENT_ENABLED}" \
          -var="settings_operator_invoker=${_SETTINGS_OPERATOR_INVOKER}" \
          -var="email_smtp_host=${_EMAIL_SMTP_HOST}" \
          -var="email_smtp_port=${_EMAIL_SMTP_PORT}" \
          -var="email_smtp_secure=${_EMAIL_SMTP_SECURE}" \
          -var="email_smtp_require_tls=${_EMAIL_SMTP_REQUIRE_TLS}" \
          -var="email_from=${_EMAIL_FROM}" \
          -var="email_public_app_url=$${EMAIL_PUBLIC_APP_URL}"

# Longer timeout: parallel service builds + two terraform applies.
timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
