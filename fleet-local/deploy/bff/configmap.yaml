# Non-secret BFF configuration. In-cluster service DNS defaults already live in
# src/config.ts; only values that differ or identify seeded resources are set here.
# Credentials live in Secret/fleet-bff-env (created by scripts/50-bff-spa.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-bff-config
  namespace: fleet-system
data:
  SPA_ROOT: /app/apps/spa/dist
  TENANT_CHART_PATH: /app/deploy/charts/kagent-tenant
  LANGFUSE_PUBLIC_KEY: pk-lf-fleet-local
  FLEXPRICE_ENVIRONMENT_ID: "00000000-0000-0000-0000-000000000000"
  # PLACEHOLDER — scripts/seed-flexprice.sh patches the real plan ID after the
  # seed (each fresh Flexprice DB mints a new one) and restarts the BFF.
  FLEXPRICE_PLAN_ID: plan_01M7T6D75Z1STVQ8JXMY5SP3Z0
  DEFAULT_ORG_BUDGET_USD: "50"
  DEFAULT_PROJECT_BUDGET_USD: "20"
  DEFAULT_BUDGET_DURATION: 30d
  SWEEPER_INTERVAL_SECONDS: "60"
  # P6 chat model catalog (id = k8s name fragment + sessions.model; model = the
  # LiteLLM model name the tenant ModelConfig calls). First default:true entry
  # is the wizard's attached agent. openrouter/* ids rely on the passthrough
  # model in litellm values-base + the wildcard in team/key model lists.
  # The qoder row is experimental:true: its agent is rendered but not waited on
  # during onboarding and is hidden from the chat picker until the BYO canary
  # passes (fleet-local/scripts/fixes/t32-qoder-harness.sh).
  FLEET_MODELS: >-
    [{"id":"mock","label":"Mock GPT (offline)","model":"mock-gpt","default":true},
     {"id":"claude","label":"Claude Sonnet 4","model":"claude-sonnet-4"},
     {"id":"nemotron","label":"Nemotron 3 Ultra 550B (free)",
      "model":"openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"},
     {"id":"nemotron-claude","label":"Nemotron 550B (Claude Code runtime)",
      "model":"openrouter/nvidia/nemotron-3-ultra-550b-a55b:free","runtime":"claude"},
     {"id":"nemotron-codex","label":"Nemotron 550B (Codex runtime)",
      "model":"openrouter/nvidia/nemotron-3-ultra-550b-a55b:free","runtime":"codex"},
     {"id":"qoder","label":"Qwen3.8 Flash (Qoder runtime)",
      "model":"openrouter/qwen/qwen3.8-flash","runtime":"qoder","experimental":true}]
  # Qoder BYO harness image. Empty = no qoder objects are rendered for anyone.
  # It MUST be a @sha256 digest: the Harness CRD pattern rejects a tag, and
  # config.ts refuses to boot on one. Set it to the digest that
  # .github/workflows/build-runtime-images.yml publishes for
  # ghcr.io/niravshah2705/symphony/qoder-runtime AFTER the ADK-boot fix
  # (go/harness/qoder/config.Load) has landed — the pre-fix build cannot start
  # under a BYO bundle. Then re-run scripts/fixes/t32-qoder-harness.sh.
  QODER_RUNTIME_IMAGE: ""
  # The image ENTRYPOINT, and the env name the tenant Secret carries the
  # LiteLLM virtual key under for the qoder BYOK provider.
  QODER_ADAPTER_COMMAND: /usr/local/bin/qoder-runtime
  QODER_API_KEY_ENV: QODER_API_KEY
  # ---------------------------------------------------------------- bundle builds
  # The owner-facing wizard that renders a plugin selection into a Dockerfile,
  # builds it in Cloud Build, and points a tenant Harness at the result. Off by
  # default because turning it on means this pod holds a service account that can
  # spend Cloud Build seconds and write an Artifact Registry repo. Flip it only
  # after the API + repo + bucket + SA grants in docs/SETUP-ENVIRONMENT.md step 12
  # exist; with the flag on, config.ts refuses to boot if a required name is empty.
  BUNDLE_ENABLED: "false"
  # The GCP project that runs the builds and hosts the repo. GCP_SA_KEY_PATH is an
  # env name so a non-standard mount can be named; the key itself is a Secret VOLUME
  # (deploy/bff/deployment.yaml), never an env var — a value here would print in
  # `kubectl get pod -o yaml`.
  GCP_PROJECT_ID: ""
  GCP_REGION: ""
  # The Artifact Registry docker repo that receives `<project>/<repo>/<runtime>-bundle`.
  BUNDLE_REPO: fleet-bundles
  BUNDLE_STAGE_BUCKET: ""
  GCP_SA_KEY_PATH: /run/secrets/gcp/sa.json
  # ar = the Harness names the <region>-docker.pkg.dev ref, which requires the repo
  # to be anonymously readable (allUsers / roles/artifactregistry.reader) because a
  # kind node has no GCP identity. kind = the Harness names BUNDLE_PULL_HOST and the
  # image is mirrored there by hand with scripts/bundle-mirror.sh.
  BUNDLE_REGISTRY: ar
  # Required only in kind mode: the registry address the CLUSTER NODES can reach
  # (e.g. kind-registry:5000), which is not necessarily what the docker host calls it.
  BUNDLE_PULL_HOST: ""
  # A bundle build is a full runtime image plus installs; the step waits this long
  # before failing `poll` (20 minutes).
  BUNDLE_BUILD_TIMEOUT_MS: "1200000"