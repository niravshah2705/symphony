# The control-plane BFF: serves the built SPA (SPA_ROOT) + the API, runs the
# onboarding machine (helm/kubectl bundled in the image), proxies kagent A2A SSE,
# and meters actor compute. Credentials arrive via Secret/fleet-bff-env; non-secret
# config via ConfigMap/fleet-bff-config; the Google client id via Secret/google-oauth;
# the bundle builder's GCP key via Secret/fleet-bff-gcp mounted at /run/secrets/gcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-bff
  namespace: fleet-system
  labels:
    app: fleet-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-bff
  template:
    metadata:
      labels:
        app: fleet-bff
    spec:
      serviceAccountName: fleet-bff
      containers:
        - name: bff
          image: fleet-bff:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: fleet-bff-config
            - secretRef:
                name: fleet-bff-env
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: client-id
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # The bundle builder's GCP service account, mounted as a file. Optional
            # so the pod still boots while BUNDLE_ENABLED is "false"; a bundle route
            # that needs it fails with a named error instead. Never an envFrom entry:
            # fleet-bff-env is injected wholesale, and a key in `env` prints in
            # `kubectl get deploy -o yaml`.
            - name: gcp-sa
              mountPath: /run/secrets/gcp
              readOnly: true
      volumes:
        - name: gcp-sa
          secret:
            secretName: fleet-bff-gcp
            # Optional so the Deployment schedules on a cluster that has never
            # heard of bundles: without this line a missing Secret is a
            # FailedMount and the BFF never comes up at all.
            optional: true
            # GCP_SA_KEY_PATH must match this key name. 256 = 0o400, written
            # decimal because a leading-zero literal is octal in go-yaml and
            # decimal in a YAML 1.2 parser — the repo's other manifests do the same.
            defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-bff
  namespace: fleet-system
spec:
  selector:
    app: fleet-bff
  ports:
    - name: http
      port: 8080
      targetPort: 8080