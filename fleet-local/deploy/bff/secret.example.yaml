# TEMPLATE ONLY — scripts/50-bff-spa.sh assembles Secret/fleet-bff-env by fetching
# each value inline from the existing in-cluster secrets (never printed, never
# committed). Keys are the exact env names src/config.ts reads.
#   FLEET_DATABASE_URL  postgres fleet_control on flexprice-postgresql (fleet user)
#   FLEET_SESSION_SECRET  random HS256 signing key for the fleet_sess cookie
#   LITELLM_MASTER_KEY  from litellm/litellm-masterkey
#   FLEXPRICE_API_KEY   from the flexprice api secret
#   LANGFUSE_SECRET_KEY from langfuse/langfuse-stores
apiVersion: v1
kind: Secret
metadata:
  name: fleet-bff-env
  namespace: fleet-system
type: Opaque
stringData:
  FLEET_DATABASE_URL: postgres://fleet:REPLACE@flexprice-postgresql.flexprice.svc.cluster.local:5432/fleet_control
  FLEET_SESSION_SECRET: REPLACE_WITH_RANDOM_SECRET
  LITELLM_MASTER_KEY: REPLACE
  FLEXPRICE_API_KEY: REPLACE
  LANGFUSE_SECRET_KEY: REPLACE