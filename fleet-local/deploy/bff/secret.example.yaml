# TEMPLATE ONLY — scripts/50-bff-spa.sh assembles Secret/fleet-bff-env by fetching
# each value inline from the existing in-cluster secrets (never printed, never
# committed). Keys are the exact env names src/config.ts reads.
#   FLEET_DATABASE_URL  postgres fleet_control on flexprice-postgresql (fleet user)
#   FLEET_SESSION_SECRET  random HS256 signing key for the fleet_sess cookie
#   LITELLM_MASTER_KEY  from litellm/litellm-masterkey
#   FLEXPRICE_API_KEY   from the flexprice api secret
#   LANGFUSE_SECRET_KEY from langfuse/langfuse-stores
# A second Secret, fleet-bff-gcp (bottom of this file), carries the bundle builder's
# service account key as a mounted FILE rather than an env var.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-bff-env
  namespace: fleet-system
type: Opaque
stringData:
  FLEET_DATABASE_URL: postgres://fleet:REPLACE@flexprice-postgresql.flexprice.svc.cluster.local:5432/fleet_control
  FLEET_SESSION_SECRET: REPLACE_WITH_RANDOM_SECRET
  LITELLM_MASTER_KEY: REPLACE
  FLEXPRICE_API_KEY: REPLACE
  LANGFUSE_SECRET_KEY: REPLACE
---
# TEMPLATE ONLY — the bundle builder's GCP identity. This is a SEPARATE Secret
# because it is mounted as a FILE (deploy/bff/deployment.yaml -> /run/secrets/gcp/
# sa.json), not folded into fleet-bff-env's env list: a service account key in the
# pod env is readable by anything that can read the Deployment, and the BFF mounts
# fleet-bff-env wholesale via envFrom. The control plane signs its own OAuth token
# from this JSON (clients/gcp.ts:readServiceAccount) — nothing here is a user credential.
#   scripts/50-bff-spa.sh assembles it from a key file the operator points at:
#     GCP_SA_KEY_FILE=~/fleet-bff-bundler.json scripts/50-bff-spa.sh
# Omit GCP_SA_KEY_FILE and this Secret is not created, which is correct while
# BUNDLE_ENABLED is "false": a bundle route without an identity fails at the first
# step rather than booting a pod that cannot start.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-bff-gcp
  namespace: fleet-system
type: Opaque
stringData:
  sa.json: |
    {"type":"service_account","project_id":"REPLACE","private_key_id":"REPLACE",
     "private_key":"REPLACE","client_email":"REPLACE","token_uri":"https://oauth2.googleapis.com/token"}