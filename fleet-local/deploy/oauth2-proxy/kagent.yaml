# oauth2-proxy for kagent.fleet.dev → kagent-ui.kagent.svc:8080 (cross-namespace via
# cluster DNS). Delivers the same verified Authorization + X-Auth-Request-* the
# kagent UI forwards to the controller's trusted-proxy auth (task #9).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-oauth2-proxy
  namespace: fleet-system
  labels:
    app: kagent-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kagent-oauth2-proxy
  template:
    metadata:
      labels:
        app: kagent-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.0
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://accounts.google.com
            - --scope=openid email profile
            - --email-domain=*
            - --cookie-name=_kagent_oauth
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=55m
            - --redirect-url=https://kagent.fleet.dev/oauth2/callback
            - --upstream=http://kagent-ui.kagent.svc.cluster.local:8080
            # Default is 30s; kept aligned with the fleet proxy and the Ingress
            # proxy-read-timeout so no hop is the shortest deadline on the path.
            - --upstream-timeout=1800s
            - --set-xauthrequest=true
            - --set-authorization-header=true
            - --pass-authorization-header=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --whitelist-domain=kagent.fleet.dev
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-oauth2-proxy
  namespace: fleet-system
spec:
  selector:
    app: kagent-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180