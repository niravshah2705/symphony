# TEMPLATE ONLY — do not apply with real values and do not commit real values.
# scripts/00-prereqs.sh creates Secret/google-oauth from user-supplied inputs:
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET  (the Firebase project's GCP Web client)
#   cookie-secret: exactly 16, 24 or 32 RAW characters (openssl rand -hex 16) —
#   oauth2-proxy counts the value verbatim; a 44-char base64 string crash-loops it
# The Google Web client must list these authorized redirect URIs:
#   https://app.fleet.dev/oauth2/callback
#   https://kagent.fleet.dev/oauth2/callback
apiVersion: v1
kind: Secret
metadata:
  name: google-oauth
  namespace: fleet-system
type: Opaque
stringData:
  client-id: REPLACE_WITH_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com
  client-secret: REPLACE_WITH_GOOGLE_WEB_CLIENT_SECRET
  # 32 random bytes, base64-encoded (python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')
  cookie-secret: REPLACE_WITH_BASE64_32_BYTES