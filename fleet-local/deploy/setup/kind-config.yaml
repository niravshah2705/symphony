# fleet-local kind cluster — matches the running flexprice-local node:
#   kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
#   single control-plane, no docker CPU/mem cap, host 80/443 -> node (nginx ingress).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flexprice-local
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
