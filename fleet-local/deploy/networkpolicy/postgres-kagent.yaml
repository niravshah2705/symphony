# LOAD-BEARING for the kagent DB on the shared substrate postgres. The
# substrate NetworkPolicy "postgres" (ns ate-system, helm/bootstrap-owned)
# admits :5432 ONLY from app=ate-api-server, so kagent-controller's migration
# and query connections are packet-dropped (symptom: pgx "dial error: timeout:
# context deadline exceeded" at first start, NOT a TLS/auth error).
# NetworkPolicies union, so this separate allow-policy extends the chart-owned
# one without fighting it across substrate upgrades — do NOT instead patch the
# postgres policy (helm would revert it, silently breaking kagent at step 7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-kagent
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 5432
