<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Fleet</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"
    />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('lm:theme');
          if (['light', 'dark', 'system'].indexOf(p) === -1) p = 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span>AI Fleet</span>
      </div>
      <nav class="tabs" id="tabs">
        <a href="#/business" data-route="business">Business</a>
        <a href="#/projects" data-route="projects">Projects</a>
        <a href="#/board" data-route="board">Board</a>
        <a href="#/agent" data-route="agent">Agent</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="assumed-role" id="assumed-role" hidden></div>
      <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">Checking…</span></div>
      <div class="theme-toggle" id="theme-toggle"></div>
    </header>

    <main id="view" class="view"></main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
